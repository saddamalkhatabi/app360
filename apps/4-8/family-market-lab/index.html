<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#124838">
  <meta name="description" content="سوق تفاعلي للأطفال من ٤ إلى ٨ سنوات، من التعرّف على الأرقام إلى الجمع والطرح والدفع بالنقود.">
  <title>سوق العائلة | مدرسة العائلة 360</title>
  <link rel="icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="journey.css?v=3">
  <script src="../../../assets/js/app360-session-v1.js?v=20261026-independent"></script>
  <script>window.APP360_AI_AUTOLOAD = false;</script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="../../../ages/4-8/index.html" id="app360HomeBtn">
        <span class="brand-mark"><img src="icon.svg" alt="" width="40" height="40"></span>
        <span><strong id="brand-title">سوق العائلة</strong><small id="brand-caption">مدرسة العائلة 360</small></span>
      </a>
      <div class="header-tools">
        <button class="header-button sound-switch" type="button" data-action="sound" id="sound-toggle" aria-pressed="true">
          <span aria-hidden="true" class="speaker-icon"></span><span id="sound-label">الصوت</span>
        </button>
        <button class="header-button" type="button" data-action="language" id="language-toggle" lang="en">English</button>
        <button class="header-button header-progress" type="button" data-action="progress"><span aria-hidden="true">✦</span> <span id="progress-label">رحلتي</span></button>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="heading">
      <div>
        <h1 id="page-title">يومٌ في السوق</h1>
        <p id="page-intro">جهّز طلبات الزبائن، وتعلّم الأرقام وأنت تلعب.</p>
      </div>
      <div class="overall-progress">
        <span id="overall-label">الطلبات المكتملة</span>
        <strong id="overall-number">٠ من ٢٠</strong>
      </div>
    </div>
    <nav id="level-path" class="level-path" aria-label="المستويات"></nav>

    <div class="game">
      <aside class="order-sheet" aria-labelledby="order-title">
        <div class="receipt-top">
          <div><span id="order-index" class="order-index"></span><h2 id="order-title" tabindex="-1">طلب الزبون</h2></div>
          <button type="button" class="listen-button" data-action="listen" id="listen-button" aria-label="اسمع الطلب"><span class="speaker-icon" aria-hidden="true"></span></button>
        </div>
        <p id="order-instruction" class="instruction"></p>
        <div id="order-details" class="order-details"></div>
        <div class="order-controls">
          <button type="button" class="primary-button" id="deliver-button" data-action="deliver"></button>
          <button type="button" class="help-button" id="help-button" data-action="help"><span aria-hidden="true">?</span><span id="help-label">ساعدني</span></button>
        </div>
      </aside>
      <section class="scene" id="scene" aria-label="بسطة السوق والسلة">
        <div class="scene-bar">
          <div id="market-title" class="scene-label"></div>
          <button type="button" class="reset-button" id="reset-button" data-action="reset"></button>
        </div>
        <div class="play-area">
          <section class="stall" aria-labelledby="stall-title" id="stall">
            <div class="awning" aria-hidden="true"></div>
            <h2 id="stall-title" class="stall-sign"></h2>
            <div id="stock" class="stock"></div>
          </section>
          <section class="basket-area" aria-labelledby="basket-title" id="basket-area">
            <div class="basket-top"><h2 id="basket-title"></h2><strong class="counter" id="basket-counter"></strong></div>
            <div class="basket-handle" aria-hidden="true"></div>
            <div class="basket-body" id="basket-body">
              <div id="basket-slots" class="basket-slots"></div>
              <p id="basket-caption" class="basket-caption"></p>
            </div>
          </section>
        </div>
        <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
        <section class="delivered" id="order-done" hidden aria-labelledby="done-title">
          <div aria-hidden="true" class="done-stamp">✓</div>
          <div><h2 id="done-title" tabindex="-1"></h2><p id="done-text"></p></div>
          <button type="button" class="primary-button" id="next-button" data-action="next"></button>
        </section>
      </section>
    </div>

    <div class="game-caption"><span id="play-tip"></span><span id="voice-credit"></span></div>
    <section class="progress-panel" id="progress-panel" hidden aria-labelledby="progress-title">
      <div class="progress-heading">
        <h2 id="progress-title" tabindex="-1"></h2>
        <button class="help-button" type="button" data-action="close-progress" id="close-progress"></button>
      </div>
      <div id="progress-levels" class="progress-levels"></div>
      <div class="progress-tools">
        <a href="classic.html" id="classic-link" class="classic-link"></a>
        <button id="installAppBtn" class="help-button" type="button" style="display:none">تثبيت</button>
        <button id="updateAppBtn" class="help-button" type="button">تحديث</button>
      </div>
    </section>
  </main>

  <footer class="platform-footer">
    <p id="appPwaNotice" role="status"></p>
  </footer>
  <script src="../../../resources/early-child-market-objects/manifest.js?v=2"></script>
  <script src="src/journey-model.js?v=3"></script>
  <script src="journey.js?v=3"></script>
  <script src="../../../assets/js/app360-ai-shell.js?v=107&amp;brand=98"></script>
  <script src="../../../assets/js/app-pwa.js?v=3"></script>
  <script src="../../../assets/js/offline-client-v1.js?v=20261022-pwa2"></script>
  <script src="../../../assets/js/app360-access-v1.js?v=1"></script>
</body>
</html>
