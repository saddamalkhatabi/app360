<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فحص معاينة نلعب ونتفق</title><style>body{margin:0;background:#ddd;font:14px Arial}.controls{position:sticky;top:0;z-index:10;padding:8px;background:#fff;border-bottom:1px solid #aaa;display:flex;flex-wrap:wrap;gap:8px}button,select{padding:9px;min-height:44px}iframe{display:block;border:0;margin:10px auto;background:white;max-width:100%}#report{padding:8px;text-align:center}</style></head><body><div class="controls"><label>حجم الشاشة <select id="size"><option value="360,640">360×640</option><option value="412,915">412×915</option><option value="768,1024">768×1024</option><option value="1024,768">1024×768</option><option value="1366,768">1366×768</option></select></label><button id="a">ملف تجريبي A</button><button id="b">ملف تجريبي B</button><button id="guest">دور ضيف</button><button id="adult">دور مرافق</button><button id="check">فحص العرض</button><button id="reload">إعادة فتح التطبيق</button></div><div id="report" role="status"></div><iframe id="frame" title="التطبيق التجريبي" src="../index.html"></iframe><script>
var profile='coop-browser-test-a',role='parent',focus=false;window.APP360_FAMILY_SYNC={getProfileKey:function(){return profile;},getName:function(){return profile=== 'coop-browser-test-a'?'تجربة A':'تجربة B';},getSession:function(){return {room:'qa-only',role:role,adminRole:role==='parent'?'assistant':''};},getReadingFocus:function(){return focus;},getReadingFocusState:function(){return {enabled:focus,canManage:role==='parent'};},setReadingFocus:function(v){if(role==='parent')focus=v;}};
function resize(){var values=document.getElementById('size').value.split(','),f=document.getElementById('frame');f.style.width=values[0]+'px';f.style.height=values[1]+'px';}document.getElementById('size').onchange=resize;
document.getElementById('a').onclick=function(){profile='coop-browser-test-a';};document.getElementById('b').onclick=function(){profile='coop-browser-test-b';};document.getElementById('guest').onclick=function(){role='guest';};document.getElementById('adult').onclick=function(){role='parent';};document.getElementById('reload').onclick=function(){document.getElementById('frame').contentWindow.location.reload();};document.getElementById('check').onclick=function(){var f=document.getElementById('frame'),d=f.contentDocument,w=f.contentWindow,rect=d.documentElement.getBoundingClientRect();document.getElementById('report').textContent=JSON.stringify({width:w.innerWidth,height:w.innerHeight,scrollWidth:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>w.innerWidth,smallTargets:Array.prototype.filter.call(d.querySelectorAll('button:not(:disabled)'),function(b){var r=b.getBoundingClientRect();return r.width>0&&r.height>0&&r.height<47;}).length,stage:d.querySelector('main h2')&&d.querySelector('main h2').textContent});};resize();
</script></body></html>
