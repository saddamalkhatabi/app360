<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فحص مساحة شاشة الطفل</title><style>body{margin:12px;font:16px Tahoma;background:#e6ece9}label{display:block;margin-bottom:8px}select{padding:8px}iframe{display:block;border:2px solid #26777c;background:white;max-width:100%;margin:auto}</style><label>حجم شاشة الاختبار <select id="size"><option value="360,640">هاتف 360 × 640</option><option value="412,915">هاتف 412 × 915</option><option value="768,1024">لوحي 768 × 1024</option><option value="640,360">هاتف أفقي 640 × 360</option></select></label><iframe title="تطبيق الطفل" id="preview" width="360" height="640" src="../index.html"></iframe><script>document.getElementById('size').onchange=function(){var size=this.value.split(','),frame=document.getElementById('preview');frame.width=size[0];frame.height=size[1];};</script></html>
