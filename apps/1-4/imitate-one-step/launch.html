<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>تشغيل تجربة | دوري ودورك</title></head><body><script src="../../../assets/js/app-link-host.js"></script><script>(function(){'use strict';function click(el){if(!el)return false;try{el.click();return true}catch(e){if(el.onclick){el.onclick();return true}}return false}function xhrJson(url,ok,fail){try{var x=new XMLHttpRequest();x.open('GET',url,true);x.onreadystatechange=function(){if(x.readyState!==4)return;if(x.status>=200&&x.status<300){try{ok(JSON.parse(x.responseText))}catch(e){fail(e)}}else fail(new Error('HTTP '+x.status))};x.send(null)}catch(e){fail(e)}}function later(fn,n){var i=0,t=setInterval(function(){i++;if(fn()||i>(n||30))clearInterval(t)},100)}App360LinkHost.mount({appId:'a1-imitate',title:'دوري ودورك',entry:'index.html',targetRef:function(q){return q.item||q.experience||q.service||q.action||'library'},onReady:function(W,D,q,host){var action=q.action||((q.item||q.experience)?'experience':'library'),target=q.item||q.experience||'';function nodeId(n){while(n&&n!==D){if(n.id)return n.id;n=n.parentNode}return''}D.addEventListener('click',function(e){var id=nodeId(e.target);if(id==='markDone')setTimeout(function(){host.complete({action:'experience',experience:target})},60);if(action==='helper'&&(id==='timerStart'||(e.target&&e.target.getAttribute&&e.target.getAttribute('data-signal'))))host.complete({action:'helper',service:q.service||''})},true);D.addEventListener('mouseup',function(e){if((action==='drawing'||action==='helper')&&e.target&&String(e.target.tagName).toLowerCase()==='canvas')host.complete({action:action,service:q.service||'drawing'})},true);D.addEventListener('touchend',function(e){if((action==='drawing'||action==='helper')&&e.target&&String(e.target.tagName).toLowerCase()==='canvas')host.complete({action:action,service:q.service||'drawing'})},true);if(action==='helper'){later(function(){var b=D.getElementById('helpersBtn');if(!b)return false;click(b);setTimeout(function(){var s=q.service||'timer',tab=D.querySelector('[data-helper-tab="'+s+'"]');if(tab)click(tab);host.ready({action:action,service:s})},80);return true},30);return}if(action==='drawing'){later(function(){var b=D.getElementById('drawingBtn');if(!b)return false;click(b);host.ready({action:action});return true},30);return}if(action==='experience'){xhrJson('experiences.json?v=1',function(data){var rows=data.experiences||[],x=null,i;for(i=0;i<rows.length;i++)if(rows[i].id===target){x=rows[i];break}if(!x){host.fail('experience not found');return}later(function(){var s=D.getElementById('searchInput');if(!s)return false;s.value=x.title;if(s.oninput)s.oninput();setTimeout(function(){var c=D.querySelector('[data-exp="'+target+'"]');if(c){click(c);host.ready({action:action,experience:target,title:x.title})}else host.fail('experience card not rendered')},260);return true},40)},function(){host.fail('experiences unavailable')});return}host.ready({action:'library'})}})})();</script></body></html>
