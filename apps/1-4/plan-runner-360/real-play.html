<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0c3338"><title>اللعب الواقعي | مخطط التشغيل 360</title><style>html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:#eef8f6;color:#14363a}*{box-sizing:border-box}.rp{max-width:760px;margin:0 auto;padding:22px}.rp-card{background:#fff;border:1px solid #cfe2df;border-radius:22px;padding:22px;text-align:center}.rp-k{display:inline-block;background:#e5f5f2;color:#116e69;border-radius:999px;padding:6px 10px;font-weight:700}.rp h1{font-size:30px;margin:14px 0 8px}.rp p{font-size:21px;line-height:1.9;margin:0 0 16px}.rp button{font:inherit;font-weight:800;border:1px solid #a9c7c3;border-radius:14px;background:#fff;padding:12px 16px;min-height:52px;margin:4px}.rp .primary{background:#0f8f8a;color:#fff;border-color:#0f8f8a}.rp small{display:block;color:#667;line-height:1.8;margin-top:14px}.mask{display:none;position:fixed;top:0;right:0;bottom:0;left:0;background:#071b1e;color:#fff;z-index:20;text-align:center;padding:28px}.mask.on{display:block}.mask-inner{max-width:600px;margin:12vh auto 0}.mask .moon{font-size:70px}.mask h2{font-size:28px}.mask p{font-size:20px;line-height:1.9}.mask button{font:inherit;font-weight:800;min-height:54px;border:0;border-radius:14px;padding:12px 18px}@media(max-width:600px){.rp{padding:12px}.rp h1{font-size:25px}.rp p{font-size:18px}}</style></head><body><main class="rp"><section class="rp-card"><span class="rp-k">من الشاشة إلى الواقع</span><h1 id="title">اللعب الواقعي</h1><p id="prompt">تابع مبادرة الطفل وانتظر قبل المساعدة.</p><button id="hideBtn" class="primary" type="button">🌙 أخفِ الشاشة واستمر باللعب</button><button id="doneBtn" type="button">✓ تمت الخطوة</button><small>هذه الشاشة تذكير للمرافق فقط. الطفل لا يحتاج إلى البقاء أمام الجهاز، والتوقف أو التبسيط مسموح دائمًا.</small></section></main><section id="mask" class="mask" aria-hidden="true"><div class="mask-inner"><div class="moon">🌙</div><h2>اللعب أهم من الشاشة الآن</h2><p id="maskPrompt">تابع مبادرة الطفل وانتظر قبل المساعدة.</p><button id="returnBtn" type="button">إظهار التذكير</button></div></section><script>(function(w,d){'use strict';function E(x){return d.getElementById(x)}function q(){var s=(w.location.search||'').replace(/^\?/,''),a=s?s.split('&'):[],o={},i,p;for(i=0;i<a.length;i++){p=a[i].split('=');try{o[decodeURIComponent(p[0]||'')]=decodeURIComponent((p.slice(1).join('=')||'').replace(/\+/g,' '))}catch(e){}}return o}function event(type){var p=q(),k='app360:interop:v1:events',s,a;try{s=w.localStorage;a=JSON.parse(s.getItem(k)||'[]');if(!a||!a.push)a=[];a.push({type:type,app_id:'a1-plan-runner-real-play',launch_id:p.launch_id||'',at:new Date().toISOString()});if(a.length>120)a=a.slice(a.length-120);s.setItem(k,JSON.stringify(a))}catch(e){}}function boot(){var p=q(),text=p.prompt||'تابع مبادرة الطفل وانتظر قبل المساعدة.';E('prompt').innerHTML=text.replace(/</g,'&lt;');E('maskPrompt').innerHTML=text.replace(/</g,'&lt;');if(p.interest)E('title').innerHTML='نلعب مع: '+p.interest.replace(/</g,'&lt;');E('hideBtn').onclick=function(){E('mask').className='mask on';E('mask').setAttribute('aria-hidden','false')};E('returnBtn').onclick=function(){E('mask').className='mask';E('mask').setAttribute('aria-hidden','true')};E('doneBtn').onclick=function(){event('completed');this.innerHTML='✓ تم حفظ الإكمال';this.disabled=true};event('ready')}if(d.readyState==='loading'){if(d.addEventListener)d.addEventListener('DOMContentLoaded',boot,false);else w.attachEvent&&w.attachEvent('onload',boot)}else boot()})(window,document);</script></body></html>
