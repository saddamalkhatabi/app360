<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>تشغيل نشاط رسم | لوحة الطفل</title></head><body><script src="../../../assets/js/app-link-host.js"></script><script>(function(){'use strict';App360LinkHost.mount({appId:'a1-drawing-writing',title:'لوحة الطفل للرسم والكتابة المبكرة',entry:'index.html',targetRef:function(q){return(q.mode||'free')+(q.item?':'+q.item:'')},onReady:function(W,D,q,host){var mode=q.mode||'free',item=q.item||'',modes=W.modes||[],idx=-1,i;for(i=0;i<modes.length;i++)if(modes[i].id===mode){idx=i;break}function complete(){var current='';try{current=W.currentRawItem?W.itemId(W.currentRawItem()):item}catch(e){current=item}host.complete({action:'drawing',mode:mode,item:current})}D.addEventListener('mouseup',function(e){if(e.target&&e.target.id==='draw')complete()},true);D.addEventListener('touchend',function(e){if(e.target&&e.target.id==='draw')complete()},true);if(idx<0){host.fail('mode not found');return}try{W.modeIndex=idx;if(W.refreshMode)W.refreshMode();setTimeout(function(){if(item&&W.itemSelect){W.itemSelect.value=item;if(W.itemSelect.onchange)W.itemSelect.onchange();else{if(W.clearDraw)W.clearDraw();if(W.drawGuide)W.drawGuide()}}host.ready({action:'drawing',mode:mode,item:item})},80)}catch(e){host.fail(e&&e.message?e.message:e)}}})})();</script></body></html>
