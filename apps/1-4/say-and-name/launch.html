<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>تشغيل بطاقة | كلماتي مع أشيائي</title></head><body><script src="../../../assets/js/app-link-host.js"></script><script>(function(){'use strict';function slug(s){return String(s||'').replace(/\s+/g,'-').replace(/[^؀-ۿa-zA-Z0-9-]/g,'').replace(/-+/g,'-')}function click(el){if(!el)return false;try{el.click();return true}catch(e){if(el.onclick){el.onclick();return true}}return false}function findWord(W,word,level){var L=W.APP360_LEVELS||{},found=null,lv,r,i,j,seen={},list=[];for(lv=1;lv<=4;lv++){r=L[String(lv)]||[];for(i=0;i<r.length;i++){var ws=String(r[i][2]||'').split('|');for(j=0;j<ws.length;j++)if(String(ws[j]).replace(/^\s+|\s+$/g,'')===word&&!found)found={first:lv,cat:r[i][0]}}}if(!found)return null;level=parseInt(level,10)||found.first;if(level<found.first)level=found.first;if(level>4)level=4;for(lv=1;lv<=level;lv++){r=L[String(lv)]||[];for(i=0;i<r.length;i++)if(r[i][0]===found.cat){var arr=String(r[i][2]||'').split('|');for(j=0;j<arr.length;j++){var w=String(arr[j]).replace(/^\s+|\s+$/g,'');if(w&&!seen[w]){seen[w]=1;list.push(w)}}}}return{level:level,cat:found.cat,catId:slug(found.cat),index:list.indexOf(word)}}App360LinkHost.mount({appId:'a1-first-words',title:'كلماتي مع أشيائي',entry:'index.html',targetRef:function(q){return q.word||q.item||q.category||q.action||'library'},onReady:function(W,D,q,host){var action=q.action||((q.word||q.item)?'word':'library'),target=q.word||q.item||'';D.addEventListener('click',function(e){var n=e.target;while(n&&n!==D){if(n.id==='stageSpeakBtn'||n.id==='pictureButton'){var name=D.getElementById('itemName');host.complete({action:'word',word:name?(name.textContent||name.innerText||''):target});break}n=n.parentNode}},true);if(q.display){var lb=D.querySelector('[data-lang="'+q.display+'"]');if(lb)click(lb)}if(action==='random'){var rb=D.querySelector('[data-view="random"]');if(rb){click(rb);host.ready({action:action});return}}if(action==='category'){var lev=parseInt(q.level,10)||1,lt=D.querySelector('[data-level="'+lev+'"]');if(lt)click(lt);setTimeout(function(){var cat=q.category||q.item||'',cb=D.querySelector('[data-cat="'+slug(cat)+'"]');if(cb)click(cb);host.ready({action:action,category:cat,level:lev})},80);return}if(action==='word'){var info=findWord(W,target,q.level);if(!info){host.fail('word not found');return}var l=D.querySelector('[data-level="'+info.level+'"]');if(l)click(l);setTimeout(function(){var c=D.querySelector('[data-cat="'+info.catId+'"]');if(c)click(c);setTimeout(function(){var range=D.getElementById('itemRange');if(range&&info.index>=0){range.value=info.index;if(range.oninput)range.oninput();else if(range.onchange)range.onchange()}host.ready({action:action,word:target,category:info.cat,level:info.level,index:info.index})},90)},90);return}host.ready({action:'library'})}})})();</script></body></html>
