<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تجربة نطق SILMA — كلماتي مع أشيائي</title><style>*{box-sizing:border-box}body{margin:0;background:#edf7f4;color:#17343a;font-family:Tahoma,Arial,sans-serif}main{max-width:1000px;margin:auto;padding:16px}header{background:#087f78;color:white;padding:18px;border-radius:20px}h1{font-size:25px;margin:0 0 10px}p{line-height:1.8}aside{background:#fff5d5;border-radius:14px;padding:12px;margin:12px 0;line-height:1.8}article{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center;background:white;border-radius:24px;padding:18px}button{font:inherit;border:0;border-radius:14px;padding:12px;min-height:48px;cursor:pointer;background:#087f78;color:white}button:focus-visible,input:focus-visible{outline:3px solid #e0a700}#picture{display:block;background:#f5fbf9;width:100%;padding:8px}#picture img{display:block;width:100%;height:310px;object-fit:contain;border-radius:18px}.copy{text-align:center}#name{font-size:46px;margin:16px 0}#category{color:#4b6a6a}#stage.listening{outline:4px solid #27b884}#listen{width:100%;font-size:22px}nav{display:flex;gap:10px;margin-top:14px}nav button{flex:1}.tools{display:flex;gap:12px;align-items:center;margin:12px 0;flex-wrap:wrap;background:white;padding:14px;border-radius:14px}input{width:22px;height:22px;vertical-align:middle}.cards{display:flex;overflow-x:auto;gap:10px;padding:10px 0;margin-top:12px}.card{flex:0 0 110px;background:white;color:#17343a;border:2px solid transparent;padding:8px}.card.current{border-color:#087f78}.card img{width:100%;height:85px;object-fit:contain;border-radius:10px}.card span{display:block;margin:8px 0}#status{min-height:28px;text-align:center}@media(max-width:600px){main{padding:10px}article{grid-template-columns:1fr;padding:12px}#picture img{height:240px}#name{font-size:38px}.card{flex-basis:92px}.card img{height:70px}}</style></head><body><main><header><h1>كلماتي مع أشيائي — اختبار صوت SILMA</h1><div>المس الصورة للاستماع إلى النطق العربي الجديد.</div></header><aside>هذه دفعة اختبار جزئية بصوت SILMA الفعلي، وليست الأصوات القديمة. لكل ملف نطق واحد، ويعيده التطبيق بعد وقفة عند تفعيل التكرار. سلامة النطق قيد المراجعة السمعية؛ أخبرنا بالكلمات التي تحتاج تصحيحًا.</aside><div class="tools"><label><input type="checkbox" id="repeat" checked> إعادة النطق بعد وقفة قصيرة</label><span id="count"></span></div><article id="stage"><button id="picture" aria-label="اسمع اسم الصورة"><img id="image" alt=""></button><div class="copy"><h2 id="name"></h2><p id="category"></p><button id="listen">🔊 اسمع الكلمة</button><nav><button id="prev">السابق</button><button id="next">التالي</button></nav><p id="position"></p></div></article><p id="status" role="status"></p><div id="cards" class="cards"></div></main><script src="data/word-images-map.js"></script><script src="data/word-images-context-map.js"></script><script>
'use strict';var words=[{"ar": "أم", "spoken": "أُمّ", "category": "الأسرة", "audio": "audio/silma/words/w_244a9f5147173bd1a9be.mp3", "sha256": "bd6af0779411aba120ec96cbde05b9b6a6c3ca6f8983daa02ed90f5aa6922070"}, {"ar": "أب", "spoken": "أَب", "category": "الأسرة", "audio": "audio/silma/words/w_10060f6f8a26728234e0.mp3", "sha256": "56d2b88310477dbbe11f75418fe2630269e6ae082b93bc3c57f2ed1bfc3d0455"}, {"ar": "طفل", "spoken": "طِفْل", "category": "الأسرة", "audio": "audio/silma/words/w_7585be92d87ca83bc4ad.mp3", "sha256": "2cf39b169c920f1b0877057a21c029c8153a2d48ff76c4eec42d4d7656eb60c7"}, {"ar": "ولد", "spoken": "وَلَد", "category": "الأسرة", "audio": "audio/silma/words/w_ce763e670b0e411d0d19.mp3", "sha256": "a3a29169ef88f9c2f6907a47c1b3b84ee44ea2c71112c23786531a93bb1b7a90"}, {"ar": "بنت", "spoken": "بِنْت", "category": "الأسرة", "audio": "audio/silma/words/w_8f7d8bb5541ca56b2b4e.mp3", "sha256": "113fab01c3df589045c3f669da5e51d0d003b29f091ae0d4e4493c4d599395f0"}, {"ar": "أخ", "spoken": "أَخ", "category": "الأسرة", "audio": "audio/silma/words/w_f8ac19d897aa1101003c.mp3", "sha256": "a90a0d30384b42aabb19e232f3f81a20d5c5a13aef970e33caedcdfa39a22457"}, {"ar": "أخت", "spoken": "أُخْت", "category": "الأسرة", "audio": "audio/silma/words/w_1e150629d646bf2e6c11.mp3", "sha256": "a2f2cac011d71984486a9f4b47200f393348b0b43116c256353f6d22446bb862"}, {"ar": "جد", "spoken": "جَدّ", "category": "الأسرة", "audio": "audio/silma/words/w_aa359f71692cd42fafd6.mp3", "sha256": "652cb1bef9d28b02c8796979911119b5b8f597ac0b9076bd7321483bcbf85e3b"}],index=0,audio=new Audio(),generation=0,pause=null,watch=null;
function picture(w){return 'assets/word-images/'+((window.APP360_WORD_IMAGE_CONTEXT_MAP||{})[w.category+'\u0001'+w.ar]||(window.APP360_WORD_IMAGE_MAP||{})[w.ar])}
function stop(){generation++;clearTimeout(pause);clearTimeout(watch);audio.onended=null;audio.onerror=null;audio.pause();document.getElementById('stage').classList.remove('listening')}
function render(){stop();var w=words[index];document.getElementById('image').src=picture(w);document.getElementById('image').alt=w.ar;document.getElementById('name').textContent=w.spoken;document.getElementById('category').textContent=w.category;document.getElementById('position').textContent=(index+1)+' / '+words.length;document.getElementById('status').textContent='';document.querySelectorAll('.card').forEach(function(b,i){b.classList.toggle('current',i===index)})}
function speak(){stop();var token=generation,w=words[index],round=0;document.getElementById('status').textContent='';document.getElementById('stage').classList.add('listening');function fail(){if(token!==generation)return;stop();document.getElementById('status').textContent='تعذر تحميل تسجيل SILMA. اضغط زر الصوت للمحاولة مرة أخرى.'}function play(){if(token!==generation)return;audio.playbackRate=round?1.05:1;audio.preservesPitch=!round;audio.mozPreservesPitch=!round;audio.webkitPreservesPitch=!round;audio.src=w.audio;audio.onerror=fail;audio.onended=function(){if(token!==generation)return;clearTimeout(watch);if(round===0&&document.getElementById('repeat').checked){round++;document.getElementById('status').textContent='دورك: قل الكلمة';pause=setTimeout(function(){document.getElementById('status').textContent='';play()},1400)}else{document.getElementById('stage').classList.remove('listening')}};watch=setTimeout(fail,20000);audio.load();var p=audio.play();if(p&&p.catch)p.catch(fail)}play()}
words.forEach(function(w,i){var b=document.createElement('button');b.className='card';var img=document.createElement('img');img.src=picture(w);img.alt=w.ar;img.loading='lazy';var label=document.createElement('span');label.textContent=w.ar;b.appendChild(img);b.appendChild(label);b.onclick=function(){index=i;render();speak()};document.getElementById('cards').appendChild(b)});document.getElementById('count').textContent=words.length+' كلمة جاهزة';document.getElementById('picture').onclick=speak;document.getElementById('listen').onclick=speak;document.getElementById('repeat').onchange=stop;document.getElementById('prev').onclick=function(){index=(index-1+words.length)%words.length;render();speak()};document.getElementById('next').onclick=function(){index=(index+1)%words.length;render();speak()};document.addEventListener('visibilitychange',function(){if(document.hidden)stop()});render();
</script></body></html>
