<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سلتي العجيبة - Big TAB</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#eef9f4;color:#174b40}header{height:58px;background:#fff;padding:8px 16px;border-bottom:1px solid #bddfd3}h1{font-size:22px;margin:0}.bar{padding:7px;text-align:center;background:#dff4e9}.bar button,.bar select{height:38px;margin:2px;padding:4px 10px;border:1px solid #9bcbb9;background:#fff;border-radius:8px}.stage{height:330px;margin:8px;position:relative;overflow:hidden;border:3px solid #8ecdb7;background:#dff3ff}.hint{text-align:center;padding:7px;background:#fff}.pieces{position:absolute;left:8px;right:8px;top:48px;height:135px;white-space:nowrap;overflow-x:auto}.piece{display:inline-block;width:100px;height:120px;margin:4px;padding:4px;background:#fff;border:3px solid #fff;vertical-align:top}.piece.sel{border-color:#ffbf00}.piece img{width:86px;height:86px;display:block}.piece span{font-size:11px}.basket{position:absolute;left:50%;margin-left:-90px;bottom:18px;width:180px;height:120px;border:0;background:transparent}.handle{position:absolute;left:38px;top:0;width:100px;height:60px;border:11px solid #86501f;border-bottom:0;border-radius:55px 55px 0 0}.box{position:absolute;left:10px;top:50px;width:160px;height:68px;background:#d89242;border:6px solid #7a431c;border-radius:5px 5px 30px 30px}.count{position:absolute;right:0;bottom:0;background:#fff;border:2px solid #86501f;border-radius:20px;padding:6px}.tray{white-space:nowrap;overflow-x:auto;padding:5px}.item{display:inline-block;width:90px;height:108px;margin:4px;padding:4px;background:#fff;border:2px solid #c8e1d7;vertical-align:top}.item img{display:block;width:76px;height:76px}.item span{font-size:11px}.modal{display:none;position:fixed;left:0;top:0;width:100%;height:100%;background:#31534b;z-index:999}.panel{position:absolute;left:5%;top:5%;width:90%;height:85%;overflow:auto;background:#fff9e9;padding:12px}.inside button{display:inline-block;width:105px;height:125px;margin:5px;background:#fff;border:2px solid #d39b55}.inside img{display:block;width:90px;height:90px}.close{float:left;width:48px;height:40px}.msg{text-align:center;font-size:12px;padding:4px}
</style></head><body><header><h1>سلتي العجيبة</h1></header><div class="bar"><select id="cat"></select><button id="ar">العربية</button><button id="en">English</button><button id="open">افتح السلة</button></div><div class="stage"><div class="hint">المس صورة بالأسفل فتظهر هنا، ثم المسها وبعدها المس السلة</div><div id="pieces" class="pieces"></div><button id="basket" class="basket"><i class="handle"></i><i class="box"></i><b id="count" class="count">0</b></button></div><div id="tray" class="tray"></div><div id="msg" class="msg"></div><div id="modal" class="modal"><div class="panel"><button id="close" class="close">X</button><h2 id="insideTitle">محتويات السلة</h2><div id="inside" class="inside"></div></div></div>
<script src="../say-and-name/data/word-images-map.js"></script><script src="../say-and-name/data/audio-map.js"></script><script src="../say-and-name/data/audio-map-en.js"></script><script>
(function(w,d){var M=w.APP360_WORD_IMAGE_MAP||{},A=w.APP360_AUDIO_MAP||{},AE=w.APP360_AUDIO_MAP_EN||{},base='../say-and-name/assets/word-images/',lang='ar',sel=null,basket=[],cats=[['الألعاب',['كرة','دمية','سيارة','بالون','أحجية','طبلة','مكعب','طائرة ورقية']],['الفواكه',['تفاح','موز','برتقال','عنب','فراولة','بطيخ','مانجو','تمر']],['الحيوانات',['قطة','كلب','طائر','سمكة','أرنب','حصان','أسد','فيل']],['المنزل',['كوب','كتاب','كرسي','ملعقة','حذاء','فرشاة','منشفة','مفتاح']],['النقل',['سيارة','حافلة','شاحنة','دراجة','قطار','طائرة','سفينة','قارب']],['الطبيعة',['شمس','قمر','شجرة','زهرة','حجر','بحر','سحابة','مطر']]],ci=0;function E(x){return d.getElementById(x)}function src(wd){return base+(M[wd]||'w0037.jpg')}function audio(wd){try{var mp=lang==='en'?AE:A,s=mp[wd];if(s){var a=new Audio('../say-and-name/'+s);a.play()}}catch(e){}}function add(wd){var b=d.createElement('button');b.className='piece';b.setAttribute('data-word',wd);b.innerHTML='<img src="'+src(wd)+'"><span>'+wd+'</span>';b.onclick=function(){if(sel)sel.className='piece';sel=b;b.className='piece sel';audio(wd)};b.ontouchstart=function(e){b.onclick();if(e.preventDefault)e.preventDefault()};E('pieces').appendChild(b);audio(wd);E('msg').innerHTML='تمت إضافة '+wd+' إلى مساحة اللعب'}function drawTray(){var t=E('tray'),a=cats[ci][1];t.innerHTML='';for(var i=0;i<a.length;i++){(function(wd){var b=d.createElement('button');b.className='item';b.innerHTML='<img src="'+src(wd)+'"><span>'+wd+'</span>';b.onclick=function(){add(wd)};b.ontouchstart=function(e){add(wd);if(e.preventDefault)e.preventDefault()};t.appendChild(b)})(a[i])}}function drawInside(){var x=E('inside');x.innerHTML='';for(var i=0;i<basket.length;i++){(function(ix){var wd=basket[ix],b=d.createElement('button');b.innerHTML='<img src="'+src(wd)+'"><span>'+wd+'</span>';b.onclick=function(){basket.splice(ix,1);E('count').innerHTML=basket.length;add(wd);drawInside()};b.ontouchstart=function(e){b.onclick();if(e.preventDefault)e.preventDefault()};x.appendChild(b)})(i)}}f </script></body></html>
