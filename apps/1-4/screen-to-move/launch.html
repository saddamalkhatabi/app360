<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f8f8a"><title>تشغيل لعبة أو مسار | ألعاب إبداعية | مدرسة العائلة 360</title></head><body>
<script src="../../../assets/js/app-link-host.js"></script>
<script>
(function(){'use strict';
var query=App360LinkHost.query(),parts=[],allowed=['launch_age','launch_level','letter','phonics_letter','word','sentence'];
for(var i=0;i<allowed.length;i++)if(query[allowed[i]])parts.push(allowed[i]+'='+encodeURIComponent(query[allowed[i]]));
function later(fn){var i=0,t=setInterval(function(){if(fn()||++i>50)clearInterval(t)},100)}
function click(n){if(!n)return false;n.click();return true}
App360LinkHost.mount({appId:'a1-screen-move',title:'ألعاب إبداعية · لعبة أو تدريب آلي',entry:'index.html?v=34'+(parts.length?'&'+parts.join('&'):''),targetRef:function(q){return q.coach_route||q.item||q.game||q.level||q.service||q.action||'library'},onReady:function(W,D,q,host){
var action=q.action||(q.coach_route?'session':q.item||q.game?'game':'library'),target=q.item||q.game||'';
D.addEventListener('app360:creative:complete',function(e){var v=e.detail||{};if(action==='session')host.emit('activity-completed',v);else if(action==='game'&&v.gameId===target&&v.finished)host.complete({action:'game',game:target,session_id:v.sessionId,source:'verified-round-completion',mode:v.mode})},false);
D.addEventListener('app360:creative-coach:sessioncomplete',function(e){var v=e.detail||{};if(action!=='session')return;if(v.completed>0)host.complete({action:'session',route:v.routeId,completed:v.completed,remaining_seconds:v.remaining_seconds,source:'guided-session'});else host.emit('session-ended-without-completion',v)},false);
D.addEventListener('click',function(e){var n=e.target,id='';while(n&&n!==D){if(n.id){id=n.id;break}n=n.parentNode}if(id==='designerSave'||id==='designerPrint')host.complete({action:'worksheet-designer',game:target,control:id});if(action==='game-designer'&&String(e.target.textContent||'').indexOf('حفظ')>=0)host.complete({action:'game-designer',confirmed_by_user:true})},true);
if(action==='session'){later(function(){if(!W.CreativeCoach)return false;var id=q.coach_route||(q.launch_age==='4-8'?'school-balanced':'nursery-balanced');if(W.CreativeCoach.start({route:id,age:q.launch_age,duration_seconds:q.duration_seconds||q.seconds||300,autoplay:q.autoplay!=='0'}))host.ready({action:'session',route:id});else host.fail('route not found');return true});return}
function openGame(cb){later(function(){if(!W.CreativeGames)return false;var found=W.CreativeGames.games().some(function(g){return g.id===target});if(!found){host.fail('game not found');return true}W.CreativeGames.open(target);if(cb)cb();host.ready({action:action,game:target});return true})}
if(action==='game'){openGame();return}
if(action==='level'){later(function(){if(!W.CreativeGames)return false;W.CreativeGames.setLevel(Number(q.level||q.item)||1);host.ready({action:action,level:W.CreativeGames.level()});return true});return}
if(action==='worksheets'){later(function(){if(!click(D.getElementById('worksheetsBtn')))return false;host.ready({action:action});return true});return}
if(action==='worksheet-designer'){if(target)openGame(function(){click(D.getElementById('drawingBtn'))});else later(function(){if(!click(D.getElementById('drawingBtn')))return false;host.ready({action:action});return true});return}
if(action==='game-designer'){later(function(){if(!click(D.getElementById('gameDesignerBtn')))return false;host.ready({action:action});return true});return}
host.ready({action:'library'});
}});
})();
</script></body></html>
