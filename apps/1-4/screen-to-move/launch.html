<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>تشغيل لعبة | ألعاب إبداعية</title></head><body><script src="../../../assets/js/app-link-host.js"></script><script>(function(){'use strict';function click(el){if(!el)return false;try{el.click();return true}catch(e){if(el.onclick){el.onclick();return true}}return false}function later(fn,n){var i=0,t=setInterval(function(){i++;if(fn()||i>(n||30))clearInterval(t)},100)}App360LinkHost.mount({appId:'a1-screen-move',title:'ألعاب إبداعية',entry:'index.html',targetRef:function(q){return q.item||q.game||q.service||q.action||'library'},onReady:function(W,D,q,host){var action=q.action||((q.item||q.game)?'game':'library'),target=q.item||q.game||'';function idOf(n){while(n&&n!==D){if(n.id)return n.id;n=n.parentNode}return''}function openGame(id,cb){var rows=W.A1ScreenMoveGames||[],g=null,i;for(i=0;i<rows.length;i++)if(rows[i].id===id){g=rows[i];break}if(!g){host.fail('game not found');return}var lv=D.querySelector('[data-level="'+g.level+'"]');if(lv)click(lv);setTimeout(function(){var card=D.querySelector('[data-game="'+id+'"]');if(card){click(card);if(cb)setTimeout(cb,100)}else host.fail('game card not rendered')},100)}D.addEventListener('click',function(e){var id=idOf(e.target),txt=String((e.target&&((e.target.textContent||e.target.innerText)))||'');if(id==='finishScreen')setTimeout(function(){host.complete({action:'game',game:target})},80);if(id==='designerSave'||id==='designerPrint')host.complete({action:'worksheet-designer',game:target,control:id});if(action==='game-designer'&&txt.indexOf('حفظ')>=0)host.complete({action:'game-designer'})},true);if(action==='game'){openGame(target,function(){host.ready({action:action,game:target})});return}if(action==='worksheets'){later(function(){var b=D.getElementById('worksheetsBtn');if(!b)return false;click(b);host.ready({action:action});return true},30);return}if(action==='worksheet-designer'){if(target){openGame(target,function(){var b=D.getElementById('drawingBtn');if(b){click(b);host.ready({action:action,game:target})}})}else later(function(){var b=D.getElementById('drawingBtn');if(!b)return false;click(b);host.ready({action:action});return true},30);return}if(action==='game-designer'){later(function(){var b=D.getElementById('gameDesignerBtn');if(!b)return false;click(b);host.ready({action:action});return true},30);return}host.ready({action:'library'})}})})();</script></body></html>
