<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مراجعة نطق الكلمات — مدرسة العائلة 360</title><style>body{font-family:Tahoma,Arial;background:#f4f7fc;color:#17302f;margin:0;padding:20px;line-height:1.8}main{max-width:1100px;margin:auto}h1{font-size:26px}.notice{background:#fff4cf;padding:18px;border-radius:18px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}button,select{font:inherit;padding:10px 15px;border-radius:12px;border:1px solid #bfd2e9;background:white;min-height:46px;cursor:pointer}.grid{display:flex;flex-wrap:wrap;gap:14px}.card{background:white;border-radius:18px;padding:16px;width:280px;max-width:100%;box-sizing:border-box;border:2px solid #dce5ef}.glyph{font-size:58px;font-weight:bold;text-align:center;line-height:1.8}.card audio{width:100%;margin:8px 0}.status{font-size:14px;min-height:26px}.clear{border-color:#168352}.fix{border-color:#c84c3f}.actions{display:flex;gap:8px}.actions button{flex:1}a{color:#116ba1}small{display:block}</style><main><h1 id="heading">مراجعة نطق الكلمات</h1><p id="notice" class="notice">هذه صفحة للمدرب لمراجعة التسجيلات قبل الاعتماد التعليمي النهائي. فحوص سلامة الملفات آلية، وليست مراجعة سمعية بشرية. استمع وتأكد من الحركة، وغياب صوت حرف زائد، وسلامة السكون والشدة والمد والتنوين. العلامات تحفظ على هذا الجهاز فقط.</p><nav><select id="reviewLanguage"><option value="ar">العربية</option><option value="en">English</option></select><select id="stage"><option value="all">كل الكلمات</option><option value="short">البداية</option><option value="rest">السكون والشدة</option><option value="long">المد</option><option value="more">كلمات أطول</option></select><button id="export">تنزيل تقرير المراجعة</button><a id="openLevel" href="index.html?launch_age=4-8&amp;launch_level=7">فتح المستوى السابع</a></nav><p id="summary"></p><div id="grid" class="grid"></div></main><script src="words-data-v31.js?v=31"></script><script>
