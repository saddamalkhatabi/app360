name: Finish verified Story SILMA preview with local English guides
on:
  push:
    branches: [preview/story-silma-20261018]
    paths: [.github/workflows/finish-story-silma.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: finish-story-silma-preview
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/story-silma-20261018
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local English engine and real word aligner
        run: |
          python -m pip install --no-cache-dir torch==2.6.0+cpu torchaudio==2.6.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir kokoro-onnx==0.6.1 soundfile numpy
          mkdir -p /tmp/story-en-model
          curl --fail --location --retry 3 --silent --show-error https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx -o /tmp/story-en-model/model.onnx
          curl --fail --location --retry 3 --silent --show-error https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin -o /tmp/story-en-model/voices.bin
          python apps/4-8/story-language-lab/tools/record_english_guides.py
      - name: Wait for Arabic recordings already running; do not regenerate completed work
        run: |
          python - <<'PY'
          import json,subprocess,time
          for attempt in range(420):
            data=json.loads(subprocess.check_output(['gh','api','repos/saddamalkhatabi/app360/actions/runs/39163353612/jobs?per_page=100']))
            jobs=[j for j in data['jobs'] if j['name'].startswith('record (')]
            done=[j for j in jobs if j['status']=='completed']
            print('Arabic batches finished:',len(done),'of',len(jobs),flush=True)
            if len(done)==20:
              assert all(j['conclusion']=='success' for j in done),[(j['name'],j['conclusion']) for j in done]
              break
            time.sleep(20)
          else:raise RuntimeError('Arabic recording batches are still incomplete')
          PY
          gh run download 39163353612 --repo saddamalkhatabi/app360 --pattern 'story-silma-*' --dir /tmp/story-output
      - name: Validate all recordings and activate only the review branch
        run: |
          python apps/4-8/story-language-lab/tools/silma_story.py activate /tmp/story-output
          node --check apps/4-8/story-language-lab/app.js
          npm test --prefix apps/4-8/story-language-lab
      - name: Save verified audio and feedback
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/4-8/story-language-lab/app.js apps/4-8/story-language-lab/index.html apps/4-8/story-language-lab/audio/ apps/4-8/story-language-lab/data/stories.json apps/4-8/story-language-lab/data/stories.js apps/4-8/story-language-lab/data/audio-manifest.json apps/4-8/story-language-lab/data/read-along/ apps/4-8/story-language-lab/data/silma-validation.json data/offline/a4-story-language.json data/offline-catalog.json
          git commit -m 'Activate complete SILMA Story and Word narration and useful spoken feedback'
          git push origin HEAD:preview/story-silma-20261018
