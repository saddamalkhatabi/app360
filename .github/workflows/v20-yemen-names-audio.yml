name: V20 Yemeni Male Name Audio

on:
  push:
    paths:
      - '.github/workflows/v20-yemen-names-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install audio tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install edge-tts
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg
          fi

      - name: Generate 20 Yemeni male name packs
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/v20_yemen_names.py

      - name: Validate V20
        shell: bash
        run: |
          set -euo pipefail
          node --check 1-4/audio-v20.js
          grep -q 'audio-v20.js?v=20' 1-4/index.html
          grep -q "var CACHE='app360-1-4-v20'" 1-4/sw.js
          test -s 1-4/audio/names/saddam/test.mp3
          test -s 1-4/audio/names/ghaith/cheer-01.wav
          test -s 1-4/audio/pcm/mohammed.js
          test -s 1-4/audio/pcm/abdulmalik.js
          python - <<'PY'
          import json
          r=json.load(open('1-4/audio/registry.json',encoding='utf-8'))
          required=['غيث','صدام','محمد','أحمد','عبدالله','عبدالرحمن','علي','يوسف','عبدالملك']
          assert all(x in r['users'] for x in required)
          names=r['common_male_names_yemen']
          assert len(names)==20 and len(set(names))==20
          assert all(len(r['users'][n]['clips'])>=6 for n in names)
          assert json.load(open('1-4/version.json',encoding='utf-8'))['build']==20
          print('V20 validation OK:', ', '.join(names))
          PY

      - name: Commit V20
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 1-4 .github/scripts/v20_yemen_names.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add 20 Yemeni male recorded name audio packs"
          git push
