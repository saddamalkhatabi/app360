name: Publish the first genuine SILMA single-pronunciation word
on:
  push:
    branches: [preview/say-name-single-voice-20261014]
    paths: [.github/workflows/record-silma-single-one.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: silma-single-one
  cancel-in-progress: true
jobs:
  record-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Single-word CPU generation uses native FP32 rather than emulated BF16.
    env:
      HF_HOME: /tmp/silma-hf
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SILMA CPU environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libavcodec-dev libavformat-dev libavutil-dev
          python -m pip install --no-cache-dir torch==2.6.0+cpu torchaudio==2.6.0+cpu torchvision==0.21.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir torchcodec==0.2.1 --index-url https://download.pytorch.org/whl/cpu
          printf 'torch==2.6.0+cpu\ntorchaudio==2.6.0+cpu\ntorchvision==0.21.0+cpu\ntorchcodec==0.2.1\ntransformers==4.51.3\nhuggingface-hub==0.36.0\n' >/tmp/silma-constraints.txt
          python -m pip install --no-cache-dir -c /tmp/silma-constraints.txt --extra-index-url https://download.pytorch.org/whl/cpu silma-tts==1.0.5 uroman huggingface-hub
      - name: Download publisher models
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id='silma-ai/silma-tts',revision='226dd7a65cadf51f9a6dbe3953fc89003b3844d5',allow_patterns=['*.pt','*.safetensors','*.json','*.txt','*.yaml','*.wav','*.model'])
          snapshot_download(repo_id='charactr/vocos-mel-24khz')
          import os,pathlib
          p=pathlib.Path(os.environ['HF_HOME'])/'hub/models--silma-ai--silma-tts/refs/main'
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text('226dd7a65cadf51f9a6dbe3953fc89003b3844d5')
          PY
      - name: Record exact authored vocabulary and instructions
        run: python apps/1-4/say-and-name/tools/generate_silma.py --part 0 --parts 1 --limit 1
      - name: Verify the first actual single-pronunciation clips
        run: |
          python apps/1-4/say-and-name/tools/build-listening-test.py apps/1-4/say-and-name/audio/silma
          python - <<'PYCODE'
          import json,pathlib,shutil
          root=pathlib.Path('apps/1-4/say-and-name');report=json.loads((root/'audio/silma/part-0.json').read_text());row=report['items'][0]
          destination=root/'audio/silma-single-one/mother.mp3';destination.parent.mkdir(exist_ok=True);shutil.copyfile(root/row['path'],destination)
          page=(root/'silma-listening-test.html').read_text().replace(row['path'],'audio/silma-single-one/mother.mp3')
          (root/'silma-one-listening-test.html').write_text(page)
          PYCODE
          cp apps/1-4/say-and-name/audio/silma/part-0.json apps/1-4/say-and-name/audio/silma-one-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: silma-single-one-verified
          path: |
            apps/1-4/say-and-name/audio/silma/part-0.json
            apps/1-4/say-and-name/audio/silma-single-one/
            apps/1-4/say-and-name/silma-one-listening-test.html
      - name: Publish the corrected sample to the test branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/1-4/say-and-name/audio/silma-single-one/ apps/1-4/say-and-name/audio/silma-one-validation.json apps/1-4/say-and-name/silma-one-listening-test.html
          git commit -m 'Publish one verified SILMA single-pronunciation recordings for listening approval'
          git pull --rebase origin preview/say-name-single-voice-20261014
          git push origin HEAD:preview/say-name-single-voice-20261014
