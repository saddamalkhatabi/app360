name: Prepare YEM1 bridge offline records
on:
  push:
    branches: ['codex/yem1-hosted-exploration-20261029']
    paths: ['.github/workflows/prepare-yem1-offline-temporary.yml']
permissions:
  contents: read
jobs:
  refresh:
    if: github.repository == 'saddamalkhatabi/app360' && github.ref == 'refs/heads/codex/yem1-hosted-exploration-20261029'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Refresh shared records without rebuilding or dropping app media
        run: node tooling/refresh-reels-offline.js
      - name: Verify generated bridge records
        run: node tooling/refresh-reels-offline.js --check
      - name: Commit generated manifests to this preparation branch only
        run: |
          git add -- data/offline-catalog.json data/offline/*.json
          if git diff --cached --quiet; then exit 0; fi
          if git diff --cached --name-only | grep -Ev '^data/(offline-catalog[.]json|offline/[^/]+[.]json)$'; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Refresh exact published offline bridge records"
          git push origin HEAD:refs/heads/codex/yem1-hosted-exploration-20261029
