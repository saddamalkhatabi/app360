name: Deploy App360 approved logo assets
on:
  push:
    paths: ['.github/workflows/deploy-approved-logo.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate production brand assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('assets/brand')
          p.mkdir(parents=True,exist_ok=True)
          icon=Image.open(p/'app360-lab-icon-192.png').convert('RGB')
          resampling=getattr(Image,'Resampling',Image).LANCZOS
          icon.resize((512,512),resampling).save(p/'app360-lab-icon-512.png',optimize=True)
          icon.resize((180,180),resampling).save(p/'app360-lab-icon-180.png',optimize=True)
          icon.resize((64,64),resampling).save(p/'favicon-64.png',optimize=True)
          icon.resize((32,32),resampling).save(p/'favicon-32.png',optimize=True)
          icon.resize((64,64),resampling).save(p/'favicon.ico',format='ICO',sizes=[(64,64),(32,32),(16,16)])
          logo=Image.open(p/'app360-lab-logo.webp').convert('RGB')
          logo.thumbnail((520,520),resampling)
          canvas=Image.new('RGB',(1200,630),'#F8FBFB')
          canvas.paste(logo,((1200-logo.width)//2,(630-logo.height)//2))
          canvas.save(p/'app360-lab-og.jpg',quality=88,optimize=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/brand/app360-lab-icon-512.png assets/brand/app360-lab-icon-180.png assets/brand/favicon.ico assets/brand/favicon-64.png assets/brand/favicon-32.png assets/brand/app360-lab-og.jpg
          git commit -m 'Generate approved App360 PWA brand assets' || exit 0
          git push
