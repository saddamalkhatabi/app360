name: Finalize approved App 360 brand assets
on:
  push:
    paths: ['.github/workflows/deploy-approved-logo.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build favicon and social preview from approved identity
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('assets/brand')
          resampling=Image.Resampling.LANCZOS
          icon=Image.open(p/'app360-lab-icon-512.png').convert('RGB')
          icon.resize((64,64),resampling).save(p/'favicon.ico',format='ICO',sizes=[(64,64),(32,32),(16,16)])
          logo=Image.open(p/'app360-lab-logo.webp').convert('RGB')
          logo.thumbnail((520,520),resampling)
          canvas=Image.new('RGB',(1200,630),'#F8FBFB')
          canvas.paste(logo,((1200-logo.width)//2,(630-logo.height)//2))
          canvas.save(p/'app360-lab-og.jpg',quality=90,optimize=True)
          PY
      - name: Remove this one-time workflow
        run: rm -f .github/workflows/deploy-approved-logo.yml
      - name: Commit final brand assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize approved App360 favicon and social preview' || exit 0
          git push
