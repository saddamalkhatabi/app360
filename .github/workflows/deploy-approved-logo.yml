name: Deploy App360 approved logo assets
on:
  push:
    paths: ['.github/workflows/deploy-approved-logo.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
      - name: Generate production brand assets
        run: |
          set -euo pipefail
          mkdir -p assets/brand
          convert assets/brand/app360-lab-icon-192.png -resize 512x512 -strip assets/brand/app360-lab-icon-512.png
          convert assets/brand/app360-lab-icon-192.png -resize 180x180 -strip assets/brand/app360-lab-icon-180.png
          convert assets/brand/app360-lab-icon-192.png -resize 64x64 /tmp/i64.png
          convert assets/brand/app360-lab-icon-192.png -resize 32x32 /tmp/i32.png
          convert /tmp/i64.png /tmp/i32.png assets/brand/favicon.ico
          convert -size 1200x630 xc:'#F8FBFB' \
            \( assets/brand/app360-lab-logo.webp -resize 520x520 \) \
            -gravity center -composite -strip -quality 88 assets/brand/app360-lab-og.jpg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/brand/app360-lab-icon-512.png assets/brand/app360-lab-icon-180.png assets/brand/favicon.ico assets/brand/app360-lab-og.jpg
          git commit -m 'Generate approved App360 PWA brand assets' || exit 0
          git push
