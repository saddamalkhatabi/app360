name: Age 1-4 plans and catalog v24

on:
  push:
    paths:
      - '.github/workflows/apply-age-1-4-plans-v24.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply age 1-4 catalog upgrade
        run: python3 tooling/apply-age-1-4-plans-v24.py
      - name: Regenerate planning files
        run: node tooling/build-blueprints.js
      - name: Validate platform
        run: |
          node tooling/validate-platform.js
          node tooling/build-blueprints.js --check
          pnpm --filter @app360/app-screen-to-move validate
          git diff --check
      - name: Commit upgrade and remove temporary tooling
        run: |
          git config user.name "app360-bot"
          git config user.email "app360-bot@users.noreply.github.com"
          git rm -f tooling/apply-age-1-4-plans-v24.py .github/workflows/apply-age-1-4-plans-v24.yml
          git add -A
          git commit -m "Upgrade age 1-4 app descriptions and build plans"
          git push origin HEAD:main
