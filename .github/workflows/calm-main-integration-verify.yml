name: Calm Main Integration Verification
on:
  push:
    branches:
      - release/calm-main-integration-20261011
    paths:
      - '.github/workflows/calm-main-integration-verify.yml'
      - 'apps/1-4/calm-with-me/**'
      - 'data/offline/a1-calm.json'
      - 'data/offline-catalog.json'
permissions:
  contents: read
jobs:
  calm-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and offline asset verification
        run: |
          node --check apps/1-4/calm-with-me/simple-mode-v12-original.js
          node --check apps/1-4/calm-with-me/calm-photo-helps-v1.js
          node --check apps/1-4/calm-with-me/calm-silma-controller-serial-v1.js
          node --check apps/1-4/calm-with-me/age-content-v8.js
          python3 apps/1-4/calm-with-me/tooling/verify-child-journey-v2.py
      - name: Validate a1-calm catalog integrity
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('data/offline/a1-calm.json').read_text())
          b=json.loads(Path('data/offline-catalog.json').read_text())
          c=next(x for x in b['apps'] if x['id']=='a1-calm')
          assert a['version']==c['version']
          assert len(a['files'])==c['count']
          assert len([x for x in a['files'] if '/assets/images/' in x['path'] and x['path'].endswith('.webp')])>=38
          src=Path('apps/1-4/calm-with-me/data/content.js').read_text()
          assert "id:'happy',label_ar:'سعيد'" in src
          print('PASS: main integration manifest and سعيد label')
          PY
      - name: Prepare mobile browser
        run: |
          npm install --prefix /tmp/calm-release-e2e --no-audit --no-fund playwright@1.56.1
          /tmp/calm-release-e2e/node_modules/.bin/playwright install chromium
      - name: Check child cards, MP3 and coach access on phones/tablets
        env:
          NODE_PATH: /tmp/calm-release-e2e/node_modules
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory . >/tmp/calm-release-http.log 2>&1 &
          node apps/1-4/calm-with-me/tooling/e2e-child-v2.cjs
      - name: Save visual smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calm-main-integration-screenshots
          path: /tmp/calm-child-*.png
          if-no-files-found: ignore
