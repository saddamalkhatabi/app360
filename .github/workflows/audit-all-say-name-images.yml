name: Audit All Say and Name Word Images

on:
  push:
    branches:
      - fix/say-name-image-semantic-mapping-v24
    paths:
      - .github/workflows/audit-all-say-name-images.yml
      - apps/1-4/say-and-name/tools/audit_all_word_images.py

permissions:
  contents: write

concurrency:
  group: audit-all-say-name-images-v24
  cancel-in-progress: true

jobs:
  audit-all:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install semantic audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchvision==0.21.0
          python -m pip install transformers==4.49.0 pillow==11.1.0

      - name: Audit all 985 word images
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: python apps/1-4/say-and-name/tools/audit_all_word_images.py

      - name: Print high-confidence candidates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('apps/1-4/say-and-name/data/all-image-semantic-audit.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          print('audited', d['audited_word_count'])
          print('reciprocal candidates', len(d['reciprocal_candidates']))
          for row in d['reciprocal_candidates'][:40]:
              print('RECIPROCAL', json.dumps(row, ensure_ascii=False))
          print('strong suspects', len(d['strong_suspects']))
          for row in d['strong_suspects'][:40]:
              print('STRONG', json.dumps(row, ensure_ascii=False))
          PY

      - name: Commit full semantic audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/1-4/say-and-name/data/all-image-semantic-audit.json \
                  apps/1-4/say-and-name/IMAGE_ALL_WORDS_AUDIT_AR.md
          if git diff --cached --quiet; then
            echo "No audit output changes."
            exit 0
          fi
          git commit -m "Audit all Say and Name word images semantically"
          git pull --rebase origin \${GITHUB_REF_NAME}
          git push origin HEAD:\${GITHUB_REF_NAME}
