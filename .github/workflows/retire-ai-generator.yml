name: Verify retired AI generator
on:
  push:
    branches: [preview/wonder-silma-watch-20261018]
    paths:
      - .github/workflows/retire-ai-generator.yml
      - tooling/test-retired-ai.cjs
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check generator retirement and retained learning behavior
        run: |
          node tooling/test-retired-ai.cjs
          node tooling/test-legacy-touch-guard.js
          node apps/4-8/wonder-experiment-lab/test/model.test.cjs
          node apps/4-8/wonder-experiment-lab/test/watch.test.cjs
          node apps/4-8/wonder-experiment-lab/test/watch-integration.test.cjs
      - name: Refresh offline inventories from complete repository
        run: |
          node tooling/build-offline-catalog.js
          node tooling/refresh-reels-offline.js
          node tooling/refresh-reels-offline.js --check
      - name: Verify offline inventory integrity
        run: |
          node - <<'JS'
          const fs=require('fs'),crypto=require('crypto'),assert=require('assert');
          const c=JSON.parse(fs.readFileSync('data/offline-catalog.json'));
          for(const a of c.apps){const b=JSON.parse(fs.readFileSync(a.manifest));for(const f of b.files){assert(!/ai-content-studio|ai-account-bridge|ai-native-adapter|ai-content-contracts/.test(f.path),f.path);assert.equal(crypto.createHash('sha256').update(fs.readFileSync(f.path)).digest('hex'),f.sha256,f.path);}}
          console.log('PASS: all offline targets reference existing, current files; no retired generator files.');
          JS
      - name: Persist refreshed offline inventories on preview branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/offline data/offline-catalog.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh offline inventories after retiring AI generator'
            git push origin HEAD:preview/wonder-silma-watch-20261018
          fi
