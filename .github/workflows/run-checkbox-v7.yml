name: Run checkbox refinement v7

on:
  push:
    paths:
      - '.github/workflows/run-checkbox-v7.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply refinement
        run: python3 tooling/tmp_refine_checkboxes_v7.py
      - name: Regenerate planning documents
        run: node tooling/build-blueprints.js
      - name: Validate
        run: |
          node tooling/validate-platform.js
          pnpm --filter @app360/app-screen-to-move validate
          git diff --check
      - name: Commit result and remove temporary tooling
        run: |
          git config user.name "app360-bot"
          git config user.email "app360-bot@users.noreply.github.com"
          git rm tooling/tmp_refine_checkboxes_v7.py .github/workflows/run-checkbox-v7.yml .github/workflows/refine-small-checkboxes-v7.yml
          git add -A
          git commit -m "Refine checkmark controls for young children in v7"
          git push origin HEAD:main
