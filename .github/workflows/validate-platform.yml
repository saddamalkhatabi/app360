name: Validate App 360 Lab

on:
  push:
    paths:
      - 'README.md'
      - 'index.html'
      - 'ages/**'
      - 'apps/**'
      - 'assets/**'
      - 'bundles/**'
      - 'data/**'
      - 'docs/**'
      - 'packages/**'
      - 'resources/**'
      - 'services/**'
      - 'tooling/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.github/scripts/validate-platform.js'
      - '.github/workflows/validate-platform.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'index.html'
      - 'ages/**'
      - 'apps/**'
      - 'assets/**'
      - 'bundles/**'
      - 'data/**'
      - 'docs/**'
      - 'packages/**'
      - 'resources/**'
      - 'services/**'
      - 'tooling/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.github/scripts/validate-platform.js'
      - '.github/workflows/validate-platform.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          pnpm --version
      - name: Verify shared workspace lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate platform architecture, catalogs and live routes
        run: pnpm validate
