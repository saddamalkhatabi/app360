name: Verify and Download Complete Calm Bilingual MP3
on:
  push:
    branches: [feature/age1-4-silma-calm-serial-20261009]
    paths:
      - apps/1-4/calm-with-me/audio/bilingual/complete-ready.json
      - .github/workflows/package-calm-bilingual-final.yml
      - .github/workflows/package-calm-bilingual-final.yml
permissions:
  contents: read
jobs:
  qa-bilingual-mp3:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/age1-4-silma-calm-serial-20261009
      - name: Install media validator
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Verify every built-in audio event has Arabic and English MP3
        run: |
          node apps/1-4/calm-with-me/tools/finalize-bilingual-audio.cjs --require-complete
          node apps/1-4/calm-with-me/tools/test-bilingual-voice.cjs
          node apps/1-4/calm-with-me/tools/test-bilingual-coverage.cjs
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('apps/1-4/calm-with-me')
          report=json.loads((root/'audio/bilingual/build-report.json').read_text())
          assert report['ar_choices']==74
          assert report['en_choices']==74
          assert report['ar_phrases']==109
          assert report['en_phrases']==109
          assert report['complete'] is True
          print('Verified: 183 Arabic MP3 + 183 English MP3; 366 actual recordings.')
          PY
      - name: Package all 366 real prerecorded Arabic and English MP3 files
        uses: actions/upload-artifact@v4
        with:
          name: calm-with-me-183-Arabic-183-English-real-MP3-COMPLETE
          path: |
            apps/1-4/calm-with-me/audio/silma/**/*.mp3
            apps/1-4/calm-with-me/audio/bilingual/ar/phrases/*.mp3
            apps/1-4/calm-with-me/audio/bilingual/en/**/*.mp3
            apps/1-4/calm-with-me/audio/bilingual/manifest.json
            apps/1-4/calm-with-me/audio/bilingual/build-report.json
            apps/1-4/calm-with-me/audio/bilingual/README_AR.md
          if-no-files-found: error
          retention-days: 30
