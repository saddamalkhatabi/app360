name: Record Balloon Farm bilingual SILMA guidance
on:
  push:
    branches: [codex/balloon-discovery-ready-20261029]
    paths: [apps/1-4/balloon-garden/data/guidance-scripts.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: balloon-guidance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      HF_HOME: /tmp/silma-hf
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SILMA CPU environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libavcodec-dev libavformat-dev libavutil-dev
          python -m pip install --no-cache-dir torch==2.6.0+cpu torchaudio==2.6.0+cpu torchvision==0.21.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir torchcodec==0.2.1 --index-url https://download.pytorch.org/whl/cpu
          printf 'torch==2.6.0+cpu\ntorchaudio==2.6.0+cpu\ntorchvision==0.21.0+cpu\ntorchcodec==0.2.1\ntransformers==4.51.3\nhuggingface-hub==0.36.0\n' >/tmp/silma-constraints.txt
          python -m pip install --no-cache-dir -c /tmp/silma-constraints.txt --extra-index-url https://download.pytorch.org/whl/cpu silma-tts==1.0.5 uroman huggingface-hub
      - name: Download publisher models
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id='silma-ai/silma-tts',revision='226dd7a65cadf51f9a6dbe3953fc89003b3844d5',allow_patterns=['*.pt','*.safetensors','*.json','*.txt','*.yaml','*.wav','*.model'])
          snapshot_download(repo_id='charactr/vocos-mel-24khz')
          import os,pathlib
          p=pathlib.Path(os.environ['HF_HOME'])/'hub/models--silma-ai--silma-tts/refs/main'
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text('226dd7a65cadf51f9a6dbe3953fc89003b3844d5')
          PY
      - name: Generate exact public bilingual instructions
        run: python tooling/build-balloon-guidance.py --root apps/1-4/balloon-garden --manifest data/guidance-scripts.json --cache /tmp/balloon-silma-cache --model-cache "$HF_HOME/hub" --precision fp32 --memory-map-weights --generate-only --part ${{ matrix.part }} --parts 8
      - uses: actions/upload-artifact@v4
        with:
          name: balloon-guidance-${{ matrix.part }}
          path: apps/1-4/balloon-garden/audio/guide/
          if-no-files-found: error
  publish:
    needs: record
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: balloon-guidance-*
          merge-multiple: true
          path: apps/1-4/balloon-garden/audio/guide/
      - name: Decode and publish exact recording manifest
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python tooling/finalize-balloon-guidance.py
          python -m pip install --no-cache-dir faster-whisper==1.2.1
          python tooling/verify-balloon-alphabet.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/1-4/balloon-garden/audio/guide/ apps/1-4/balloon-garden/guidance.js
          git diff --cached --quiet || git commit -m 'Publish distinct validated SILMA alphabet and farm guidance'
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
