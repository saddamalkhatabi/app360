name: Verify cooperative play production release
on:
  push:
    branches: [release/cooperative-play-live-20261020]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all recordings and refresh the portal bundle
        run: |
          python3 apps/4-8/cooperative-play-lab/tools/build-release.py
          python3 tooling/build-cooperative-offline.py
          node tooling/validate-app-links.js
          node --test apps/4-8/cooperative-play-lab/test/*.test.cjs
      - name: Install browser checks
        run: npm install --no-save --ignore-scripts --workspaces=false playwright && npx playwright install --with-deps chromium
      - name: Verify interface, languages and all offline recordings
        run: |
          node apps/4-8/cooperative-play-lab/test/browser.cjs
          node apps/4-8/cooperative-play-lab/test/bilingual.cjs
          node apps/4-8/cooperative-play-lab/test/offline.cjs
      - name: Save verified production bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/offline/a4-cooperate.json data/offline-catalog.json apps/4-8/cooperative-play-lab/data/ apps/4-8/cooperative-play-lab/offline-files.js
          git diff --cached --quiet || git commit -m 'Build verified bilingual cooperative production download bundle'
          git push origin HEAD:release/cooperative-play-live-20261020
