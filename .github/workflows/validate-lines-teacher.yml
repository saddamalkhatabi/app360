name: Validate Lines and Houses teacher
on:
  push:
    branches: [codex/lines-houses-teacher-20261030, main]
    paths: ['apps/1-4/lines-and-houses/**', 'tooling/*lines*', '.github/workflows/validate-lines-teacher.yml']
  pull_request:
    paths: ['apps/1-4/lines-and-houses/**', 'tooling/*lines*', '.github/workflows/validate-lines-teacher.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teacher:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tooling/build-lines-coach-catalog.cjs --check
      - run: node --test apps/1-4/lines-and-houses/tests/*.test.cjs
      - run: npm install --prefix /tmp/lines-qa playwright@1.62.1 acorn@8 --no-audit --no-fund
      - name: Both ages, real practice, saved villages, correction and responsive UI
        run: |
          browser_path=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          APP360_TEST_CHROMIUM="$browser_path" NODE_PATH=/tmp/lines-qa/node_modules node apps/1-4/lines-and-houses/tests/coach-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lines-teacher-browser-evidence
          path: /tmp/lines-teacher-results
