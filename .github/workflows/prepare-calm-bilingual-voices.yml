name: Prepare Calm Bilingual Spoken Scripts
on:
  push:
    branches: [feature/age1-4-silma-calm-serial-20261009]
    paths:
      - .github/workflows/prepare-calm-bilingual-voices.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/age1-4-silma-calm-serial-20261009
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inventory all direct and contextual voice prompts
        run: node apps/1-4/calm-with-me/tools/build-bilingual-voice-inventory.cjs
      - name: Verify all spoken event sources were inventoried
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('apps/1-4/calm-with-me/audio/bilingual')
          data=json.loads((root/'manifest.json').read_text())
          print('Recorded choices needed:',len(data['choices']))
          print('Contextual voice prompts:',len(data['phrases']))
          assert len(data['choices'])==74
          assert len(data['phrases'])>20
          PY
      - name: Commit complete spoken prompt inventory to isolated experimental branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/1-4/calm-with-me/audio/bilingual/manifest.json \
                  apps/1-4/calm-with-me/audio/bilingual/arabic-tts-manifest.json
          git commit -m "Inventory choice, emotion school and journey source audio texts"
          git pull --rebase origin feature/age1-4-silma-calm-serial-20261009
          git push origin HEAD:feature/age1-4-silma-calm-serial-20261009
