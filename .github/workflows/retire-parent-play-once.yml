name: Retire merged caregiver planner once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-parent-play-once.yml'
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Remove retired app from authoritative catalog
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='data/catalog.json';
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          const before=(x.apps||[]).length;
          x.apps=(x.apps||[]).filter(a=>a.id!=='a1-parent-play'&&a.slug!=='responsive-play-coach');
          if(x.apps.length===before) console.log('Retired app was already absent.');
          x.updated='2026-09-27';
          fs.writeFileSync(p,JSON.stringify(x,null,2)+'\n');
          NODE
          rm -rf apps/1-4/responsive-play-coach
          node tooling/build-blueprints.js
      - name: Commit authoritative cleanup
        run: |
          git config user.name 'app360-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add data/catalog.json docs/APP_BUILD_INDEX_AR.md apps/1-4
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Remove merged caregiver planner from authoritative catalog'
            git push
          fi
