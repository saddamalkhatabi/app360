name: V21 Yemeni Girls Name Audio

on:
  push:
    paths:
      - '.github/workflows/v21-yemen-girls-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install audio tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install edge-tts
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg
          fi

      - name: Generate 20 Yemeni girls name packs
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/v21_yemen_girls.py

      - name: Validate V21
        shell: bash
        run: |
          set -euo pipefail
          node --check 1-4/audio-v21.js
          grep -q 'audio-v21.js?v=21' 1-4/index.html
          grep -q "var CACHE='app360-1-4-v21'" 1-4/sw.js
          test -s 1-4/audio/names/sidra/test.mp3
          test -s 1-4/audio/names/mila/cheer-01.wav
          test -s 1-4/audio/names/leen/cheer-08.mp3
          test -s 1-4/audio/names/layan/test.ogg
          test -s 1-4/audio/names/wateen/cheer-05.wav
          test -s 1-4/audio/pcm/sidra.js
          test -s 1-4/audio/pcm/wateen.js
          python - <<'PY'
          import json
          r=json.load(open('1-4/audio/registry.json',encoding='utf-8'))
          required=['سيدرا','ميلا','لين','ليان','وتين']
          assert all(x in r['users'] for x in required)
          names=r['common_female_names_yemen']
          assert len(names)==20 and len(set(names))==20
          assert all(r['users'][n]['gender']=='girl' for n in names)
          assert all(len(r['users'][n]['clips'])==9 for n in names)
          v=json.load(open('1-4/version.json',encoding='utf-8'))
          assert v['build']==21 and v['femaleNamePacks']==20 and v['maleNamePacks']==20
          print('V21 validation OK:', ', '.join(names))
          PY

      - name: Commit V21
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 1-4 .github/scripts/v21_yemen_girls.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add 20 Yemeni girls recorded name audio packs"
          git push
