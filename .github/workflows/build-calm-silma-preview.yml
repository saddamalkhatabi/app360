name: Build SILMA Calm Preview Only

on:
  push:
    branches:
      - feature/age1-4-silma-calm-serial-20261009
    paths:
      - .github/workflows/build-calm-silma-preview.yml

permissions:
  contents: write

concurrency:
  group: silma-calm-only-preview
  cancel-in-progress: false

jobs:
  build-silma:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      HF_HOME: /tmp/silma-hf
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout only isolated experimental branch
        uses: actions/checkout@v4
        with:
          ref: feature/age1-4-silma-calm-serial-20261009
          fetch-depth: 1
          persist-credentials: true

      - name: Python for SILMA TTS
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure shared FFmpeg libraries are available for TorchCodec
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libavcodec-dev libavformat-dev libavutil-dev
          ldconfig -p | grep libavutil

      - name: Install CPU SILMA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir torch==2.6.0+cpu torchaudio==2.6.0+cpu torchvision==0.21.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir torchcodec==0.2.1 --index-url https://download.pytorch.org/whl/cpu
          printf 'torch==2.6.0+cpu\ntorchaudio==2.6.0+cpu\ntorchvision==0.21.0+cpu\ntorchcodec==0.2.1\n' > /tmp/silma-torch-constraints.txt
          python -m pip install --no-cache-dir -c /tmp/silma-torch-constraints.txt --extra-index-url https://download.pytorch.org/whl/cpu silma-tts==1.0.5 uroman huggingface-hub
          python -c 'import torch, torchaudio, torchvision, torchcodec; print("pinned versions:", torch.__version__, torchaudio.__version__, torchvision.__version__, torchcodec.__version__)'
          ffmpeg -version | head -1
          ffprobe -version | head -1
          python -c 'from silma_tts.api import SilmaTTS; print("SILMA engine import OK")'

      - name: Download original public SILMA v1 model weights to build cache
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          root = snapshot_download(repo_id="silma-ai/silma-tts", allow_patterns=["*.pt","*.safetensors","*.json","*.txt","*.yaml","*.wav","*.model"])
          print("SILMA cached model:", root)
          vocoder = snapshot_download(repo_id="charactr/vocos-mel-24khz")
          print("Required Vocos vocoder cached:", vocoder)
          PY

      - name: Generate all 74 distinct Arabic MP3 clips from approved-script manifest
        run: |
          python tooling/build-silma-audio.py \
            --root apps/1-4/calm-with-me \
            --manifest audio/silma/manifest.json \
            --cache "${{ runner.temp }}/calm-silma-cache" \
            --model-cache "$HF_HOME/hub" \
            --precision bf16 \
            --generate-only

      - name: Verify MP3 media, prepare honest unapproved preview map
        run: |
          python apps/1-4/calm-with-me/tools/finalize_silma_preview.py
          python apps/1-4/calm-with-me/tools/verify_silma_serial.py
          node apps/1-4/calm-with-me/tools/test_serial_player.cjs

      - name: Commit preview-only MP3 assets solely to this experimental branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/1-4/calm-with-me/audio/silma \
                  apps/1-4/calm-with-me/calm-silma-index-serial-v1.js
          if git diff --cached --quiet; then
            echo "No changed SILMA preview outputs."
            exit 0
          fi
          git commit -m "Generate 74 real SILMA MP3s for unapproved calm-with-me preview only"
          git push origin HEAD:feature/age1-4-silma-calm-serial-20261009
