name: Publish Existing SILMA Routine Voice Batches (Preview)
on:
  push:
    branches: [feature/routine-silma-voice-preview-20261010]
    paths:
      - .github/workflows/publish-routine-silma-ready-preview.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-ready-silma-routine-audio
  cancel-in-progress: false
jobs:
  restore-and-align-40:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      HF_HOME: /tmp/silma-hf
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/routine-silma-voice-preview-20261010
          fetch-depth: 0
      - name: Retrieve verified saved SILMA batches from existing recording run
        uses: actions/download-artifact@v4
        with:
          pattern: routine-silma-mp3-[0-3]
          run-id: 38075635452
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: apps/1-4/my-little-routine/audio/silma/routines/
      - name: Verify all 40 MP3 before staging them
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python - <<'PY'
          import pathlib,json,subprocess
          root=pathlib.Path('apps/1-4/my-little-routine')
          manifest=json.loads((root/'audio/narration-scripts.json').read_text(encoding='utf-8'))
          files=[root/item['path'] for i,item in enumerate(manifest['items']) if i%5!=4]
          assert len(files)==40 and all(p.exists() and p.stat().st_size>5000 for p in files),files
          for file in files:
              d=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','stream=codec_name:format=duration','-of','json',str(file)]))
              assert d['streams'][0]['codec_name']=='mp3' and 4<float(d['format']['duration'])<40,str(file)
          print('Verified 40 recorded SILMA files from original completed artifact batches')
          PY
      - name: Install acoustic forced-aligner, no new TTS synthesis needed
        run: |
          python -m pip install --no-cache-dir torch==2.6.0+cpu torchaudio==2.6.0+cpu torchvision==0.21.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir torchcodec==0.2.1 --index-url https://download.pytorch.org/whl/cpu
          printf 'torch==2.6.0+cpu\ntorchaudio==2.6.0+cpu\ntorchvision==0.21.0+cpu\ntorchcodec==0.2.1\ntransformers==4.51.3\nhuggingface-hub==0.36.0\n' >/tmp/silma-constraints.txt
          python -m pip install --no-cache-dir -c /tmp/silma-constraints.txt --extra-index-url https://download.pytorch.org/whl/cpu silma-tts==1.0.5 uroman huggingface-hub
      - name: Generate measured synchronization cues only for the 40 ready clips
        run: |
          python - <<'PY'
          import pathlib,json,subprocess,sys
          root=pathlib.Path('apps/1-4/my-little-routine')
          items=json.loads((root/'audio/narration-scripts.json').read_text(encoding='utf-8'))['items']
          cmd=[sys.executable,'tooling/build-silma-audio.py','--root',str(root),'--manifest','audio/narration-scripts.json',
               '--cues','audio/silma-alignment.json','--report','audio/silma-build-report.json',
               '--cache','/tmp/routine-align-cache','--model-cache','/tmp/silma-hf/hub','--align-only']
          for i,item in enumerate(items):
              if i%5==4:cmd.extend(['--exclude',item['path']])
          subprocess.run(cmd,check=True)
          PY
          python apps/1-4/my-little-routine/tools/build_narration_timeline.py --allow-partial
      - name: Commit ready MP3 and measured cue data to preview branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/1-4/my-little-routine/audio/
          if git diff --cached --quiet; then echo 'Already committed'; exit 0; fi
          git commit -m "Publish 40 recorded SILMA routine stories and aligned scene timings"
          git pull --rebase origin feature/routine-silma-voice-preview-20261010
          git push origin HEAD:feature/routine-silma-voice-preview-20261010
