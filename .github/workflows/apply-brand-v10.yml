name: Apply App360 Brand V10

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-brand-v10.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Copy finalized logo asset
        run: |
          set -euo pipefail
          git fetch origin brand-v10-stop --depth=1
          git show origin/brand-v10-stop:assets/brand/app360-lab-logo-v10.webp > assets/brand/app360-lab-logo-v10.webp
          test -s assets/brand/app360-lab-logo-v10.webp
      - name: Write brand v10 CSS
        shell: bash
        run: |
          cat > assets/css/brand-v10.css <<'CSS'
          :root{--brand-teal:#0A9BA8;--brand-deep:#063F4B;--brand-gold:#F4C027}.brand-mark{width:92px;height:68px;flex:0 0 92px;background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important;overflow:visible!important;position:relative;display:flex;align-items:center;justify-content:center}.brand-mark:before{content:"";position:absolute;inset:2px 5px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,255,255,.20) 0%,rgba(255,255,255,.08) 48%,rgba(255,255,255,0) 75%);pointer-events:none}.brand-mark img{position:relative;z-index:1;width:84px!important;height:64px!important;max-width:84px!important;max-height:64px!important;object-fit:contain!important;object-position:center!important;display:block!important;transform:none!important;filter:drop-shadow(0 3px 5px rgba(0,0,0,.18)) drop-shadow(0 0 3px rgba(255,255,255,.25))}.hero-grid{grid-template-columns:310px minmax(0,1fr) 305px;grid-template-areas:"stats copy brand";gap:28px}.hero-brand-side{grid-area:brand;display:flex;align-items:center;justify-content:center;min-height:330px;padding:0;position:relative}.hero-brand-side:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(10,155,168,.11),rgba(10,155,168,0) 70%);z-index:0}.hero-logo-wrap{position:relative;z-index:1;width:min(340px,100%);display:block}.hero-original-logo{position:relative;z-index:1;width:100%;height:auto;object-fit:contain;display:block;background:transparent;image-rendering:auto;filter:drop-shadow(0 14px 24px rgba(6,89,105,.13))}.logo-subtitle-360{display:none!important}.hero-brand-caption{display:none!important}.footer-mark{width:68px!important;height:68px!important;background:transparent!important;border:0!important;border-radius:0!important;object-fit:contain!important;transform:none!important;filter:drop-shadow(0 3px 5px rgba(0,0,0,.18)) drop-shadow(0 0 3px rgba(255,255,255,.18))}.age-hero{background:linear-gradient(135deg,#EAF9F8 0%,#F8FBFB 58%,#FFF7DA 100%)}.app-logo{background:transparent!important}@media(max-width:1040px){.hero-grid{grid-template-columns:250px minmax(0,1fr);grid-template-areas:"copy brand" "stats stats"}.hero-brand-side{min-height:270px}.hero-logo-wrap{width:min(300px,100%)}}@media(max-width:760px){.brand-mark{width:78px;height:60px;flex-basis:78px}.brand-mark img{width:72px!important;height:56px!important;max-width:72px!important;max-height:56px!important;transform:none!important}.hero-grid{grid-template-columns:1fr;grid-template-areas:"brand" "copy" "stats";gap:14px}.hero-brand-side{min-height:auto;padding-top:4px}.hero-brand-side:after{width:260px;height:260px}.hero-logo-wrap{width:min(300px,88vw)}.footer-mark{width:58px!important;height:58px!important}}
          CSS
      - name: Patch portal references
        shell: python
        run: |
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('assets/brand/app360-lab-logo-transparent.png?v=9','assets/brand/app360-lab-logo-v10.webp?v=10')
          s=s.replace('manifest.webmanifest?v=9','manifest.webmanifest?v=10')
          s=s.replace('app360-lab-icon-192.png?v=9','app360-lab-icon-512.png?v=10')
          s=s.replace('app360-lab-icon-180.png?v=9','app360-lab-icon-180.png?v=10')
          s=s.replace('id="brandV7Css" href="assets/css/brand-v7.css?v=9"','id="brandV10Css" href="assets/css/brand-v10.css?v=10"')
          old='<div class="hero-logo-wrap"><img class="hero-original-logo" src="assets/brand/app360-lab-logo-v10.webp?v=10" alt="مختبر التطبيق 360 - الريلز الآمن 360"><span class="logo-subtitle-360" aria-hidden="true">360</span></div>'
          new='<div class="hero-logo-wrap"><img class="hero-original-logo" src="assets/brand/app360-lab-logo-v10.webp?v=10" alt="مختبر التطبيق 360 - الريلز الآمن 360" width="640" height="634" decoding="async"></div>'
          s=s.replace(old,new)
          s=s.replace('assets/js/lab360.js?v=5','assets/js/lab360.js?v=10')
          p.write_text(s,encoding='utf-8')

          p=Path('assets/js/lab360.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("assets/brand/app360-lab-icon-192.png?v=9","assets/brand/app360-lab-icon-512.png?v=10")
          s=s.replace("brandV7Css","brandV10Css")
          s=s.replace("assets/css/brand-v7.css?v=9","assets/css/brand-v10.css?v=10")
          p.write_text(s,encoding='utf-8')
      - name: Update portal service worker
        shell: bash
        run: |
          cat > sw.js <<'JS'
          var CACHE='app360-portal-v10';
          var CORE=[
            './','./index.html?v=10','./manifest.webmanifest?v=10',
            './assets/css/lab360.css?v=4','./assets/css/brand-v10.css?v=10',
            './assets/js/lab360.js?v=10','./assets/js/pwa-install.js?v=5',
            './assets/brand/app360-lab-logo-v10.webp?v=10',
            './assets/brand/app360-lab-icon-180.png?v=10','./assets/brand/app360-lab-icon-192.png?v=10','./assets/brand/app360-lab-icon-512.png?v=10',
            './data/catalog.json','./data/goals.json',
            './ages/1-4/index.html','./ages/4-8/index.html','./ages/8-12/index.html','./ages/12-16/index.html',
            './ages/16-24/index.html','./ages/24-45/index.html','./ages/45-60/index.html','./ages/60-80/index.html'
          ];
          self.addEventListener('install',function(e){e.waitUntil(caches.open(CACHE).then(function(c){return Promise.all(CORE.map(function(u){return c.add(u).catch(function(){return null})}))}));if(self.skipWaiting)self.skipWaiting()});
          self.addEventListener('activate',function(e){e.waitUntil(caches.keys().then(function(keys){return Promise.all(keys.map(function(k){if(k.indexOf('app360-portal-')===0&&k!==CACHE)return caches.delete(k)}))}).then(function(){return self.clients&&self.clients.claim?self.clients.claim():null}))});
          self.addEventListener('message',function(e){if(e.data&&e.data.type==='SKIP_WAITING'&&self.skipWaiting)self.skipWaiting()});
          function sameOrigin(req){try{return new URL(req.url).origin===self.location.origin}catch(e){return false}}
          function networkFirst(req,fallback){return fetch(req,{cache:'no-store'}).then(function(resp){if(resp&&resp.ok&&sameOrigin(req)){var copy=resp.clone();caches.open(CACHE).then(function(c){c.put(req,copy)})}return resp}).catch(function(){return caches.match(req).then(function(hit){return hit||caches.match(fallback||'./index.html?v=10')})})}
          function staleWhileRevalidate(req){return caches.match(req).then(function(hit){var update=fetch(req).then(function(resp){if(resp&&resp.ok&&sameOrigin(req)){var copy=resp.clone();caches.open(CACHE).then(function(c){c.put(req,copy)})}return resp}).catch(function(){return null});return hit||update})}
          self.addEventListener('fetch',function(e){var req=e.request;if(!req||req.method!=='GET'||!sameOrigin(req))return;var url=req.url||'';var isData=url.indexOf('/data/catalog.json')>=0||url.indexOf('/data/goals.json')>=0;var isBrand=url.indexOf('/assets/brand/')>=0||url.indexOf('/manifest.webmanifest')>=0;if(req.mode==='navigate'){e.respondWith(networkFirst(req,'./index.html?v=10'));return}if(isData||isBrand){e.respondWith(networkFirst(req));return}e.respondWith(staleWhileRevalidate(req))});
          JS
      - name: Verify final references
        run: |
          grep -q 'app360-lab-logo-v10.webp?v=10' index.html
          grep -q 'brand-v10.css?v=10' index.html
          grep -q 'app360-lab-icon-512.png?v=10' assets/js/lab360.js
          grep -q "app360-portal-v10" sw.js
          test -s assets/brand/app360-lab-logo-v10.webp
      - name: Commit brand v10 to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/js/lab360.js assets/css/brand-v10.css sw.js assets/brand/app360-lab-logo-v10.webp
          git commit -m 'Fix brand logo quality and header clipping' || exit 0
          git push origin HEAD:main
