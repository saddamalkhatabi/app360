name: Sync screen-to-move generated index
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-screen-to-move-generated-index.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate and validate
        run: |
          node tooling/build-blueprints.js
          node tooling/validate-platform.js
          node --test apps/1-4/screen-to-move/app.test.js
      - name: Commit generated index and remove one-time workflow
        run: |
          git config user.name "app360-bot"
          git config user.email "app360-bot@users.noreply.github.com"
          git rm .github/workflows/sync-screen-to-move-generated-index.yml
          git add docs/APP_BUILD_INDEX_AR.md apps/1-4/screen-to-move/BUILD_SPEC.md apps/1-4/screen-to-move/PROMPT_AR.md
          git commit -m "Sync generated index for creative games v3"
          git push origin HEAD:main
