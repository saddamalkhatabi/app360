name: V18 Embedded PCM Audio

on:
  push:
    paths:
      - '.github/workflows/v18-embedded-pcm.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg
          fi
      - name: Generate V18 embedded PCM
        run: python .github/scripts/v18_pcm.py
      - name: Validate V18
        run: |
          node --check 1-4/audio-pcm-v18.js
          node --check 1-4/audio-v18.js
          grep -q 'audio-pcm-v18.js?v=18' 1-4/index.html
          grep -q 'audio-v18.js?v=18' 1-4/index.html
          grep -q 'embedded-pcm' 1-4/audio-v18.js
          grep -q "var CACHE='app360-1-4-v18'" 1-4/sw.js
      - name: Commit V18
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 1-4/index.html 1-4/sw.js 1-4/version.json 1-4/audio-pcm-v18.js 1-4/audio-v18.js
          git commit -m "Add V18 embedded PCM fallback for legacy tablets"
          git push
