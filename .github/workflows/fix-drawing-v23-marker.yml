name: Fix drawing V23 marker

on:
  push:
    paths: ['.github/workflows/fix-drawing-v23-marker.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Set canonical V23 marker
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/1-4/drawing-writing-foundations/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('لوحة الطفل - امسك القلم وارسم v22','لوحة الطفل - امسك القلم وارسم v23')
          s=s.replace('var LOCAL=22;','var LOCAL=23;')
          p.write_text(s,encoding='utf-8')
          PY
          node tooling/validate-platform.js
          rm .github/workflows/fix-drawing-v23-marker.yml
      - name: Commit cleanup
        run: |
          git config user.name "app360-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Align drawing app marker with canonical V23 and remove one-time workflow"
          git push
