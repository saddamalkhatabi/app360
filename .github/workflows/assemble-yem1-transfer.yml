name: Temporary verified YEM1 transfer
on:
  push:
    branches: ['codex/yem1-platform-20261028']
    paths: ['.transfer/**', '.github/workflows/assemble-yem1-transfer.yml']
permissions:
  contents: write
jobs:
  assemble:
    if: github.repository == 'saddamalkhatabi/app360' && github.ref == 'refs/heads/codex/yem1-platform-20261028'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify and restore exact source files
        run: python .transfer/assemble.py
      - name: Commit only the verified files to this preparation branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --pathspec-from-file=.transfer/tracked-paths --pathspec-file-nul
          if ! git diff --cached --quiet; then
            git commit -m "Restore verified app360 source and content for YEM1 integration"
            git push origin HEAD:refs/heads/codex/yem1-platform-20261028
          fi
