name: Register Calm What To Try Offline Photos
on:
  push:
    branches:
      - fix/calm-child-meaningful-visuals-20261010
    paths:
      - .github/workflows/calm-register-try-offline.yml
permissions:
  contents: write
jobs:
  refresh-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh hashes of only calm-with-me (including 20 WebP images)
        run: python3 apps/1-4/calm-with-me/tooling/sync-photo-offline-v1.py
      - name: Commit updated offline manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offline/a1-calm.json data/offline-catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "Include Calm what-to-try photo images in offline package"
            git pull --rebase origin fix/calm-child-meaningful-visuals-20261010
            git push origin HEAD:fix/calm-child-meaningful-visuals-20261010
          fi
