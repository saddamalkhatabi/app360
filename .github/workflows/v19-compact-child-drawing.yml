name: V19 Compact Child Drawing

on:
  push:
    paths:
      - '.github/workflows/v19-compact-child-drawing.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch compact drawing UI
        run: python .github/scripts/v19_compact_child_drawing.py
      - name: Validate V19
        shell: bash
        run: |
          set -euo pipefail
          node --check 1-4/ui-v11.js
          grep -q 'childUiV19CompactDrawing' 1-4/ui-v11.js
          grep -q 'ui-v11.js?v=19' 1-4/index.html
          grep -q "var CACHE='app360-1-4-v19'" 1-4/sw.js
          python -c "import json; assert json.load(open('1-4/version.json',encoding='utf-8'))['build']==19"
      - name: Commit V19
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 1-4/ui-v11.js 1-4/index.html 1-4/version.json 1-4/sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Improve child drawing space and move guidance to toast"
          git push
