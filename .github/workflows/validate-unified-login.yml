name: Validate unified School identity
on:
  push:
    branches: [main]
    paths: ['assets/js/**', 'apps/**', 'resources/celebration-audio/**', 'services/**', 'tooling/**', '.github/workflows/validate-unified-login.yml']
  pull_request:
    paths: ['assets/js/**', 'apps/**', 'resources/celebration-audio/**', 'services/**', 'tooling/**', '.github/workflows/validate-unified-login.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The native service has a separate npm lockfile, outside pnpm workspaces.
      - run: npm --prefix services/app360-data-core ci --no-audit --no-fund
      - run: npm install --prefix /tmp/unified-identity-test jsdom@26 acorn@8 --no-audit --no-fund
      - name: Identity, cancellation, callback, praise and isolated production startup
        env:
          APP360_TEST_MODULES: /tmp/unified-identity-test/node_modules
        run: node --test tooling/test-browser-session.cjs tooling/test-school-login-praise.cjs tooling/test-teacher-encouragement.cjs tooling/test-reels-bridge.js tooling/test-update-context.cjs tooling/test-reels-return-visibility.cjs tooling/test-personalized-celebration.cjs tooling/test-unified-identity.cjs tooling/test-unified-hosting.cjs tooling/test-unified-offline.cjs tooling/test-membership.cjs tooling/test-membership-experience.cjs tooling/test-connected-praise.cjs
      - name: Legacy browser grammar and actual application integration audit
        env:
          APP360_TEST_MODULES: /tmp/unified-identity-test/node_modules
        run: node tooling/audit-unified-login.cjs --check
      - name: Word coach and puzzle praise cancellation
        env:
          APP360_TEST_MODULES: /tmp/unified-identity-test/node_modules
        run: node tooling/test-say-name-coach.cjs && node tooling/test-picture-puzzle-learning.cjs
