name: Screen-to-move v8 redesign

on:
  push:
    paths:
      - '.github/workflows/screen-move-v8-redesign.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply v8 redesign
        run: |
          python3 tooling/tmp_screen_move_v8.py
          python3 tooling/tmp_screen_move_v8_compat.py
      - name: Regenerate planning documents
        run: node tooling/build-blueprints.js
      - name: Validate platform and app
        run: |
          node tooling/validate-platform.js
          pnpm --filter @app360/app-screen-to-move validate
          git diff --check
      - name: Commit v8 and remove temporary tooling
        run: |
          git config user.name "app360-bot"
          git config user.email "app360-bot@users.noreply.github.com"
          git rm tooling/tmp_screen_move_v8.py tooling/tmp_screen_move_v8_compat.py .github/workflows/screen-move-v8-redesign.yml
          git add -A
          git commit -m "Redesign screen-to-move navigation and worksheet tools v8"
          git push origin HEAD:main
