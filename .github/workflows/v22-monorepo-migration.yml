name: V22 Monorepo Drawing App Migration

on:
  push:
    paths:
      - '.github/workflows/v22-monorepo-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migrate drawing app to canonical workspace
        run: python .github/scripts/migrate_v22_monorepo.py

      - name: Verify moved application and compatibility gateway
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/1-4/drawing-writing-foundations/index.html
          test -s apps/1-4/drawing-writing-foundations/app.json
          test -s apps/1-4/drawing-writing-foundations/package.json
          test -s apps/1-4/drawing-writing-foundations/audio-v21.js
          test -s apps/1-4/drawing-writing-foundations/audio-pcm-v18.js
          test -s apps/1-4/drawing-writing-foundations/audio/registry.json
          test -s 1-4/index.html
          grep -q 'drawing-writing-foundations' 1-4/index.html
          grep -q 'apps/1-4/drawing-writing-foundations/index.html?v=22' data/catalog.json
          if grep -Eq 'audio-v(13|14|15|17|18|20)\.js' apps/1-4/drawing-writing-foundations/index.html; then
            echo 'Current page still references obsolete audio runtime' >&2
            exit 1
          fi
          node tooling/validate-platform.js

      - name: Remove obsolete one-time migration workflows and scripts
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/child-ui-v11.yml
          rm -f .github/workflows/v16-refresh-loop-guard.yml
          rm -f .github/workflows/v17-webaudio-legacy.yml
          rm -f .github/workflows/v18-embedded-pcm.yml
          rm -f .github/workflows/v19-compact-child-drawing.yml
          rm -f .github/workflows/v20-yemen-names-audio.yml
          rm -f .github/workflows/v21-yemen-girls-audio.yml
          rm -f .github/scripts/v18_pcm.py
          rm -f .github/scripts/v19_compact_child_drawing.py
          rm -f .github/scripts/v20_yemen_names.py
          rm -f .github/scripts/v21_yemen_girls.py

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move drawing app into canonical App 360 workspace and clean legacy migrations"
          git push
