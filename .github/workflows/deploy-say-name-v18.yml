name: Deploy Say and Name v18

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-say-name-v18.yml

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble v18 files
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, pathlib
          root=pathlib.Path('.deploy/say-name-v18')
          targets={
            'index':'apps/1-4/say-and-name/index.html',
            'styles':'apps/1-4/say-and-name/styles-v18.css',
            'runtime':'apps/1-4/say-and-name/runtime-v18.js',
            'sw':'apps/1-4/say-and-name/sw.js',
          }
          for prefix,target in targets.items():
              parts=sorted(root.glob(prefix+'.*.b64'))
              if not parts:
                  raise SystemExit('missing payload '+prefix)
              encoded=''.join(p.read_text().strip() for p in parts)
              data=gzip.decompress(base64.b64decode(encoded))
              out=pathlib.Path(target)
              out.parent.mkdir(parents=True,exist_ok=True)
              out.write_bytes(data)
              print('wrote', target, len(data))
          PY
      - name: Validate v18
        shell: bash
        run: |
          node --check apps/1-4/say-and-name/runtime-v18.js
          node --check apps/1-4/say-and-name/sw.js
          grep -q 'say-and-name-v18-20260915' apps/1-4/say-and-name/index.html
          grep -q 'data-view="random"' apps/1-4/say-and-name/index.html
          grep -q 'advancedSettingsBtn' apps/1-4/say-and-name/index.html
          grep -q 'stageFullscreenBtn' apps/1-4/say-and-name/index.html
          grep -q 'bottomPrevBtn' apps/1-4/say-and-name/index.html
          grep -q 'sweetalert2' apps/1-4/say-and-name/index.html
          grep -q 'currentLevelNames' apps/1-4/say-and-name/runtime-v18.js
          grep -q 'makeRandomPool' apps/1-4/say-and-name/runtime-v18.js
      - name: Commit v18 and clean temporary payload
        shell: bash
        run: |
          rm -rf .deploy/say-name-v18
          rm -f .github/workflows/deploy-say-name-v18.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Redesign Say and Name navigation and child-friendly settings'
          git push
      - name: Check RawGitHack refresh
        shell: bash
        run: |
          URL='https://raw.githack.com/saddamalkhatabi/app360/main/apps/1-4/say-and-name/index.html'
          for i in $(seq 1 15); do
            if curl -fsSL --max-time 20 "$URL?check=v18-$i" | grep -q 'say-and-name-v18-20260915'; then
              echo 'RawGitHack v18 is live'
              exit 0
            fi
            sleep 4
          done
          echo 'RawGitHack may still be propagating; GitHub main is updated.'
          exit 0
