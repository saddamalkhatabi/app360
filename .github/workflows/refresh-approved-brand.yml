name: Refresh approved App 360 brand assets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refresh-approved-brand.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate branded PWA icons from approved logo
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('assets/brand')
          im=Image.open(p/'app360-lab-logo.webp').convert('RGB')
          # Approved logo is 900x900. Crop the emblem only, then center it on a square white canvas.
          mark=im.crop((127,68,773,585))
          side=max(mark.size)
          canvas=Image.new('RGB',(side,side),'white')
          canvas.paste(mark,((side-mark.width)//2,(side-mark.height)//2))
          for size,name in [(512,'app360-lab-icon-512.png'),(192,'app360-lab-icon-192.png'),(180,'app360-lab-icon-180.png'),(64,'favicon-64.png'),(32,'favicon-32.png')]:
              out=canvas.resize((size,size),Image.Resampling.LANCZOS)
              out.save(p/name,optimize=True)
          PY
      - name: Remove obsolete brand variants
        shell: bash
        run: |
          rm -f assets/brand/app360-lab-icon.svg assets/brand/app360-lab-logo.svg
      - name: Remove one-time workflow
        shell: bash
        run: rm -f .github/workflows/refresh-approved-brand.yml
      - name: Commit refreshed brand files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Generate approved App 360 logo icons and clean old brand assets'
            git push
          fi
