name: Screen-to-move v15 designer performance and creative tools

on:
  push:
    paths:
      - '.github/workflows/apply-screen-move-v15.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply v15 upgrade
        run: python3 tooling/apply-screen-move-v15.py
      - name: Refresh historical regression expectations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/1-4/screen-to-move/app.test.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('1[01234]','1[012345]')
          s=s.replace('v=14','v=15')
          s=s.replace('screen-to-move-v14','screen-to-move-v15')
          s=s.replace('legacy-v14.js','legacy-v15.js')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Regenerate platform planning documents
        run: node tooling/build-blueprints.js
      - name: Validate platform and application
        run: |
          node tooling/validate-platform.js
          pnpm --filter @app360/app-screen-to-move validate
          git diff --check
      - name: Commit v15 and remove temporary tooling
        run: |
          git config user.name "app360-bot"
          git config user.email "app360-bot@users.noreply.github.com"
          git rm -f tooling/apply-screen-move-v15.py .github/workflows/apply-screen-move-v15.yml
          git add -A
          git commit -m "Improve designer performance alignment storage and smart finish v15"
          git push origin HEAD:main
