name: Install Five Calm Child Visuals
on:
  push:
    branches: [fix/calm-child-meaningful-visuals-20261010]
    paths:
      - '.github/workflows/calm-install-five-visuals.yml'
      - 'apps/1-4/calm-with-me/assets/images/calm_5_remaining_images_webp.zip'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and extract the user-uploaded WebP originals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, json
          directory=Path('apps/1-4/calm-with-me/assets/images')
          archive=directory/'calm_5_remaining_images_webp.zip'
          assert archive.is_file(),str(archive)
          stems=('need-help','water-now','quiet','ball','wait')
          expected={'what-to-try/'+stem+'-'+str(size)+'.webp' for stem in stems for size in (320,512)}
          expected.update(('what-to-try/PHOTO_MAPPING.json','what-to-try/README_AR.txt'))
          with ZipFile(archive) as z:
              assert set(z.namelist())==expected,'Unexpected names in archive'
              assert z.testzip() is None,'Damaged archive'
              mapping=json.loads(z.read('what-to-try/PHOTO_MAPPING.json'))
              refs={row['filename']:row for row in mapping['assets']}
              assert len(refs)==10
              for path in sorted(expected):
                  data=z.read(path)
                  if path.endswith('.webp'):
                      filename=Path(path).name
                      assert filename in refs
                      assert data[:4]==b'RIFF' and data[8:12]==b'WEBP'
                      assert 5000<len(data)<120000
                      assert len(data)==refs[filename]['bytes']
                      assert hashlib.sha256(data).hexdigest()==refs[filename]['sha256']
                  dest=directory/path
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(data)
                  print(path,len(data))
          PY
      - name: Commit installed images without affecting other applications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/1-4/calm-with-me/assets/images/what-to-try/
          if ! git diff --cached --quiet; then
            git commit -m "Install 5 toddler-critical WebP scenes with verified photo mapping"
            git pull --rebase origin fix/calm-child-meaningful-visuals-20261010
            git push origin HEAD:fix/calm-child-meaningful-visuals-20261010
          fi
