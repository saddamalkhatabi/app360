name: V12 Cache Bust

on:
  push:
    paths:
      - '.github/workflows/v12-cache-bust.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch V12 asset version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('1-4/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<script src="ui-v11.js"></script>','<script src="ui-v11.js?v=12"></script>')
          s=s.replace('لوحة الطفل - امسك القلم وارسم v11','لوحة الطفل - امسك القلم وارسم v12')
          p.write_text(s,encoding='utf-8')
          p=Path('1-4/sw.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("'./ui-v11.js'","'./ui-v11.js?v=12'")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit V12 patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 1-4/index.html 1-4/sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply V12 modal and desktop audio fixes"
          git push
