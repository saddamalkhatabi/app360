name: Validate useful facts and tablet sentence layout
on:
  push:
    branches: [release/say-name-facts-20261015]
    paths:
      - 'apps/1-4/say-and-name/**'
      - '.github/workflows/validate-say-name-facts.yml'
permissions:
  contents: read
jobs:
  facts-and-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python apps/1-4/say-and-name/tools/test-meaning-facts.py
          node apps/1-4/say-and-name/tools/test-meaning.cjs
          node apps/1-4/say-and-name/tools/test-meaning-player.cjs
          node apps/1-4/say-and-name/tools/test-meaning-refresh.cjs
      - run: |
          npm install --prefix /tmp/meaning-layout playwright@1.62.1
          /tmp/meaning-layout/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/meaning-layout/node_modules node apps/1-4/say-and-name/tools/test-child-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: useful-facts-layout
          path: /tmp/say-name-ui/
