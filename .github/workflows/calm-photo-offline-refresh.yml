name: Refresh Calm Emotion Offline Files
on:
  push:
    branches: [fix/calm-child-meaningful-visuals-20261010]
    paths:
      - .github/workflows/calm-photo-offline-refresh.yml
permissions:
  contents: write
jobs:
  refresh-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update only a1-calm offline catalog and hashes
        run: python3 apps/1-4/calm-with-me/tooling/sync-photo-offline-v1.py
      - name: Commit offline updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offline/a1-calm.json data/offline-catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "Register Calm emotion photos in offline download manifest"
            git push origin HEAD:fix/calm-child-meaningful-visuals-20261010
          fi
