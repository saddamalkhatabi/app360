name: Preserve completed turn-taking narration
on:
  push:
    branches: [feature/turn-taking-advanced-20261022]
    paths: [.github/workflows/collect-turn-scenes-ready.yml]
permissions:
  contents: write
  actions: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for the completed nonfallback partitions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess,time
          needed={0,1,3,4,5,7,8,9,10,12,13,15,16,17,18,19}
          for attempt in range(60):
            data=json.loads(subprocess.check_output(['gh','api','repos/saddamalkhatabi/app360/actions/runs/39765086440/artifacts?per_page=100']))
            have={int(a['name'].rsplit('-',1)[1]) for a in data['artifacts'] if a['name'].startswith('turn-scenes-')}
            if needed<=have:break
            print('Waiting for partitions',sorted(needed-have),flush=True);time.sleep(10)
          else:raise RuntimeError('Required partitions still running')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /apps/1-4/imitate-one-step/audio/
      - uses: actions/download-artifact@v4
        with:
          pattern: turn-scenes-*
          run-id: 39765086440
          github-token: ${{ github.token }}
          merge-multiple: true
          path: apps/1-4/imitate-one-step/audio/scenes/
      - name: Validate and preserve completed local audio files
        run: |
          python - <<'PY'
          import pathlib,json,subprocess
          app=pathlib.Path('apps/1-4/imitate-one-step')
          items=json.loads((app/'audio/scene-recording-request.json').read_text())['items']
          for n,item in enumerate(items):
            if n%20 in {2,6,11,14}:continue
            p=app/item['path'];assert p.is_file() and p.stat().st_size>1000,p
            data=p.read_bytes();assert data.startswith(b'ID3') or data[0]==255 and data[1]&224==224,p
          print('Completed partitions verified; remaining partition corrections are prepared separately.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/1-4/imitate-one-step/audio/scenes/
          git commit -m 'Preserve verified completed SILMA scene recording partitions'
          git push origin HEAD:${{ github.ref_name }}
      - name: Stop the superseded generation after its completed audio is preserved
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/saddamalkhatabi/app360/actions/runs/39765086440/cancel
