name: Publish Completed Supplemental SILMA Arabic MP3
on:
  push:
    branches: [feature/age1-4-silma-calm-serial-20261009]
    paths:
      - .github/workflows/publish-calm-arabic-progress.yml
permissions:
  contents: write
  actions: read
jobs:
  publish-ar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/age1-4-silma-calm-serial-20261009
          fetch-depth: 0
      - name: Copy real Arabic recordings from completed SILMA shards
        uses: actions/download-artifact@v4
        with:
          run-id: 37974458126
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: calm-ar-recordings-*
          merge-multiple: true
          path: apps/1-4/calm-with-me/audio/bilingual/ar/phrases/
      - name: Install MP3 media validator
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Index only files that exist and decode
        run: node apps/1-4/calm-with-me/tools/finalize-bilingual-audio.cjs
      - name: Persist real SILMA recordings on isolated experiment branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/1-4/calm-with-me/audio/bilingual
          if git diff --cached --quiet; then
            echo "No new recordings."
            exit 0
          fi
          git commit -m "Persist confirmed supplemental SILMA Arabic MP3 files for bilingual preview"
          git pull --rebase origin feature/age1-4-silma-calm-serial-20261009
          git push origin HEAD:feature/age1-4-silma-calm-serial-20261009
