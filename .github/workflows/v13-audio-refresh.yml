name: V13 Audio Pack and Forced Refresh

on:
  push:
    paths:
      - '.github/workflows/v13-audio-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install speech generators
        run: python -m pip install --quiet edge-tts gTTS
      - name: Generate Noor Arabic voice pack
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio, json
          from pathlib import Path

          root=Path('1-4')
          out=root/'audio'/'نور'
          out.mkdir(parents=True,exist_ok=True)
          phrases=[
            ('test','test','مرحبا يا نور، هذا اختبار للصوت المسجل'),
            ('cheer-01','cheer','أحسنتي يا نور'),
            ('cheer-02','cheer','رائع يا نور'),
            ('cheer-03','cheer','ممتاز يا نور'),
            ('cheer-04','cheer','عمل جميل يا نور'),
            ('cheer-05','cheer','استمري يا نور'),
            ('cheer-06','cheer','أبدعتي يا نور'),
            ('cheer-07','cheer','محاولة جميلة يا نور'),
            ('cheer-08','cheer','تقدم رائع يا نور'),
            ('color-red','color','اللون أحمر'),
            ('color-blue','color','اللون أزرق'),
            ('color-green','color','اللون أخضر'),
            ('color-yellow','color','اللون أصفر'),
            ('color-orange','color','اللون برتقالي'),
            ('color-purple','color','اللون بنفسجي'),
            ('color-pink','color','اللون وردي'),
            ('color-brown','color','اللون بني'),
            ('color-black','color','اللون أسود'),
            ('color-gray','color','اللون رمادي'),
          ]

          async def make_edge():
              import edge_tts
              preferred=['ar-SA-ZariyahNeural','ar-EG-SalmaNeural','ar-AE-FatimaNeural']
              voice=preferred[0]
              try:
                  voices=await edge_tts.list_voices()
                  names={v.get('ShortName') for v in voices}
                  voice=next((v for v in preferred if v in names),None)
                  if not voice:
                      female=[v.get('ShortName') for v in voices if str(v.get('Locale','')).lower().startswith('ar') and str(v.get('Gender','')).lower()=='female']
                      any_ar=[v.get('ShortName') for v in voices if str(v.get('Locale','')).lower().startswith('ar')]
                      voice=(female or any_ar or preferred)[0]
              except Exception:
                  voice=preferred[0]
              for fid,kind,text in phrases:
                  await edge_tts.Communicate(text,voice,rate='-8%').save(str(out/(fid+'.mp3')))
              return voice

          voice='unknown'
          try:
              voice=asyncio.run(make_edge())
          except Exception as exc:
              print('edge-tts failed, falling back to gTTS:',exc)
              from gtts import gTTS
              for fid,kind,text in phrases:
                  gTTS(text=text,lang='ar',slow=False).save(str(out/(fid+'.mp3')))
              voice='gTTS-ar'

          clips=[]
          for fid,kind,text in phrases:
              aliases=[]
              if fid=='test': aliases=['مرحبا يا نور هذا اختبار للصوت المسجل','مرحبا يا نور هذا اختبار للصوت العربي','أحسنت يا نور الصوت يعمل على الحاسوب']
              clips.append({'id':fid,'kind':kind,'text':text,'aliases':aliases,'file':'audio/نور/'+fid+'.mp3'})
          registry={
            'version':13,
            'generated_voice':voice,
            'users':{
              'نور':{'aliases':['Noor','noor'],'gender':'girl','folder':'audio/نور','clips':clips}
            }
          }
          (root/'audio').mkdir(exist_ok=True)
          (root/'audio'/'registry.json').write_text(json.dumps(registry,ensure_ascii=False,indent=2),encoding='utf-8')
          print('generated',len(clips),'clips with',voice)
          PY

      - name: Patch app to V13
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('1-4/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('لوحة الطفل - امسك القلم وارسم v12','لوحة الطفل - امسك القلم وارسم v13')
          if 'http-equiv="Cache-Control"' not in s:
              s=s.replace('<meta name="theme-color" content="#0f8f8a">','<meta name="theme-color" content="#0f8f8a">\n<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n<meta http-equiv="Pragma" content="no-cache">\n<meta http-equiv="Expires" content="0">')

          watcher='''<script id="forceUpdateV13">(function(){var LOCAL=13;try{var x=new XMLHttpRequest();x.open('GET','version.json?_='+(+new Date()),true);x.onreadystatechange=function(){if(x.readyState!==4||x.status<200||x.status>=300)return;try{var j=JSON.parse(x.responseText),b=parseInt(j.build,10)||LOCAL;if(b!==LOCAL){try{if(window.caches)caches.keys().then(function(ks){for(var i=0;i<ks.length;i++)caches.delete(ks[i])})}catch(e){}try{if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration)navigator.serviceWorker.getRegistration().then(function(r){if(r)r.update()})}catch(e){}var base=location.href.split('?')[0].split('#')[0];location.replace(base+'?v='+b+'&refresh='+(+new Date()))}}catch(e){}};x.send(null)}catch(e){}})();</script>'''
          if 'forceUpdateV13' not in s:
              s=s.replace('</head>',watcher+'\n</head>')

          start=s.find('function speakSmart(text,allowFallback){')
          end=s.find('function genderCheer()',start)
          if start>=0 and end>start and 'function legacySpeakSmart' not in s:
              old=s[start:end]
              legacy=old.replace('function speakSmart(text,allowFallback){','function legacySpeakSmart(text,allowFallback){',1)
              wrapper="function speakSmart(text,allowFallback){if(!voiceEnabled)return false;if(window.Audio360&&window.Audio360.speak){var r=window.Audio360.speak(text,allowFallback);if(r!==null&&typeof r!=='undefined')return r}return legacySpeakSmart(text,allowFallback)}\n"
              s=s[:start]+legacy+wrapper+s[end:]

          a=s.find('function setupInstall(){')
          b=s.find('function showInstallHelp()',a)
          if a>=0 and b>a:
              new_setup="""function setupInstall(){window.addEventListener('beforeinstallprompt',function(e){try{e.preventDefault();deferredInstall=e;installBtn.innerHTML='تثبيت التطبيق الآن'}catch(x){}});installBtn.onclick=function(){if(deferredInstall){try{deferredInstall.prompt();deferredInstall.userChoice.then(function(){deferredInstall=null})}catch(e){showInstallHelp()}}else showInstallHelp()};if('serviceWorker'in navigator&&location.protocol.indexOf('http')===0){try{navigator.serviceWorker.register('sw.js?v=13',{updateViaCache:'none'}).then(function(reg){try{reg.update()}catch(e){}try{if(reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'})}catch(e){}});navigator.serviceWorker.addEventListener('controllerchange',function(){try{if(sessionStorage.getItem('pk_sw13_reload')!=='1'){sessionStorage.setItem('pk_sw13_reload','1');location.reload()}}catch(e){}})}catch(e){}}}\n"""
              s=s[:a]+new_setup+s[b:]

          if 'audio-v13.js' not in s:
              marker='<script src="ui-v11.js?v=12"></script>'
              if marker in s:
                  s=s.replace(marker,marker+'\n<script src="audio-v13.js?v=13"></script>')
              else:
                  s=s.replace('</body>','<script src="audio-v13.js?v=13"></script>\n</body>')
          p.write_text(s,encoding='utf-8')

          ap=Path('1-4/audio-v13.js')
          atext=ap.read_text(encoding='utf-8')
          needle="setTimeout(injectUI,500);setTimeout(refreshInfo,900)}"
          repl="setTimeout(injectUI,500);setTimeout(refreshInfo,900);setTimeout(function(){var db=$('desktopAudioTest');if(db)db.onclick=function(){loadRegistry(function(){speak('مرحبا يا '+username()+'، هذا اختبار للصوت المسجل',true)})}},650)}"
          if needle in atext:
              atext=atext.replace(needle,repl)
          ap.write_text(atext,encoding='utf-8')
          PY

      - name: Validate generated audio and integration
        shell: bash
        run: |
          set -euo pipefail
          test -s 1-4/audio/نور/test.mp3
          test -s 1-4/audio/نور/cheer-01.mp3
          test -s 1-4/audio/registry.json
          grep -q 'audio-v13.js?v=13' 1-4/index.html
          grep -q 'legacySpeakSmart' 1-4/index.html
          grep -q "sw.js?v=13" 1-4/index.html
          grep -q 'forceUpdateV13' 1-4/index.html

      - name: Commit V13 generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 1-4/index.html 1-4/audio-v13.js 1-4/audio 1-4/version.json 1-4/sw.js
          git rm -f .github/workflows/v13-audio-refresh.yml
          git commit -m "Add V13 forced refresh and Noor bundled Arabic audio"
          git push
