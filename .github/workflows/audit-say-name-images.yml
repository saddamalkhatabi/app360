name: Audit Say and Name Image Semantics

on:
  push:
    branches:
      - fix/say-name-image-semantic-mapping-v24
    paths:
      - .github/workflows/audit-say-name-images.yml
      - apps/1-4/say-and-name/tools/audit_word_image_semantics.py
      - apps/1-4/say-and-name/data/levels-inline-v8.js
      - apps/1-4/say-and-name/data/word-images-map.js
      - apps/1-4/say-and-name/data/word-images-manifest.json

permissions:
  contents: write

concurrency:
  group: audit-say-name-image-semantics-v24
  cancel-in-progress: true

jobs:
  audit-images:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install semantic audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchvision==0.21.0
          python -m pip install transformers==4.49.0 scipy==1.15.2 pillow==11.1.0

      - name: Audit all mappings and animal image semantics
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: python apps/1-4/say-and-name/tools/audit_word_image_semantics.py

      - name: Show reported animal results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('apps/1-4/say-and-name/data/image-semantic-audit.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          rows={x['word']:x for x in d['animals']['rows']}
          for word in ['قرد','نسر','جمل']:
              print(word, json.dumps(rows.get(word), ensure_ascii=False))
          print('suspects', len(d['animals']['suspects']))
          print('strong_suspects', len(d['animals']['strong_suspects']))
          PY

      - name: Commit audit report and context image map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/1-4/say-and-name/data/image-semantic-audit.json \
                  apps/1-4/say-and-name/data/word-images-context-map.js \
                  apps/1-4/say-and-name/IMAGE_SEMANTIC_AUDIT_AR.md
          if git diff --cached --quiet; then
            echo "No audit output changes."
            exit 0
          fi
          git commit -m "Audit Say and Name image semantics"
          git push origin HEAD:${GITHUB_REF_NAME}
