name: Unpack maker scene pilot asset archive
on:
  push:
    branches: [family-school-360-preview]
    paths:
      - 'apps/4-8/maker-solutions-lab/assets/scene-pilot-assets.zip'
      - 'apps/4-8/maker-solutions-lab/data/scene-assets.json'
      - 'apps/4-8/maker-solutions-lab/tools/unpack_scene_pack.py'
      - '.github/workflows/unpack-maker-scene-pilot.yml'
permissions:
  contents: write
concurrency:
  group: maker-scene-pilot-unpack
  cancel-in-progress: false
jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and extract images and recordings
        run: python3 apps/4-8/maker-solutions-lab/tools/unpack_scene_pack.py
      - name: Commit the extracted assets on the preview branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/4-8/maker-solutions-lab/assets/scenes/ apps/4-8/maker-solutions-lab/audio/ar/scene-*.mp3 apps/4-8/maker-solutions-lab/audio/en/scene-*.mp3
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Extract validated scene pilot images and narration'
          git push origin HEAD:family-school-360-preview
