name: Refresh Calm Recorded-Audio Labels Offline
on:
  push:
    branches: [fix/calm-child-meaningful-visuals-20261010]
    paths:
      - '.github/workflows/calm-recorded-audio-labels-offline.yml'
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register changed toddler label and recorded-audio UI sources
        run: python3 apps/1-4/calm-with-me/tooling/sync-photo-offline-v1.py
      - name: Commit offline app catalog only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offline/a1-calm.json data/offline-catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Calm offline assets for سعيد and recorded audio labels"
            git pull --rebase origin fix/calm-child-meaningful-visuals-20261010
            git push origin HEAD:fix/calm-child-meaningful-visuals-20261010
          fi
