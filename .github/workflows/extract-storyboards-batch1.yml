name: Extract Storyboards Batch 1

on:
  push:
    paths:
      - '.github/workflows/extract-storyboards-batch1.yml'
      - 'apps/1-4/imitate-one-step/storyboards/imitate_one_step_storyboards_batch1_webp_only.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message || '', '[storyboards-extracted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Extract and normalize batch
        shell: bash
        run: |
          set -euo pipefail
          APP='apps/1-4/imitate-one-step'
          ZIP="$APP/storyboards/imitate_one_step_storyboards_batch1_webp_only.zip"
          TMP="$(mktemp -d)"
          unzip -q "$ZIP" -d "$TMP"
          mkdir -p "$APP/storyboards/batch1"
          python - <<'PY'
          from PIL import Image, ImageEnhance
          from pathlib import Path
          import json

          app = Path('apps/1-4/imitate-one-step')
          src = Path('/tmp')
          # Locate the temp extraction directory created by mktemp by finding the uploaded batch manifest.
          candidates = list(Path('/tmp').glob('tmp.*/manifest.json')) + list(Path('/tmp').glob('*/manifest.json'))
          manifest_src = next((p for p in candidates if p.exists()), None)
          if manifest_src is None:
              raise SystemExit('batch manifest not found after unzip')
          batch = manifest_src.parent
          out = app / 'storyboards' / 'batch1'
          out.mkdir(parents=True, exist_ok=True)

          imported = []
          for n in range(1, 11):
              ident = f'{n:03d}'
              p = batch / f'{ident}.webp'
              if not p.exists():
                  raise SystemExit(f'missing {p}')
              im = Image.open(p).convert('RGB')
              w, h = im.size
              cell_w = w / 5.0
              row_h = h / 3.0
              panels = []
              for col in range(5):
                  x0 = int(round(col * cell_w))
                  x1 = int(round((col + 1) * cell_w))
                  y1 = int(round(row_h))
                  cell = im.crop((x0, 0, x1, y1))
                  trim = 4
                  cell = cell.crop((trim, trim, max(trim + 1, cell.width - trim), max(trim + 1, cell.height - trim)))
                  side = min(cell.width, cell.height)
                  left = (cell.width - side) // 2
                  top = (cell.height - side) // 2
                  cell = cell.crop((left, top, left + side, top + side))
                  cell = cell.resize((900, 900), Image.Resampling.LANCZOS)
                  cell = ImageEnhance.Sharpness(cell).enhance(1.10)
                  panels.append(cell)
              strip = Image.new('RGB', (4500, 900), 'white')
              for i, panel in enumerate(panels):
                  strip.paste(panel, (i * 900, 0))
              target = out / f'{ident}.webp'
              strip.save(target, 'WEBP', quality=88, method=6)
              imported.append({'id': ident, 'path': f'storyboards/batch1/{ident}.webp', 'width': 4500, 'height': 900, 'panels': 5})

          (out / 'import-manifest.json').write_text(json.dumps({
              'schema_version': '1.0',
              'status': 'staging-review',
              'note_ar': 'تم استخراج وتوحيد الصور العشر إلى خمسة ألواح أفقية متساوية. 001 متوافق مع التجربة الحالية؛ 002-010 تحتاج إعادة مطابقة/توليد قبل الربط بالمحتوى الحي.',
              'assets': imported
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          main_manifest_path = app / 'storyboards' / 'manifest.json'
          main_manifest = json.loads(main_manifest_path.read_text(encoding='utf-8'))
          main_manifest['updated'] = '2026-09-19'
          main_manifest['expected_dimensions'] = '4500x900 (5 equal 900x900 panels)'
          main_manifest['assets']['001'] = 'storyboards/batch1/001.webp'
          main_manifest['note_ar'] = 'التجربة 001 تستخدم الصورة البشرية الفوتوغرافية الجديدة. الصور 002-010 مستخرجة في storyboards/batch1 بانتظار مطابقة المحتوى الصحيح قبل تفعيلها.'
          main_manifest_path.write_text(json.dumps(main_manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit extracted storyboards
        shell: bash
        run: |
          git config user.name 'app360-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/1-4/imitate-one-step/storyboards/batch1 apps/1-4/imitate-one-step/storyboards/manifest.json
          if git diff --cached --quiet; then
            echo 'No storyboard changes to commit.'
            exit 0
          fi
          git commit -m 'Extract batch 1 storyboards [storyboards-extracted]'
          git push
