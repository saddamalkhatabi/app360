name: Extract Storyboards Batch 1

on:
  push:
    paths:
      - '.github/workflows/extract-storyboards-batch1.yml'
      - 'apps/1-4/imitate-one-step/storyboards/imitate_one_step_storyboards_batch1_webp_only.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message || '', '[storyboards-direct]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Extract and normalize batch directly into storyboards
        shell: bash
        run: |
          set -euo pipefail
          APP='apps/1-4/imitate-one-step'
          ZIP="$APP/storyboards/imitate_one_step_storyboards_batch1_webp_only.zip"
          TMP="$(mktemp -d)"
          unzip -q "$ZIP" -d "$TMP"
          export STORYBOARD_TMP="$TMP"
          python - <<'PY'
          from PIL import Image, ImageEnhance
          from pathlib import Path
          import json, os, shutil

          app = Path('apps/1-4/imitate-one-step')
          batch = Path(os.environ['STORYBOARD_TMP'])
          out = app / 'storyboards'

          imported = []
          for n in range(1, 11):
              ident = f'{n:03d}'
              p = batch / f'{ident}.webp'
              if not p.exists():
                  raise SystemExit(f'missing {p}')
              im = Image.open(p).convert('RGB')
              w, h = im.size
              # The generated source is a 5-column x 3-row contact sheet.
              # Use the first row as the five ordered storyboard frames.
              cell_w = w / 5.0
              row_h = h / 3.0
              panels = []
              for col in range(5):
                  x0 = int(round(col * cell_w))
                  x1 = int(round((col + 1) * cell_w))
                  y1 = int(round(row_h))
                  cell = im.crop((x0, 0, x1, y1))
                  trim = 4
                  cell = cell.crop((trim, trim, max(trim + 1, cell.width - trim), max(trim + 1, cell.height - trim)))
                  side = min(cell.width, cell.height)
                  left = (cell.width - side) // 2
                  top = (cell.height - side) // 2
                  cell = cell.crop((left, top, left + side, top + side))
                  cell = cell.resize((900, 900), Image.Resampling.LANCZOS)
                  cell = ImageEnhance.Sharpness(cell).enhance(1.10)
                  panels.append(cell)
              strip = Image.new('RGB', (4500, 900), 'white')
              for i, panel in enumerate(panels):
                  strip.paste(panel, (i * 900, 0))
              target = out / f'{ident}.webp'
              strip.save(target, 'WEBP', quality=88, method=6)
              imported.append({'id': ident, 'path': f'storyboards/{ident}.webp', 'width': 4500, 'height': 900, 'panels': 5})

          staging = out / 'batch1'
          if staging.exists():
              shutil.rmtree(staging)

          main_manifest_path = out / 'manifest.json'
          main_manifest = json.loads(main_manifest_path.read_text(encoding='utf-8'))
          main_manifest['updated'] = '2026-09-19'
          main_manifest['expected_dimensions'] = '4500x900 (5 equal 900x900 panels)'
          for n in range(1, 11):
              ident = f'{n:03d}'
              main_manifest['assets'][ident] = f'storyboards/{ident}.webp'
          main_manifest['note_ar'] = 'الدفعة الأولى 001-010 مفعلة مباشرة من مجلد storyboards بصيغة WebP، وكل ملف 4500x900 ويحتوي خمس لقطات 900x900.'
          main_manifest['layout'] = '5 equal horizontal panels'
          main_manifest_path.write_text(json.dumps(main_manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit direct storyboards
        shell: bash
        run: |
          git config user.name 'app360-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A apps/1-4/imitate-one-step/storyboards
          if git diff --cached --quiet; then
            echo 'No storyboard changes to commit.'
            exit 0
          fi
          git commit -m 'Place first ten storyboards directly [storyboards-direct]'
          git push
