name: Validate Say and Name v25

on:
  push:
    branches: [main]
    paths:
      - 'apps/1-4/say-and-name/**'
      - '.github/workflows/validate-say-name-v17.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: node --check apps/1-4/say-and-name/runtime-v19.js
      - name: Validate bilingual controls, context images and cache references
        run: |
          grep -q 'data-lang="both"' apps/1-4/say-and-name/index.html
          grep -q 'data-voice="both"' apps/1-4/say-and-name/runtime-v19.js
          grep -q 'runtime-v19.js?v=25' apps/1-4/say-and-name/index.html
          grep -q 'word-images-context-map.js?v=25' apps/1-4/say-and-name/index.html
          grep -q "app360-app-say-and-name-v25" apps/1-4/say-and-name/sw.js
          grep -q 'word-images-context-map.js?v=25' apps/1-4/say-and-name/sw.js
          grep -q '"قرد":"w0283.jpg"' apps/1-4/say-and-name/data/word-images-map.js
          grep -q '"نسر":"w0107.jpg"' apps/1-4/say-and-name/data/word-images-map.js
          grep -q '"جمل":"w0284.jpg"' apps/1-4/say-and-name/data/word-images-map.js
          grep -q '"بطريق":"w0256.jpg"' apps/1-4/say-and-name/data/word-images-map.js
          grep -q '"أسد":"corrected-lion-v24.jpg"' apps/1-4/say-and-name/data/word-images-map.js
          grep -q '"فيل":"corrected-elephant-v24.jpg"' apps/1-4/say-and-name/data/word-images-map.js
          grep -q '"سلحفاة":"corrected-turtle-v24.jpg"' apps/1-4/say-and-name/data/word-images-map.js
          grep -q '"قرش":"corrected-shark-v24.jpg"' apps/1-4/say-and-name/data/word-images-map.js
          grep -q '"فظ":"corrected-walrus-v24.jpg"' apps/1-4/say-and-name/data/word-images-map.js
      - name: Validate final all-word semantic audit summary
        run: |
          grep -Fq 'الصور المفحوصة دلاليًا: **985 / 985**' apps/1-4/say-and-name/IMAGE_ALL_WORDS_AUDIT_AR.md
          grep -Fq 'حالات الاشتباه القوية بعد الإصلاح النهائي: **0**' apps/1-4/say-and-name/IMAGE_ALL_WORDS_AUDIT_AR.md
          grep -Fq 'ملفات الصور المفقودة: **0**' apps/1-4/say-and-name/IMAGE_ALL_WORDS_AUDIT_AR.md
      - name: Confirm RawGitHack preview refreshed
        shell: bash
        run: |
          URL='https://raw.githack.com/saddamalkhatabi/app360/main/apps/1-4/say-and-name/index.html?v=25'
          ok=0
          for i in {1..18}; do
            if curl -fsSL -H 'Cache-Control: no-cache' "$URL" -o /tmp/live.html && grep -q 'runtime-v19.js?v=25' /tmp/live.html && grep -q 'word-images-context-map.js?v=25' /tmp/live.html && grep -q 'data-lang="both"' /tmp/live.html; then
              echo 'RawGitHack preview is on v25.'
              ok=1
              break
            fi
            echo "Preview still stale; retry $i/18"
            sleep 10
          done
          test "$ok" = 1
