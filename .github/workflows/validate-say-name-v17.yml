name: Validate Say and Name recorded player
on:
  push:
    branches: [main]
    paths:
      - 'apps/1-4/say-and-name/**'
      - '.github/workflows/validate-say-name-v17.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate vocabulary data, authored coverage and player behavior
        run: |
          npm run validate --prefix apps/1-4/say-and-name
          node --check apps/1-4/say-and-name/runtime-v19.js
          node --check apps/1-4/say-and-name/runtime-v27.js
          node apps/1-4/say-and-name/tools/test-recorded-player.cjs
          node tooling/test-first-words-ai-adapter.js
          python apps/1-4/say-and-name/tools/prepare_silma.py
      - name: Validate active entry and meaning-specific recordings
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('apps/1-4/say-and-name')
          html=(root/'index.html').read_text()
          assert 'data-lang="both"' in html
          assert "importScripts('../../../assets/js/offline-worker-v1.js?v=1')" in (root/'sw.js').read_text()
          for path in re.findall(r'<script src="([^"?]+)',html):assert (root/path).is_file(),path
          if 'runtime-v27.js' in html:
              data=json.loads((root/'data/silma-map.js').read_text().split('=',1)[1].strip().rstrip(';'))
              assert len(data['words'])==985
              assert data['senses']['الجسم\u0001ظهر']!=data['senses']['الوقت\u0001ظهر']
              for table in ('words','senses','guides'):
                  for key,path in data[table].items():assert (root/path).is_file(),(key,path)
              assert 'id="childAudioHelpBtn"' in html
          print('Active entry and vocabulary verified')
          PY
