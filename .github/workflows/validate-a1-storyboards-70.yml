name: Validate A1 Storyboards 001-070

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-a1-storyboards-70.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate A1 app
        shell: bash
        run: |
          set -euo pipefail
          cd apps/1-4/imitate-one-step
          npm run validate
