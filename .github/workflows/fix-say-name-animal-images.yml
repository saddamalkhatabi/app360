name: Fix Say and Name Animal Image Mapping

on:
  push:
    branches:
      - fix/say-name-image-semantic-mapping-v24
    paths:
      - .github/workflows/fix-say-name-animal-images.yml
      - apps/1-4/say-and-name/tools/apply_animal_image_corrections.py

permissions:
  contents: write

concurrency:
  group: fix-say-name-animal-images-v24
  cancel-in-progress: true

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply reciprocal high-confidence animal corrections
        run: python apps/1-4/say-and-name/tools/apply_animal_image_corrections.py

      - name: Install semantic verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchvision==0.21.0
          python -m pip install transformers==4.49.0 scipy==1.15.2 pillow==11.1.0

      - name: Re-audit corrected mappings
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: python apps/1-4/say-and-name/tools/audit_word_image_semantics.py

      - name: Verify reported words and correction quality
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('apps/1-4/say-and-name')
          marker='window.APP360_WORD_IMAGE_MAP='
          text=(root/'data/word-images-map.js').read_text(encoding='utf-8').strip()
          m=json.loads(text[len(marker):-1])
          assert m['قرد']=='w0283.jpg', m['قرد']
          assert m['نسر']=='w0107.jpg', m['نسر']
          assert m['جمل']=='w0284.jpg', m['جمل']
          assert m['بطريق']=='w0256.jpg', m['بطريق']
          audit=json.loads((root/'data/image-semantic-audit.json').read_text(encoding='utf-8'))
          rows={r['word']:r for r in audit['animals']['rows']}
          for word in ['قرد','نسر','جمل','بطريق']:
              r=rows[word]
              print(word, r['file'], r['best_word_for_this_image'], r['margin_over_current'])
              assert r['best_word_for_this_image']==word, r
          before_strong=18
          after_strong=len(audit['animals']['strong_suspects'])
          print('Strong suspects after repair:',after_strong)
          assert after_strong < before_strong, (before_strong,after_strong)
          corrections=json.loads((root/'data/animal-image-corrections.json').read_text(encoding='utf-8'))
          print('Corrected words:',corrections['corrected_words'])
          assert corrections['corrected_words'] >= 4
          PY

      - name: Commit corrected animal image mapping and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/1-4/say-and-name/data/word-images-map.js \
                  apps/1-4/say-and-name/data/animal-image-corrections.json \
                  apps/1-4/say-and-name/data/image-semantic-audit.json \
                  apps/1-4/say-and-name/data/word-images-context-map.js \
                  apps/1-4/say-and-name/IMAGE_SEMANTIC_AUDIT_AR.md
          if git diff --cached --quiet; then
            echo "No correction changes to commit."
            exit 0
          fi
          git commit -m "Fix confirmed Say and Name animal image swaps"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
