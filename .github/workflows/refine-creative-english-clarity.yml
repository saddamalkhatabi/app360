name: Refine creative English clarity
on:
  push:
    branches: [main]
    paths: [.github/workflows/refine-creative-english-clarity.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: creative-english-clarity
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HOME: /tmp/silma-hf
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SILMA CPU environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libavcodec-dev libavformat-dev libavutil-dev
          python -m pip install --no-cache-dir torch==2.6.0+cpu torchaudio==2.6.0+cpu torchvision==0.21.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir torchcodec==0.2.1 --index-url https://download.pytorch.org/whl/cpu
          printf 'torch==2.6.0+cpu\ntorchaudio==2.6.0+cpu\ntorchvision==0.21.0+cpu\ntorchcodec==0.2.1\ntransformers==4.51.3\nhuggingface-hub==0.36.0\n' >/tmp/silma-constraints.txt
          python -m pip install --no-cache-dir -c /tmp/silma-constraints.txt --extra-index-url https://download.pytorch.org/whl/cpu silma-tts==1.0.5 uroman huggingface-hub
      - name: Download publisher models
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id='silma-ai/silma-tts',revision='226dd7a65cadf51f9a6dbe3953fc89003b3844d5',allow_patterns=['*.pt','*.safetensors','*.json','*.txt','*.yaml','*.wav','*.model'])
          snapshot_download(repo_id='charactr/vocos-mel-24khz')
          import os,pathlib
          p=pathlib.Path(os.environ['HF_HOME'])/'hub/models--silma-ai--silma-tts/refs/main'
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text('226dd7a65cadf51f9a6dbe3953fc89003b3844d5')
          PY
      - name: Improve short English articulation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/1-4/screen-to-move/tools/build-english-audio.py')
          p.write_text(p.read_text().replace('nfe_step=16','nfe_step=32').replace('seed=360','seed=361'))
          PY
      - name: Generate English recordings
        run: python apps/1-4/screen-to-move/tools/build-english-audio.py --root apps/1-4/screen-to-move --manifest audio/english-clarity-scripts.json --cache /tmp/silma-cache --model-cache "$HF_HOME/hub" --precision fp32 --generate-only --part 0 --parts 1
      - name: Preserve targeted recordings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/1-4/screen-to-move/audio/en/
          git commit -m 'Refine English heart word and finish instruction with SILMA'
          git push origin HEAD:refs/heads/audio/creative-en-clarity-20261012
