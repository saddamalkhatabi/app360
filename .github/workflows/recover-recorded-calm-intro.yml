name: Recover Recorded Calm Introduction MP3
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-recorded-calm-intro.yml
permissions:
  contents: write
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Recover already-generated Arabic and English MP3 without resynthesis
        uses: actions/download-artifact@v4
        with:
          run-id: 37994257810
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: calm-intro-*-mp3
          merge-multiple: true
          path: apps/1-4/calm-with-me/audio/intro/
      - name: Install MP3 validator
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Verify actual media streams and record English and SILMA Arabic outputs
        run: |
          python - <<'PY'
          import json, subprocess, pathlib, hashlib
          root=pathlib.Path('apps/1-4/calm-with-me')
          source=json.loads((root/'audio/intro/scripts.json').read_text(encoding='utf8'))
          result={'schema_version':1,'app_id':'a1-calm','status':'recorded_complete','items':{}}
          for item in source['items']:
           p=root/item['path']
           assert p.is_file() and p.stat().st_size>1500, str(p)
           meta=json.loads(subprocess.check_output(['ffprobe','-v','error','-select_streams','a:0','-show_entries','stream=codec_name,sample_rate,channels:format=duration','-of','json',str(p)],text=True))
           assert meta['streams'][0]['codec_name']=='mp3',p
           assert 3<float(meta['format']['duration'])<55,p
           result['items'][item['language']]={'path':item['path'],'text':item['text'],'size_bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'duration_s':round(float(meta['format']['duration']),2),'engine':item['engine']}
          (root/'audio/intro/recordings.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf8')
          print({k:(v['duration_s'],v['size_bytes']) for k,v in result['items'].items()})
          PY
      - name: Save verified recordings and metadata to original main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/1-4/calm-with-me/audio/intro/
          git commit -m "Save bilingual prerecorded app welcome for young children"
          git pull --rebase origin main
          git push origin HEAD:main
