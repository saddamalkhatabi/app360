name: Finalize App360 Brand V11

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-brand-v11.yml'

permissions:
  contents: write

jobs:
  finalize-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tooling
        run: sudo apt-get update -qq && sudo apt-get install -y imagemagick webp
      - name: Build final logo and full mark icons
        shell: bash
        run: |
          set -euo pipefail
          SRC='assets/brand/app360-lab-logo-v10.webp'
          test -f "$SRC"
          W=$(identify -format '%w' "$SRC")
          H=$(identify -format '%h' "$SRC")
          X=$((W*17/100)); Y=$((H*80/100)); RW=$((W*21/100)); RH=$((H*15/100))
          TX=$((W*21/100)); TY=$((H*92/100)); FS=$((W*6/100)); SW=$((W/160)); LY=$((H*90/100))
          # Keep the approved original artwork, remove only the bad black 360 patch,
          # then add a clean 360 beside the original Arabic subtitle.
          convert "$SRC" -alpha on \
            -region "${RW}x${RH}+${X}+${Y}" -channel A -evaluate set 0 +channel +region \
            -font DejaVu-Sans-Bold -pointsize "$FS" -fill '#0AA7B5' -stroke none \
            -draw "text ${TX},${TY} '360'" \
            -stroke '#F4C027' -strokewidth "$SW" \
            -draw "line $((W*8/100)),${LY} $((W*17/100)),${LY}" \
            -quality 88 assets/brand/app360-lab-logo.webp

          # Build the header/PWA icon from the complete top symbol of the logo.
          MARKH=$((H*68/100))
          convert "$SRC" -crop "${W}x${MARKH}+0+0" +repage -trim +repage \
            -resize '440x440>' -gravity center -background none -extent 512x512 /tmp/app360-mark-512.png
          convert /tmp/app360-mark-512.png -resize 512x512 assets/brand/app360-lab-icon-512.png
          convert /tmp/app360-mark-512.png -resize 192x192 assets/brand/app360-lab-icon-192.png
          convert /tmp/app360-mark-512.png -resize 180x180 assets/brand/app360-lab-icon-180.png
          convert /tmp/app360-mark-512.png -resize 32x32 assets/brand/app360-lab-icon-32.png
          identify assets/brand/app360-lab-logo.webp assets/brand/app360-lab-icon-512.png assets/brand/app360-lab-icon-192.png assets/brand/app360-lab-icon-180.png assets/brand/app360-lab-icon-32.png

      - name: Update portal references, PWA and cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('assets/brand/app360-lab-logo-v10.webp?v=10','assets/brand/app360-lab-logo.webp?v=11')
          s=s.replace('assets/brand/app360-lab-icon-512.png?v=10','assets/brand/app360-lab-icon-192.png?v=11')
          s=s.replace('assets/brand/app360-lab-icon-180.png?v=10','assets/brand/app360-lab-icon-180.png?v=11')
          s=s.replace('manifest.webmanifest?v=10','manifest.webmanifest?v=11')
          s=s.replace('assets/css/lab360.css?v=4','assets/css/lab360.css?v=11')
          s=re.sub(r'\n<link rel="stylesheet" id="brandV10Css"[^>]*>','',s)
          s=s.replace('assets/js/lab360.js?v=10','assets/js/lab360.js?v=11')
          s=s.replace('assets/js/pwa-install.js?v=5','assets/js/pwa-install.js?v=11')
          s=s.replace('<link rel="icon" type="image/png" sizes="192x192" href="assets/brand/app360-lab-icon-192.png?v=11">','<link rel="icon" type="image/png" sizes="32x32" href="assets/brand/app360-lab-icon-32.png?v=11">')
          p.write_text(s,encoding='utf-8')

          p=Path('assets/js/lab360.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"function applyPortalBrand\(\)\{.*?\}\nvar catalog", "function applyPortalBrand(){var bm=d.querySelector?d.querySelector('.brand-mark'):null;if(bm)bm.innerHTML='<img src=\\\"'+esc(rootPath('assets/brand/app360-lab-icon-192.png?v=11'))+'\\\" alt=\\\"\\\">'}\nvar catalog", s, flags=re.S)
          p.write_text(s,encoding='utf-8')

          p=Path('assets/js/pwa-install.js')
          s=p.read_text(encoding='utf-8').replace("sw.js?v=9","sw.js?v=11")
          p.write_text(s,encoding='utf-8')

          p=Path('manifest.webmanifest')
          m=json.loads(p.read_text(encoding='utf-8'))
          m['start_url']='./index.html?v=11'
          m['icons']=[
            {'src':'assets/brand/app360-lab-icon-192.png?v=11','sizes':'192x192','type':'image/png','purpose':'any'},
            {'src':'assets/brand/app360-lab-icon-512.png?v=11','sizes':'512x512','type':'image/png','purpose':'any maskable'}
          ]
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Refresh all age pages so they never keep old CSS/JS caches.
          for p in Path('ages').glob('*/index.html'):
            s=p.read_text(encoding='utf-8')
            s=re.sub(r'../../assets/css/lab360\.css\?v=\d+','../../assets/css/lab360.css?v=11',s)
            s=re.sub(r'../../assets/js/lab360\.js\?v=\d+','../../assets/js/lab360.js?v=11',s)
            p.write_text(s,encoding='utf-8')

          # Merge the final brand rules into the single shared stylesheet.
          p=Path('assets/css/lab360.css')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'/\* APP360 BRAND V11 START \*/.*?/\* APP360 BRAND V11 END \*/','',s,flags=re.S)
          s += '''\n/* APP360 BRAND V11 START */\n.topbar{overflow:visible}.brand-mark{width:88px!important;height:66px!important;flex:0 0 88px!important;overflow:visible!important;background:transparent!important;border:0!important;box-shadow:none!important}.brand-mark img{width:80px!important;height:60px!important;max-width:80px!important;max-height:60px!important;object-fit:contain!important;object-position:center!important;display:block!important;transform:none!important;filter:drop-shadow(0 3px 5px rgba(0,0,0,.18))}.hero-brand-side{min-height:330px}.hero-logo-wrap{position:relative;z-index:1;width:min(340px,100%)}.hero-brand-side .hero-original-logo{width:100%!important;height:auto!important;max-width:none!important;object-fit:contain!important;display:block!important;transform:none!important;background:transparent!important;filter:drop-shadow(0 14px 24px rgba(6,89,105,.13))}.footer-mark{width:64px!important;height:64px!important;object-fit:contain!important;transform:none!important;background:transparent!important}@media(max-width:1040px){.hero-logo-wrap{width:min(300px,100%)}.hero-brand-side{min-height:270px}}@media(max-width:760px){.brand-mark{width:76px!important;height:58px!important;flex-basis:76px!important}.brand-mark img{width:68px!important;height:54px!important;max-width:68px!important;max-height:54px!important}.hero-logo-wrap{width:min(300px,88vw)}.hero-brand-side{min-height:auto}}\n/* APP360 BRAND V11 END */\n'''
          p.write_text(s,encoding='utf-8')
          PY

          cat > sw.js <<'EOF'
          var CACHE='app360-portal-v11';
          var CORE=[
            './','./index.html?v=11','./manifest.webmanifest?v=11',
            './assets/css/lab360.css?v=11',
            './assets/js/lab360.js?v=11','./assets/js/pwa-install.js?v=11',
            './assets/brand/app360-lab-logo.webp?v=11',
            './assets/brand/app360-lab-icon-32.png?v=11','./assets/brand/app360-lab-icon-180.png?v=11','./assets/brand/app360-lab-icon-192.png?v=11','./assets/brand/app360-lab-icon-512.png?v=11',
            './data/catalog.json','./data/goals.json',
            './ages/1-4/index.html','./ages/4-8/index.html','./ages/8-12/index.html','./ages/12-16/index.html',
            './ages/16-24/index.html','./ages/24-45/index.html','./ages/45-60/index.html','./ages/60-80/index.html'
          ];
          self.addEventListener('install',function(e){e.waitUntil(caches.open(CACHE).then(function(c){return Promise.all(CORE.map(function(u){return c.add(u).catch(function(){return null})}))}));if(self.skipWaiting)self.skipWaiting()});
          self.addEventListener('activate',function(e){e.waitUntil(caches.keys().then(function(keys){return Promise.all(keys.map(function(k){if(k.indexOf('app360-portal-')===0&&k!==CACHE)return caches.delete(k)}))}).then(function(){return self.clients&&self.clients.claim?self.clients.claim():null}))});
          self.addEventListener('message',function(e){if(e.data&&e.data.type==='SKIP_WAITING'&&self.skipWaiting)self.skipWaiting()});
          function sameOrigin(req){try{return new URL(req.url).origin===self.location.origin}catch(e){return false}}
          function networkFirst(req,fallback){return fetch(req,{cache:'no-store'}).then(function(resp){if(resp&&resp.ok&&sameOrigin(req)){var copy=resp.clone();caches.open(CACHE).then(function(c){c.put(req,copy)});}return resp}).catch(function(){return caches.match(req).then(function(hit){return hit||caches.match(fallback||'./index.html?v=11')})})}
          function staleWhileRevalidate(req){return caches.match(req).then(function(hit){var update=fetch(req).then(function(resp){if(resp&&resp.ok&&sameOrigin(req)){var copy=resp.clone();caches.open(CACHE).then(function(c){c.put(req,copy)});}return resp}).catch(function(){return null});return hit||update})}
          self.addEventListener('fetch',function(e){var req=e.request;if(!req||req.method!=='GET'||!sameOrigin(req))return;var url=req.url||'';var isData=url.indexOf('/data/catalog.json')>=0||url.indexOf('/data/goals.json')>=0;var isBrand=url.indexOf('/assets/brand/')>=0||url.indexOf('/manifest.webmanifest')>=0;if(req.mode==='navigate'){e.respondWith(networkFirst(req,'./index.html?v=11'));return}if(isData||isBrand){e.respondWith(networkFirst(req));return}e.respondWith(staleWhileRevalidate(req))});
          EOF

      - name: Remove obsolete brand assets and temporary files
        shell: bash
        run: |
          rm -rf assets/brand/.transport-v11
          rm -f assets/brand/app360-lab-logo-transparent.png
          rm -f assets/brand/app360-lab-logo-v10.webp
          rm -f assets/brand/app360-lab-mark.webp
          rm -f assets/brand/app360-lab-og.jpg
          rm -f assets/brand/favicon-32.png assets/brand/favicon-64.png assets/brand/favicon.ico
          rm -f assets/css/brand-v7.css assets/css/brand-v10.css
          rm -f .github/workflows/build-brand-v11.yml

      - name: Verify final brand surface
        shell: bash
        run: |
          set -e
          test -f assets/brand/app360-lab-logo.webp
          test -f assets/brand/app360-lab-icon-32.png
          test -f assets/brand/app360-lab-icon-180.png
          test -f assets/brand/app360-lab-icon-192.png
          test -f assets/brand/app360-lab-icon-512.png
          test ! -e assets/brand/app360-lab-logo-v10.webp
          test ! -e assets/brand/.transport-v11
          grep -q 'app360-lab-logo.webp?v=11' index.html
          grep -q "app360-portal-v11" sw.js
          grep -q 'app360-lab-icon-192.png?v=11' manifest.webmanifest
          find assets/brand -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Commit final V11 brand
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize App360 brand v11 and remove obsolete brand assets'
          git push origin HEAD:main
