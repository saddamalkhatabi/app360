name: Build App360 Brand V11

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-brand-v11.yml'

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tooling
        run: sudo apt-get update -qq && sudo apt-get install -y imagemagick
      - name: Generate exact PWA icons from approved mark
        shell: bash
        run: |
          set -euo pipefail
          convert assets/brand/app360-lab-mark.webp -resize 192x192 -background none -gravity center -extent 192x192 assets/brand/app360-lab-icon-192.png
          convert assets/brand/app360-lab-mark.webp -resize 512x512 -background none -gravity center -extent 512x512 assets/brand/app360-lab-icon-512.png
          convert assets/brand/app360-lab-mark.webp -resize 180x180 -background none -gravity center -extent 180x180 assets/brand/app360-lab-icon-180.png
          identify assets/brand/app360-lab-icon-192.png assets/brand/app360-lab-icon-512.png assets/brand/app360-lab-icon-180.png
      - name: Commit generated icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/brand/app360-lab-icon-180.png assets/brand/app360-lab-icon-192.png assets/brand/app360-lab-icon-512.png
          git commit -m 'Generate final portal PWA icons from approved mark' || exit 0
          git push origin HEAD:main
