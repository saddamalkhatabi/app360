name: Finalize Calm Five-Photo Offline Package
on:
  push:
    branches: [fix/calm-child-meaningful-visuals-20261010]
    paths: [.github/workflows/calm-finalize-five-offline.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update only a1-calm offline images scripts and asset hashes
        run: python3 apps/1-4/calm-with-me/tooling/sync-photo-offline-v1.py
      - name: Commit updated offline catalog hashes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offline/a1-calm.json data/offline-catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Calm 5-photo offline bundle and child age selection script"
            git pull --rebase origin fix/calm-child-meaningful-visuals-20261010
            git push origin HEAD:fix/calm-child-meaningful-visuals-20261010
          fi
