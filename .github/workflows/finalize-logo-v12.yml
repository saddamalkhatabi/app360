name: Finalize exact App360 logo V12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-logo-v12.yml'

permissions:
  contents: write

jobs:
  finalize-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image tooling
        run: sudo apt-get update -qq && sudo apt-get install -y imagemagick webp

      - name: Rebuild exact approved logo from staged transport
        shell: bash
        run: |
          set -euo pipefail
          T='assets/brand/.transport-v12'
          : > /tmp/app360-logo-source.webp
          for f in \
            "$T/logo-00" \
            "$T/logo-01" \
            "$T/logo-02a" \
            "$T/part-09" \
            "$T/part-10" \
            "$T/part-11" \
            "$T/parts-12-13" \
            "$T/parts-14-15" \
            "$T/parts-16-17" \
            "$T/parts-18-19" \
            "$T/parts-20-21" \
            "$T/parts-22-23" \
            "$T/parts-24-25" \
            "$T/parts-26-27" \
            "$T/parts-28-29" \
            "$T/parts-30-31"; do
              tr -d '\r\n\t ' < "$f" | base64 -d >> /tmp/app360-logo-source.webp
          done
          identify /tmp/app360-logo-source.webp
          test "$(stat -c%s /tmp/app360-logo-source.webp)" -lt 300000
          cp /tmp/app360-logo-source.webp assets/brand/app360-lab-logo.webp
          identify -format 'final=%m %wx%h %[channels] bytes=%b\n' assets/brand/app360-lab-logo.webp

      - name: Move portal and PWA cache to V12
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/v=11/v=12/g' index.html manifest.webmanifest sw.js assets/js/pwa-install.js assets/js/lab360.js
          for f in ages/*/index.html; do
            sed -i 's/lab360\.css?v=1/lab360.css?v=12/g; s/lab360\.js?v=1/lab360.js?v=12/g' "$f"
          done
          grep -q 'app360-lab-logo.webp?v=12' index.html
          grep -q "app360-portal-v12" sw.js
          grep -q "sw.js?v=12" assets/js/pwa-install.js

      - name: Remove staging transport and this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/brand/.transport-v12
          rm -f .github/workflows/finalize-logo-v12.yml

      - name: Commit final exact logo V12
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use exact approved App360 logo and refresh portal cache v12'
          git push origin HEAD:main
