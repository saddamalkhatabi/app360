name: Finalize approved App360 logo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-logo-v12.yml'

permissions:
  contents: write

jobs:
  finalize-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode exact approved original logo
        shell: bash
        run: |
          set -euo pipefail
          base64 -d assets/brand/.transport-v14/logo.b64 > /tmp/app360-lab-logo.webp
          test "$(stat -c%s /tmp/app360-lab-logo.webp)" = "112798"
          test "$(head -c4 /tmp/app360-lab-logo.webp)" = "RIFF"
          file /tmp/app360-lab-logo.webp
          cp /tmp/app360-lab-logo.webp assets/brand/app360-lab-logo.webp

      - name: Refresh portal and PWA to V14
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/v=11/v=14/g' index.html manifest.webmanifest sw.js assets/js/pwa-install.js assets/js/lab360.js
          for f in ages/*/index.html; do
            sed -i 's/lab360\.css?v=1/lab360.css?v=14/g; s/lab360\.js?v=1/lab360.js?v=14/g' "$f"
          done
          grep -q 'app360-lab-logo.webp?v=14' index.html
          grep -q "app360-portal-v14" sw.js
          grep -q "sw.js?v=14" assets/js/pwa-install.js
          grep -q 'app360-lab-icon-192.png?v=14' assets/js/lab360.js

      - name: Remove temporary transport and workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/brand/.transport-v12 assets/brand/.transport-v14
          rm -f .github/workflows/finalize-logo-v12.yml

      - name: Commit final portal logo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use approved original App360 logo and refresh portal cache v14'
          git push origin HEAD:main
