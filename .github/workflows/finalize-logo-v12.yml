name: Finalize exact App360 logo V12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-logo-v12.yml'

permissions:
  contents: write

jobs:
  finalize-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose and rebuild exact approved logo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, pathlib, string
          root=pathlib.Path('assets/brand/.transport-v12')
          names=['logo-00','logo-01','logo-02a','part-09','part-10','part-11','parts-12-13','parts-14-15','parts-16-17','parts-18-19','parts-20-21','parts-22-23','parts-24-25','parts-26-27','parts-28-29','parts-30-31']
          allowed=set(string.ascii_letters+string.digits+'+/=')
          chunks=[]
          for name in names:
              s=(root/name).read_text(errors='replace')
              c=''.join(s.split())
              bad=sorted(set(c)-allowed)
              print(name,'len',len(c),'mod4',len(c)%4,'eq',c.count('='),'bad',repr(''.join(bad)),'head',c[:8],'tail',c[-12:])
              chunks.append(c)
          data=''.join(chunks)
          print('TOTAL',len(data),'mod4',len(data)%4,'eq',data.count('='))
          print('eq positions', [i for i,x in enumerate(data) if x=='='][:20], 'last', [i for i,x in enumerate(data) if x=='='][-20:])
          filtered=''.join(ch for ch in data if ch in allowed and ch!='=')
          filtered += '='*((4-len(filtered)%4)%4)
          print('FILTERED',len(filtered),'mod4',len(filtered)%4)
          raw=base64.b64decode(filtered, validate=False)
          pathlib.Path('/tmp/app360-logo-source.webp').write_bytes(raw)
          print('decoded bytes',len(raw),'head',raw[:12])
          PY
          file /tmp/app360-logo-source.webp
          test "$(head -c4 /tmp/app360-logo-source.webp)" = 'RIFF'
