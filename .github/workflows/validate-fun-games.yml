name: Validate Fun games
on:
  push:
    branches: [main]
    paths:
      - 'apps/1-4/balloon-garden/**'
      - 'apps/1-4/tic-tac-toe/**'
      - 'apps/1-4/lines-and-houses/**'
      - 'apps/1-4/wonder-machine/**'
      - 'apps/1-4/fun-bowling/**'
      - 'apps/1-4/little-car-race/**'
      - 'apps/1-4/toy-city-crane/**'
      - 'tooling/*offline.cjs'
      - 'tooling/lib/build-fun-offline.cjs'
      - 'tooling/test-helpers/**'
      - 'data/catalog.json'
      - 'data/offline/**'
      - 'data/offline-catalog.json'
      - 'assets/js/offline-*.js'
      - 'assets/js/fun-age-experience-v1.js'
      - 'assets/css/fun-age-experience-v1.css'
      - 'assets/js/home-showcase-v31.js'
      - 'assets/css/fun-category-tabs-v1.css'
      - 'assets/covers/reels-age-*'
      - 'assets/covers/fun-entry-*'
      - 'tooling/test-fun-age-browser.cjs'
      - '.github/workflows/validate-fun-games.yml'
  pull_request:
    paths:
      - 'apps/1-4/balloon-garden/**'
      - 'apps/1-4/tic-tac-toe/**'
      - 'apps/1-4/lines-and-houses/**'
      - 'apps/1-4/wonder-machine/**'
      - 'apps/1-4/fun-bowling/**'
      - 'apps/1-4/little-car-race/**'
      - 'apps/1-4/toy-city-crane/**'
      - 'tooling/*offline.cjs'
      - 'tooling/lib/build-fun-offline.cjs'
      - 'tooling/test-helpers/**'
      - 'data/catalog.json'
      - 'data/offline/**'
      - 'data/offline-catalog.json'
      - 'assets/js/offline-*.js'
      - 'assets/js/fun-age-experience-v1.js'
      - 'assets/css/fun-age-experience-v1.css'
      - 'assets/js/home-showcase-v31.js'
      - 'assets/css/fun-category-tabs-v1.css'
      - 'assets/covers/reels-age-*'
      - 'assets/covers/fun-entry-*'
      - 'tooling/test-fun-age-browser.cjs'
      - '.github/workflows/validate-fun-games.yml'
permissions:
  contents: read
jobs:
  fun-games:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test apps/1-4/balloon-garden/tests/*.test.cjs apps/1-4/tic-tac-toe/tests/*.test.cjs apps/1-4/lines-and-houses/tests/*.test.cjs apps/1-4/wonder-machine/tests/*.test.cjs apps/1-4/fun-bowling/tests/*.test.cjs apps/1-4/little-car-race/tests/*.test.cjs apps/1-4/toy-city-crane/tests/*.test.cjs
      - run: node tooling/test-legacy-touch-guard.js
  balloon-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated farm QA tools
        run: npm install --prefix /tmp/balloon-browser-qa --no-audit --no-fund playwright@1.62.1 acorn@8 jsdom@26
      - name: Verify localized discoveries, opt-in sentences and milestone praise
        run: NODE_PATH=/tmp/balloon-browser-qa/node_modules node --test apps/1-4/balloon-garden/tests/language-runtime.cjs
      - name: Test both ages, six screens, gifts, identity and real offline play
        run: |
          browser_path=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          APP360_TEST_CHROMIUM="$browser_path" NODE_PATH=/tmp/balloon-browser-qa/node_modules node apps/1-4/balloon-garden/tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balloon-farm-browser-screenshots
          path: /tmp/balloon-screenshots
  race-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser QA tools
        run: npm install --prefix /tmp/race-browser-qa --no-audit --no-fund playwright@1.62.1 acorn@8
      - name: Test rally on six viewports and actual offline play
        run: |
          browser_path=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          APP360_TEST_CHROMIUM="$browser_path" NODE_PATH=/tmp/race-browser-qa/node_modules node apps/1-4/little-car-race/tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: little-car-race-browser-screenshots
          path: /tmp/race-screenshots
  crane-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser QA tools
        run: npm install --prefix /tmp/crane-browser-qa --no-audit --no-fund playwright@1.62.1 acorn@8
      - name: Test crane on six viewports and actual offline play
        run: |
          browser_path=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          APP360_TEST_CHROMIUM="$browser_path" NODE_PATH=/tmp/crane-browser-qa/node_modules node apps/1-4/toy-city-crane/tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toy-city-crane-browser-screenshots
          path: /tmp/crane-screenshots

  age-art-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser QA tools
        run: npm install --prefix /tmp/age-browser-qa --no-audit --no-fund playwright@1.62.1 acorn@8 jsdom@26
      - name: Verify coach controls and exact guardian labels
        run: APP360_TEST_MODULES=/tmp/age-browser-qa/node_modules node --test tooling/test-adult-only.cjs
      - name: Test both ages, all seven games, layouts, restored saves and Reels covers
        run: |
          browser_path=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          APP360_TEST_CHROMIUM="$browser_path" NODE_PATH=/tmp/age-browser-qa/node_modules node tooling/test-fun-age-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fun-age-art-screenshots
          path: /tmp/fun-age-screenshots
