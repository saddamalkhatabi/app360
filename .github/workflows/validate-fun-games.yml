name: Validate Fun games
on:
  push:
    branches: [main]
    paths:
      - 'apps/1-4/balloon-garden/**'
      - 'apps/1-4/tic-tac-toe/**'
      - 'apps/1-4/lines-and-houses/**'
      - 'apps/1-4/wonder-machine/**'
      - 'apps/1-4/fun-bowling/**'
      - 'apps/1-4/mini-golf/**'
      - 'tooling/*offline.cjs'
      - 'tooling/lib/build-fun-offline.cjs'
      - 'tooling/test-helpers/**'
      - 'data/catalog.json'
      - 'data/offline/**'
      - 'data/offline-catalog.json'
      - 'assets/js/offline-*.js'
      - '.github/workflows/validate-fun-games.yml'
  pull_request:
    paths:
      - 'apps/1-4/balloon-garden/**'
      - 'apps/1-4/tic-tac-toe/**'
      - 'apps/1-4/lines-and-houses/**'
      - 'apps/1-4/wonder-machine/**'
      - 'apps/1-4/fun-bowling/**'
      - 'apps/1-4/mini-golf/**'
      - 'tooling/*offline.cjs'
      - 'tooling/lib/build-fun-offline.cjs'
      - 'tooling/test-helpers/**'
      - 'data/catalog.json'
      - 'data/offline/**'
      - 'data/offline-catalog.json'
      - 'assets/js/offline-*.js'
      - '.github/workflows/validate-fun-games.yml'
permissions:
  contents: read
jobs:
  fun-games:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test apps/1-4/balloon-garden/tests/*.test.cjs apps/1-4/tic-tac-toe/tests/*.test.cjs apps/1-4/lines-and-houses/tests/*.test.cjs apps/1-4/wonder-machine/tests/*.test.cjs apps/1-4/fun-bowling/tests/*.test.cjs apps/1-4/mini-golf/tests/*.test.cjs
      - run: node tooling/test-legacy-touch-guard.js
  golf-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser QA tools
        run: |
          npm install --prefix /tmp/golf-browser-qa --no-audit --no-fund playwright@1.62.1
      - name: Test six screen sizes, full rounds and actual offline play
        run: |
          browser_path=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          APP360_TEST_CHROMIUM="$browser_path" NODE_PATH=/tmp/golf-browser-qa/node_modules node apps/1-4/mini-golf/tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mini-golf-browser-screenshots
          path: /tmp/golf-screenshots
