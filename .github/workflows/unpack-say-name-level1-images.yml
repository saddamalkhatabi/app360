name: Unpack Say and Name Level 1 Images

on:
  push:
    branches: [main]
    paths:
      - apps/1-4/say-and-name/assets/level1/upload-ready.txt
      - apps/1-4/say-and-name/assets/level1/level1-100-designed-webp.zip
      - .github/workflows/unpack-say-name-level1-images.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: say-name-level1-images
  cancel-in-progress: true

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct, validate and unpack image bundle
        shell: bash
        run: |
          set -euo pipefail
          ROOT="apps/1-4/say-and-name"
          ZIP="$ROOT/assets/level1/level1-100-designed-webp.zip"
          PARTS="$ROOT/assets/level1/upload-parts-v2"
          OLD_PARTS="$ROOT/assets/level1/upload-parts"
          READY="$ROOT/assets/level1/upload-ready.txt"
          OUT="$ROOT/assets/level1/designed-100"
          TMP="$(mktemp -d)"
          EXPECTED_SHA="2480cdccb7d8a95363f2f2e50f278c83d5482fd53cd2aa72cc942ec8fd3b1239"

          if [ ! -f "$ZIP" ] && [ -f "$READY" ]; then
            test -d "$PARTS"
            COUNT_PARTS="$(find "$PARTS" -maxdepth 1 -type f -name 'part-*.b64' | wc -l | tr -d ' ')"
            test "$COUNT_PARTS" = "36"
            cat "$PARTS"/part-*.b64 | base64 -d > "$ZIP"
          fi

          if [ ! -f "$ZIP" ]; then
            echo "Image bundle not present yet; nothing to unpack."
            exit 0
          fi

          ACTUAL_SHA="$(sha256sum "$ZIP" | awk '{print $1}')"
          echo "Bundle SHA256: $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

          unzip -q "$ZIP" -d "$TMP"
          test -d "$TMP/images"
          COUNT="$(find "$TMP/images" -maxdepth 1 -type f -name '*.webp' | wc -l | tr -d ' ')"
          test "$COUNT" = "100"
          test -f "$TMP/manifest.json"

          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp "$TMP"/images/*.webp "$OUT"/
          cp "$TMP/manifest.json" "$OUT/manifest.json"

          python - <<'PY'
          from pathlib import Path
          import json, re
          root=Path('apps/1-4/say-and-name')
          out=root/'assets/level1/designed-100'
          manifest=json.loads((out/'manifest.json').read_text(encoding='utf-8'))
          images=sorted(out.glob('*.webp'))
          assert len(images)==100, len(images)
          names={p.name for p in images}
          assert isinstance(manifest,dict) and len(manifest)==100, len(manifest)
          listed={entry['file'] for entry in manifest.values()}
          assert names==listed, (len(names),len(listed),sorted(names-listed)[:5],sorted(listed-names)[:5])
          map_text=(root/'data/level1-designed-map.js').read_text(encoding='utf-8')
          mapped=set(re.findall(r':"([^"]+\.webp)"',map_text))
          assert mapped==names, (len(mapped),len(names),sorted(mapped-names)[:5],sorted(names-mapped)[:5])
          print('Verified designed images:',len(images))
          PY

          rm -f "$ZIP" "$READY"
          rm -rf "$PARTS" "$OLD_PARTS"

      - name: Commit extracted images
        shell: bash
        run: |
          set -euo pipefail
          ROOT="apps/1-4/say-and-name"
          OUT="$ROOT/assets/level1/designed-100"
          ZIP="$ROOT/assets/level1/level1-100-designed-webp.zip"
          PARTS="$ROOT/assets/level1/upload-parts-v2"
          OLD_PARTS="$ROOT/assets/level1/upload-parts"
          READY="$ROOT/assets/level1/upload-ready.txt"
          if [ ! -d "$OUT" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git add -A "$ZIP" "$PARTS" "$OLD_PARTS" "$READY" || true
          if git diff --cached --quiet; then
            echo "Designed images are already up to date."
            exit 0
          fi
          git commit -m "Unpack designed level 1 image library"
          git pull --rebase origin main
          git push origin HEAD:main
