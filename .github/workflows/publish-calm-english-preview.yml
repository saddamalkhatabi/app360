name: Publish Completed Calm English MP3 Preview
on:
  push:
    branches: [feature/age1-4-silma-calm-serial-20261009]
    paths:
      - .github/workflows/publish-calm-english-preview.yml
permissions:
  contents: write
  actions: read
jobs:
  publish-english:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/age1-4-silma-calm-serial-20261009
          fetch-depth: 0
      - name: Import actual English voice MP3s already recorded by successful jobs
        uses: actions/download-artifact@v4
        with:
          run-id: 37974458126
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: calm-en-recordings-*
          merge-multiple: true
          path: apps/1-4/calm-with-me/audio/bilingual/en/
      - name: Install MP3 decoding verification tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Verify and index the actual persisted recordings
        run: |
          node apps/1-4/calm-with-me/tools/finalize-bilingual-audio.cjs
          node apps/1-4/calm-with-me/tools/test-bilingual-voice.cjs
      - name: Save English MP3 and bilingual map solely in experimental branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/1-4/calm-with-me/audio/bilingual
          git commit -m "Publish recorded English child-directed MP3 preview, pending listening approval"
          git pull --rebase origin feature/age1-4-silma-calm-serial-20261009
          git push origin HEAD:feature/age1-4-silma-calm-serial-20261009
