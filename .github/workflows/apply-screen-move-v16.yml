name: Screen-to-move v16 mobile touch and multi-selection

on:
  push:
    paths:
      - '.github/workflows/apply-screen-move-v16.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Repair flexible function matcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tooling/apply-screen-move-v16.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace(r"\}\n(?=function ",r"\}\s*(?=function ")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Apply v16 upgrade
        run: python3 tooling/apply-screen-move-v16.py
      - name: Refresh historical regression ranges
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/1-4/screen-to-move/app.test.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('1[012345]','1[0123456]')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Regenerate platform planning documents
        run: node tooling/build-blueprints.js
      - name: Validate platform and application
        run: |
          node tooling/validate-platform.js
          pnpm --filter @app360/app-screen-to-move validate
          git diff --check
      - name: Commit v16 and remove temporary tooling
        run: |
          git config user.name "app360-bot"
          git config user.email "app360-bot@users.noreply.github.com"
          git rm -f tooling/apply-screen-move-v16.py .github/workflows/apply-screen-move-v16.yml
          git add -A
          git commit -m "Improve mobile designer touch multiselect and library cards v16"
          git push origin HEAD:main
