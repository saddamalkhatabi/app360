name: Screen-to-move v14 responsive touch and work safety

on:
  push:
    paths:
      - '.github/workflows/apply-screen-move-v14.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply v14 fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tooling/apply-screen-move-v14.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("assert.doesNotMatch(js,/=>|\\\\bconst\\\\b|\\\\blet\\\\b|`/);","assert.doesNotMatch(js,/=>|\\\\bconst\\\\b|\\\\blet\\\\b/);")
          p.write_text(s,encoding='utf-8')
          PY
          node tooling/apply-screen-move-v14.js
      - name: Regenerate platform planning documents
        run: node tooling/build-blueprints.js
      - name: Validate platform and application
        run: |
          node tooling/validate-platform.js
          pnpm --filter @app360/app-screen-to-move validate
          git diff --check
      - name: Commit v14 and remove temporary tooling
        run: |
          git config user.name "app360-bot"
          git config user.email "app360-bot@users.noreply.github.com"
          git rm -f tooling/apply-screen-move-v14.js .github/workflows/apply-screen-move-v14.yml
          git add -A
          git commit -m "Fix desktop layout touch drag and designer work safety v14"
          git push origin HEAD:main
