name: Add checkmark exercises v5

on:
  push:
    paths:
      - '.github/workflows/add-mark-check-exercises-v5.yml'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
