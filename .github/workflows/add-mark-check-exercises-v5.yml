name: Add checkmark exercises v5

on:
  push:
    paths:
      - '.github/workflows/add-mark-check-exercises-v5.yml'
      - 'tooling/apply-screen-mark-v5.py'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply v5 expansion
        run: python3 tooling/apply-screen-mark-v5.py
      - name: Regenerate planning documents
        run: node tooling/build-blueprints.js
      - name: Validate expansion
        run: |
          node tooling/validate-platform.js
          pnpm --filter @app360/app-screen-to-move validate
          git diff --check
      - name: Commit v5 and remove one-time tooling
        run: |
          git config user.name "app360-bot"
          git config user.email "app360-bot@users.noreply.github.com"
          git rm .github/workflows/add-mark-check-exercises-v5.yml tooling/apply-screen-mark-v5.py
          git add -A
          git commit -m "Add 20 checkmark discrimination exercises"
          git push origin HEAD:main
