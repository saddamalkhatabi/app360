          mark_fn=r'''function buildMark(box,g){var source=g.markOptions||[],opts=shuffle(source.map(function(x,i){return{v:x[0],ok:!!x[1],i:i}})),h='<div class="mark-board level-'+g.level+'"><h3>'+esc(g.prompt||'ضع علامة صح على الخيارات المناسبة')+'</h3><p class="mark-help">المس الخيارات المناسبة لوضع ✓، ثم اضغط «تحقق من العلامات». يمكنك اختيار أكثر من إجابة.</p><div class="mark-grid">';for(var i=0;i<opts.length;i++)h+='<button class="mark-option" data-mark="'+i+'" data-correct="'+(opts[i].ok?'1':'0')+'"><span class="mark-box">□</span><span class="mark-value">'+esc(opts[i].v)+'</span></button>';h+='</div><div class="action-row mark-actions"><button class="btn primary" id="checkMarks">✓ تحقق من العلامات</button><button class="btn" id="clearMarks">مسح العلامات الحالية</button></div><p id="challengeMsg" class="challenge-msg">اختر كل ما يطابق القاعدة؛ قد توجد عدة إجابات صحيحة.</p></div>';box.innerHTML=h;function hasClass(n,c){return(' '+n.className+' ').indexOf(' '+c+' ')>=0}arr(box.querySelectorAll('.mark-option')).forEach(function(b){b.onclick=function(){if(this.disabled||hasClass(this,'checked'))return;var mark=this.querySelector('.mark-box');if(hasClass(this,'selected')||hasClass(this,'wrong')){this.className='mark-option';if(mark)mark.textContent='□'}else{this.className='mark-option selected';if(mark)mark.textContent='✓'}}});el('checkMarks').onclick=function(){var bs=arr(box.querySelectorAll('.mark-option')),found=0,total=state.round?state.round.target:0;for(var i=0;i<bs.length;i++){var b=bs[i],sel=hasClass(b,'selected'),ok=b.getAttribute('data-correct')==='1',mark=b.querySelector('.mark-box');if(b.getAttribute('data-scored')==='1'){found++;continue}if(sel&&ok){b.className='mark-option checked';b.disabled=true;b.setAttribute('data-scored','1');if(mark)mark.textContent='✓';found++;scoreAttempt(true)}else if(sel&&!ok){b.className='mark-option wrong';if(mark)mark.textContent='✕';if(b.getAttribute('data-wrong-scored')!=='1'){b.setAttribute('data-wrong-scored','1');scoreAttempt(false,false)}}}if(found>=total){el('challengeMsg').textContent='أحسنت! تم تمييز كل الخيارات المطلوبة ✓'}else el('challengeMsg').textContent='وجدت '+found+' من '+total+' إجابات صحيحة. ابحث عن البقية.'};el('clearMarks').onclick=function(){arr(box.querySelectorAll('.mark-option')).forEach(function(b){if(b.disabled)return;b.className='mark-option';b.removeAttribute('data-wrong-scored');var m=b.querySelector('.mark-box');if(m)m.textContent='□'});el('challengeMsg').textContent='تم مسح العلامات غير المثبتة؛ ابدأ من جديد.'}}
'''
