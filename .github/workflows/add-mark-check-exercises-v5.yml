          {"id":"G86","level":4,"title":"ضع صح على الكائنات الحية","topic":"الكائن الحي وغير الحي","type":"mark","icon":"🌱","symbols":["🐱","🪨","🌳","🚗"],"materials":["ورقة العمل","صور متنوعة"],"prompt":"ضع علامة ✓ على كل كائن حي","markOptions":[["🐱",true],["🪨",false],["🌳",true],["🚗",false],["🐦",true],["📘",false],["🌸",true],["🪑",false],["🐟",true],["⚽",false],["🌱",true],["📱",false],["🐝",true],["🧸",false],["🌴",true],["🔑",false]],"frames":["شاهد أشياء وكائنات كثيرة","فكر ما الذي ينمو أو يعيش","ضع صح على الكائن الحي","راجع سبب اختيارين","ابحث عن مثال حي حولك"]},
