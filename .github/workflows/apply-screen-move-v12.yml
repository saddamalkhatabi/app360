name: Screen-to-move v12 game expansion

on:
  push:
    paths:
      - '.github/workflows/apply-screen-move-v12.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply v12 expansion
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const p='apps/1-4/screen-to-move/';
          const base=require('./'+p+'games-data.js');
          const extra=require('./'+p+'games-data-v12.js');
          const seen=new Set(base.map(g=>g.title));
          const changed=[];
          for(const g of extra){
            const original=g.title;
            if(seen.has(g.title))g.title=g.title+' — تحدي المستوى '+g.level;
            if(seen.has(g.title))g.title=g.title+' '+g.id;
            if(g.title!==original)changed.push(original+' -> '+g.title);
            seen.add(g.title);
          }
          const out="(function(root,factory){var data=factory();if(typeof module==='object'&&module.exports){module.exports=data;}else{root.A1ScreenMoveGamesV12=data;}})(this,function(){return "+JSON.stringify(extra)+";});\n";
          fs.writeFileSync(p+'games-data-v12.js',out);
          console.log('Disambiguated titles:',changed.length,changed.join(' | '));
          NODE
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tooling/apply-screen-move-v12.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("assert.doesNotMatch(js,/=>|\\\\bconst\\\\b|\\\\blet\\\\b|`/);","assert.doesNotMatch(js,/=>|\\\\bconst\\\\b|\\\\blet\\\\b|\\\\x60/);")
          p.write_text(s,encoding='utf-8')
          PY
          node tooling/apply-screen-move-v12.js
      - name: Regenerate platform planning documents
        run: node tooling/build-blueprints.js
      - name: Validate platform and application
        run: |
          node tooling/validate-platform.js
          pnpm --filter @app360/app-screen-to-move validate
          git diff --check
      - name: Commit v12 and remove temporary tooling
        run: |
          git config user.name "app360-bot"
          git config user.email "app360-bot@users.noreply.github.com"
          git rm -f tooling/apply-screen-move-v12.js .github/workflows/apply-screen-move-v12.yml
          git add -A
          git commit -m "Add 80 progressive games and legacy-safe covers v12"
          git push origin HEAD:main
