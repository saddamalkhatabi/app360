name: Restore cooperative preview assets and test
on:
  push:
    branches: [preview/cooperate-60-bilingual-20261020]
    paths: [apps/4-8/cooperative-play-lab/data/restore-assets.request]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/cooperate-60-bilingual-20261020
      - name: Restore verified image and recording bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import urllib.request,json,base64,hashlib,zipfile,io,pathlib
          for sha in ['7142eb0c801a518b519988479ccec8c2af327232','09bc3c032dd9c7d137bd0552db0da39204eebf65','82f0fe682a9b234afd97576f4f8c37411168a759','ac2858546ab252adea71fcbd428a0332c5a98d93','6cb410615488f1b5d389569877938f15f8d675ee']:
              import os
              request=urllib.request.Request('https://api.github.com/repos/saddamalkhatabi/app360/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=120) as response: payload=json.load(response)
              data=base64.b64decode(payload['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  assert archive.testzip() is None
                  for entry in archive.infolist():
                      target=pathlib.PurePosixPath(entry.filename)
                      assert not target.is_absolute() and '..' not in target.parts
                      assert entry.filename.startswith(('apps/4-8/cooperative-play-lab/audio/','apps/4-8/cooperative-play-lab/assets/'))
                      assert not entry.is_dir()
                      archive.extract(entry,'.')
              print('Verified and restored bundle',sha)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python3 apps/4-8/cooperative-play-lab/tools/build-release.py --draft
      - run: node --test apps/4-8/cooperative-play-lab/test/*.test.cjs
      - name: Save restored preview assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/4-8/cooperative-play-lab/
          git commit -m 'Restore optimized assets and 430 English recordings for 60-case preview'
          git push origin HEAD:preview/cooperate-60-bilingual-20261020
      - name: Install Chromium checks
        run: npm install --no-save --ignore-scripts --workspaces=false playwright && npx playwright install --with-deps chromium
      - name: Verify bilingual interface
        run: |
          node apps/4-8/cooperative-play-lab/test/browser.cjs
          node apps/4-8/cooperative-play-lab/test/bilingual.cjs
          COOPERATE_DRAFT=1 node apps/4-8/cooperative-play-lab/test/offline.cjs
