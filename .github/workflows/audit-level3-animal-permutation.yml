name: Audit Level 3 Animal Permutation

on:
  push:
    branches:
      - fix/say-name-image-semantic-mapping-v24
    paths:
      - apps/1-4/say-and-name/tools/audit_level3_animal_permutation.py
      - .github/workflows/audit-level3-animal-permutation.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchvision==0.21.0
          python -m pip install transformers==4.49.0 scipy==1.15.2 pillow==11.1.0
      - name: Run focused L3 animal audit
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: python apps/1-4/say-and-name/tools/audit_level3_animal_permutation.py
      - name: Commit focused audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/1-4/say-and-name/data/level3-animal-permutation-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit level 3 animal image permutation"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
