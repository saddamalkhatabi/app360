name: Generate Say and Name English Content

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/generate-say-name-english.yml
      - apps/1-4/say-and-name/tools/generate_english_content.py
      - apps/1-4/say-and-name/tools/generate_english_content_v3.py
      - apps/1-4/say-and-name/data/levels-inline-v8.js

permissions:
  contents: write

concurrency:
  group: say-and-name-edge-english
  cancel-in-progress: true

jobs:
  generate-english:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install translation and Edge TTS tools
        run: python -m pip install --upgrade pip edge-tts==7.2.8 deep-translator==1.11.4

      - name: Verify preferred English voice exists
        run: |
          python - <<'PY'
          import asyncio, edge_tts
          async def main():
              voices = await edge_tts.list_voices()
              names = {v['ShortName'] for v in voices}
              assert 'en-US-JennyNeural' in names, 'preferred English voice missing'
              print('Using en-US-JennyNeural')
          asyncio.run(main())
          PY

      - name: Translate reviewed vocabulary and generate deduplicated English MP3 files
        run: >-
          python apps/1-4/say-and-name/tools/generate_english_content_v3.py
          --voice en-US-JennyNeural
          --rate=-8%
          --concurrency 4

      - name: Verify English labels, meanings and audio bundle
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          root = Path('apps/1-4/say-and-name')
          text = (root/'data/translations-en.js').read_text(encoding='utf-8').strip()
          marker = 'window.APP360_EN='
          assert text.startswith(marker) and text.endswith(';')
          data = json.loads(text[len(marker):-1])
          w = data['words']
          checks = {
              'الجسم\u0001ظهر':'Back',
              'الوقت\u0001ظهر':'Noon',
              'الجسم\u0001ساق':'Leg',
              'النباتات\u0001ساق':'Stem',
              'الحديقة\u0001ورقة':'Leaf',
              'أشياء يومية\u0001ورقة':'Paper',
              'المنزل\u0001أرض':'Floor',
              'السماء والفضاء\u0001أرض':'Earth',
              'الألعاب\u0001كرة':'Ball',
              'الرياضيات والأشكال\u0001كرة':'Sphere',
              'المدرسة\u0001فصل':'Classroom',
              'الأسرة والأشخاص\u0001خال':'Uncle',
              'الأسرة والأشخاص\u0001ابنة':'Daughter',
              'الجسم\u0001حاجب':'Eyebrow',
              'الجسم\u0001خد':'Cheek',
              'الجسم\u0001ذقن':'Chin',
              'الجسم\u0001رقبة':'Neck',
              'الجسم\u0001كتف':'Shoulder',
              'الجسم\u0001ذراع':'Arm',
              'الجسم\u0001كوع':'Elbow',
              'الجسم\u0001معصم':'Wrist',
              'الجسم\u0001صدر':'Chest',
              'الجسم\u0001ركبة':'Knee',
              'الجسم\u0001كعب':'Heel',
              'الجسم\u0001أظافر':'Nails',
              'الحواس\u0001نظر':'Sight',
              'الحواس\u0001سمع':'Hearing',
              'الحواس\u0001شم':'Smell',
              'الحواس\u0001تذوق':'Taste',
              'الحواس\u0001لمس':'Touch',
              'المهن\u0001عالم':'Scientist',
              'التكنولوجيا\u0001فأرة':'Mouse',
              'أجزاء الحيوان\u0001قرن':'Horn',
              'الأشكال\u0001معين':'Diamond'
          }
          for key, expected in checks.items():
              assert w.get(key) == expected, (key, w.get(key), expected)
          assert len(w) >= 1190, len(w)
          assert len(data['categories']) >= 100, len(data['categories'])
          assert not any(re.search(r'[\u0600-\u06FF]', value) for value in w.values())
          suspicious = []
          banned_exact = {'Clear','Here','Deaf','Like a','A needle','Kneel','Son'}
          for key, value in w.items():
              if value in banned_exact:
                  suspicious.append((key,value))
              if not value.strip() or len(value) > 55:
                  suspicious.append((key,value))
          assert not suspicious, suspicious[:20]
          audio_text = (root/'data/audio-map-en.js').read_text(encoding='utf-8').strip()
          amarker = 'window.APP360_AUDIO_MAP_EN='
          assert audio_text.startswith(amarker) and audio_text.endswith(';')
          audio = json.loads(audio_text[len(amarker):-1])
          assert len(audio) > 800, len(audio)
          missing=[]
          for term, rel in audio.items():
              p=root/rel
              if not p.exists() or p.stat().st_size<=900:
                  missing.append((term,rel))
          assert not missing, missing[:10]
          manifest=json.loads((root/'audio/edge-en-manifest.json').read_text(encoding='utf-8'))
          assert manifest['mapped_files']==len(audio)
          assert manifest['voice']=='en-US-JennyNeural'
          assert manifest['rate']=='-8%'
          print('English context entries:',len(w))
          print('English categories:',len(data['categories']))
          print('Unique English MP3 files:',len(audio))
          print('Voice:',manifest['voice'])
          PY

      - name: Commit reviewed English vocabulary and audio bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/1-4/say-and-name/data/translations-en.json \
                  apps/1-4/say-and-name/data/translations-en.js \
                  apps/1-4/say-and-name/data/audio-map-en.js \
                  apps/1-4/say-and-name/audio/edge-en \
                  apps/1-4/say-and-name/audio/edge-en-manifest.json
          if git diff --cached --quiet; then
            echo "No new English content to commit."
            exit 0
          fi
          git commit -m "Regenerate reviewed English vocabulary and audio"
          git pull --rebase origin main
          git push origin HEAD:main
