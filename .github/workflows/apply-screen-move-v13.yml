name: Screen-to-move v13 legacy tablet fixes

on:
  push:
    paths:
      - '.github/workflows/apply-screen-move-v13.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply v13 legacy tablet fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tooling/apply-screen-move-v13.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("let meta=JSON.parse(read(ap('app.json'));", "let meta=JSON.parse(read(ap('app.json')));")
          p.write_text(s,encoding='utf-8')
          PY
          node tooling/apply-screen-move-v13.js
          python3 - <<'PY'
          from pathlib import Path
          app=Path('apps/1-4/screen-to-move')
          # Normalize accidental double question marks produced by the temporary version migrator.
          for name in ['index.html','sw.js']:
              p=app/name
              s=p.read_text(encoding='utf-8').replace('??v=13','?v=13')
              p.write_text(s,encoding='utf-8')
          # Ensure v13 runtime assets are explicitly linked and cached after normalization.
          p=app/'index.html'; s=p.read_text(encoding='utf-8')
          if 'v13.css?v=13' not in s:
              s=s.replace('<link rel="stylesheet" href="v10.css?v=13">','<link rel="stylesheet" href="v10.css?v=13">\n<link rel="stylesheet" href="v13.css?v=13">')
          if 'legacy-v13.js?v=13' not in s:
              s=s.replace('</body>','<script src="legacy-v13.js?v=13"></script>\n</body>')
          p.write_text(s,encoding='utf-8')
          p=app/'sw.js'; s=p.read_text(encoding='utf-8')
          if "'./v13.css?v=13'" not in s:
              s=s.replace("'./v10.css?v=13'","'./v10.css?v=13','./v13.css?v=13','./legacy-v13.js?v=13'")
          p.write_text(s,encoding='utf-8')
          # Historical regression tests should accept the current cache/runtime version.
          p=app/'app.test.js'; s=p.read_text(encoding='utf-8')
          s=s.replace('screen-to-move-v1[012]', 'screen-to-move-v1[0123]')
          s=s.replace('?v=1[012]', '?v=1[0123]')
          s=s.replace("games-data-v12.js?v=12", "games-data-v12.js?v=13")
          s=s.replace("app.js?v=12", "app.js?v=13")
          s=s.replace("designer-assets-v12.js?v=12", "designer-assets-v12.js?v=13")
          s=s.replace("designer-v9.js?v=12", "designer-v9.js?v=13")
          s=s.replace(r'games-data-v12\.js\?v=12', r'games-data-v12\.js\?v=13')
          s=s.replace(r'designer-assets-v12\.js\?v=12', r'designer-assets-v12\.js\?v=13')
          s=s.replace(r'designer-v10\.js\?v=1[012]', r'designer-v10\.js\?v=1[0123]')
          s=s.replace(r'game-designer-v10\.js\?v=1[012]', r'game-designer-v10\.js\?v=1[0123]')
          s=s.replace(r'v10\.css\?v=1[012]', r'v10\.css\?v=1[0123]')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Regenerate platform planning documents
        run: node tooling/build-blueprints.js
      - name: Validate platform and application
        run: |
          node tooling/validate-platform.js
          pnpm --filter @app360/app-screen-to-move validate
          git diff --check
      - name: Commit v13 and remove temporary tooling
        run: |
          git config user.name "app360-bot"
          git config user.email "app360-bot@users.noreply.github.com"
          git rm -f tooling/apply-screen-move-v13.js .github/workflows/apply-screen-move-v13.yml
          git add -A
          git commit -m "Fix legacy tablet overlays visuals and landscape layout v13"
          git push origin HEAD:main
