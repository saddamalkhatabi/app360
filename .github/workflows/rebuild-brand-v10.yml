name: Rebuild App360 Brand V10

on:
  push:
    branches:
      - brand-v10-stop
    paths:
      - 'assets/brand/v10parts/READY'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brand-v10-stop
      - name: Decode optimized approved logo
        shell: bash
        run: |
          set -euo pipefail
          cat assets/brand/v10parts/part-* | base64 -d > assets/brand/app360-lab-logo-v10.webp
          test -s assets/brand/app360-lab-logo-v10.webp
          file assets/brand/app360-lab-logo-v10.webp
      - name: Commit decoded logo and remove transport parts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/brand/app360-lab-logo-v10.webp
          git rm -r assets/brand/v10parts
          git commit -m 'Add optimized exact v10 portal logo' || exit 0
          git push origin HEAD:brand-v10-stop
