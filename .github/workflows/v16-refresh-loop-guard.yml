name: V16 Refresh Loop Guard

on:
  push:
    paths:
      - '.github/workflows/v16-refresh-loop-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch refresh guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,re

          p=Path('1-4/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('لوحة الطفل - امسك القلم وارسم v15','لوحة الطفل - امسك القلم وارسم v16')
          # Replace the whole force-update block with a one-refresh-only, upgrade-only guard.
          pat=r'<script id="forceUpdateV13">.*?</script>'
          repl='''<script id="forceUpdateV16">(function(){var LOCAL=16;try{var x=new XMLHttpRequest();x.open('GET','version.json?_='+(+new Date()),true);x.onreadystatechange=function(){if(x.readyState!==4||x.status<200||x.status>=300)return;try{var j=JSON.parse(x.responseText),b=parseInt(j.build,10)||LOCAL,m=/[?&]v=(\\d+)/.exec(location.search||''),q=m?parseInt(m[1],10):0;if(b>LOCAL&&q!==b){try{if(window.caches)caches.keys().then(function(ks){for(var i=0;i<ks.length;i++)caches.delete(ks[i])})}catch(e){}try{if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration)navigator.serviceWorker.getRegistration().then(function(r){if(r)r.update()})}catch(e){}var base=location.href.split('?')[0].split('#')[0];location.replace(base+'?v='+b+'&refresh='+(+new Date()))}}catch(e){}};x.send(null)}catch(e){}})();</script>'''
          s2,n=re.subn(pat,repl,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('force update block not found')
          s=s2.replace('audio-v15.js?v=15','audio-v15.js?v=16')
          p.write_text(s,encoding='utf-8')

          Path('1-4/version.json').write_text(json.dumps({
            'build':16,
            'updated':'2026-09-11',
            'audioPack':'noor+colors-v15-legacy-multiformat',
            'legacyAudio':['mp3','ogg','wav'],
            'refreshPolicy':'upgrade-only, one automatic refresh per target build'
          },ensure_ascii=False,indent=2),encoding='utf-8')

          sw=Path('1-4/sw.js')
          t=sw.read_text(encoding='utf-8')
          t=t.replace("var CACHE='app360-1-4-v15'","var CACHE='app360-1-4-v16'")
          t=t.replace("'./audio-v15.js?v=15'","'./audio-v15.js?v=16'")
          sw.write_text(t,encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'forceUpdateV16' 1-4/index.html
          grep -q 'b>LOCAL&&q!==b' 1-4/index.html
          grep -q 'app360-1-4-v16' 1-4/sw.js
          python - <<'PY'
          import json
          assert json.load(open('1-4/version.json',encoding='utf-8'))['build']==16
          print('V16 refresh loop guard OK')
          PY
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 1-4/index.html 1-4/version.json 1-4/sw.js
          git commit -m "Fix forced refresh loop in V16"
          git push
