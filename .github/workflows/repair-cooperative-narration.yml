name: Repair selected cooperative narration
on:
  push:
    branches: [fix/cooperate-scenes-navigation-20261020]
    paths: [apps/4-8/cooperative-play-lab/data/narration-repair.json]
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        part: [0, 1, 2, 3, 4]
    env:
      HF_HOME: /tmp/silma-hf
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install recording and alignment tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libavcodec-dev libavformat-dev libavutil-dev
          python -m pip install --no-cache-dir torch==2.6.0+cpu torchaudio==2.6.0+cpu torchvision==0.21.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir torchcodec==0.2.1 --index-url https://download.pytorch.org/whl/cpu
          printf 'torch==2.6.0+cpu\ntorchaudio==2.6.0+cpu\ntorchvision==0.21.0+cpu\ntorchcodec==0.2.1\ntransformers==4.51.3\nhuggingface-hub==0.36.0\n' >/tmp/silma-constraints.txt
          python -m pip install --no-cache-dir -c /tmp/silma-constraints.txt --extra-index-url https://download.pytorch.org/whl/cpu silma-tts==1.0.5 uroman huggingface-hub faster-whisper
      - name: Download publisher models
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          import os,pathlib
          snapshot_download(repo_id='silma-ai/silma-tts',revision='226dd7a65cadf51f9a6dbe3953fc89003b3844d5',allow_patterns=['*.pt','*.safetensors','*.json','*.txt','*.yaml','*.wav','*.model'])
          snapshot_download(repo_id='charactr/vocos-mel-24khz')
          p=pathlib.Path(os.environ['HF_HOME'])/'hub/models--silma-ai--silma-tts/refs/main';p.parent.mkdir(parents=True,exist_ok=True);p.write_text('226dd7a65cadf51f9a6dbe3953fc89003b3844d5')
          PY
      - name: Prepare one exact utterance
        run: |
          python - <<'PYCODE'
          import json,pathlib
          r=pathlib.Path('apps/4-8/cooperative-play-lab')
          items=json.loads((r/'data/narration-repair.json').read_text())['items']
          (r/'data/narration-shard.json').write_text(json.dumps({'items':[items[${{ matrix.part }}]]},ensure_ascii=False))
          PYCODE
      - name: Generate with native CPU precision
        run: >-
          python tooling/build-silma-audio.py --root apps/4-8/cooperative-play-lab
          --cache /tmp/cooperate-repair --model-cache /tmp/silma-hf/hub
          --manifest data/narration-shard.json --generate-only --memory-map-weights
          --precision fp32 --seed 363 --nfe-step 24 --speed .9
      - name: Measure acoustic word boundaries
        run: >-
          python tooling/build-silma-audio.py --root apps/4-8/cooperative-play-lab
          --cache /tmp/cooperate-repair --model-cache /tmp/silma-hf/hub
          --manifest data/narration-shard.json --align-only
          --cues data/narration-shard-cues.json --report data/narration-shard-report.json
      - name: Package each recording before review
        run: |
          python - <<'PYCODE'
          import json,pathlib,shutil
          r=pathlib.Path('apps/4-8/cooperative-play-lab');out=pathlib.Path('/tmp/repair-shard')
          for i in json.loads((r/'data/narration-shard.json').read_text())['items']:
           target=out/i['path'];target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(r/i['path'],target)
          for src,folder in [('narration-shard-cues.json','cues'),('narration-shard-report.json','reports')]:
           p=out/folder/'part-${{ matrix.part }}.json';p.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(r/'data'/src,p)
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: cooperative-voice-fix-${{ matrix.part }}
          path: /tmp/repair-shard/
          if-no-files-found: error
          retention-days: 7
  review:
    needs: record
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cooperate-scenes-navigation-20261020
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-cache-dir faster-whisper
      - uses: actions/download-artifact@v4
        with:
          pattern: cooperative-voice-fix-*
          merge-multiple: true
          path: /tmp/repair-shards
      - name: Merge candidates while preserving old recordings for comparison
        run: |
          python - <<'PYCODE'
          import json,pathlib,shutil
          r=pathlib.Path('apps/4-8/cooperative-play-lab');out=pathlib.Path('/tmp/repair-shards');old=pathlib.Path('/tmp/old-cooperate-audio');old.mkdir()
          for item in json.loads((r/'data/narration-repair.json').read_text())['items']:
           path=item['path'];shutil.copyfile(r/path,old/pathlib.Path(path).name);shutil.copyfile(out/path,r/path)
          cues={};clips=[]
          for p in (out/'cues').glob('*.json'):cues.update(json.loads(p.read_text())['items'])
          for p in (out/'reports').glob('*.json'):clips.extend(json.loads(p.read_text())['clips'])
          (r/'data/narration-repair-cues.json').write_text(json.dumps({'items':cues},ensure_ascii=False))
          (r/'data/narration-repair-report.json').write_text(json.dumps({'engine':'silma-tts','precision':'CPU FP32','seed':363,'steps':24,'clips':clips},ensure_ascii=False,indent=2))
          PYCODE
      - name: Compare pronunciation and install improved clips
        run: python apps/4-8/cooperative-play-lab/tools/review-narration-repair.py
      - name: Publish reviewed recordings to the fix branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/4-8/cooperative-play-lab/audio/ apps/4-8/cooperative-play-lab/data/read-along-ar.json apps/4-8/cooperative-play-lab/data/narration-repair-*.json
          git commit -m 'Repair five selected SILMA utterances with measured timing and comparative pronunciation review'
          git push origin HEAD:fix/cooperate-scenes-navigation-20261020
