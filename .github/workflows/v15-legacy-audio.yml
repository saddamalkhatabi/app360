name: V15 Legacy Tablet Audio

on:
  push:
    paths:
      - '.github/workflows/v15-legacy-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg
          fi

      - name: Build old Android compatible audio formats
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p '1-4/audio/noor' '1-4/audio/colors'
          for src in 1-4/audio/نور/*.mp3; do
            [ -f "$src" ] || continue
            name="$(basename "$src" .mp3)"
            ffmpeg -y -loglevel error -i "$src" -ac 1 -ar 22050 -codec:a libmp3lame -b:a 64k "1-4/audio/noor/${name}.mp3"
            ffmpeg -y -loglevel error -i "$src" -ac 1 -ar 22050 -codec:a libvorbis -q:a 4 "1-4/audio/noor/${name}.ogg"
            ffmpeg -y -loglevel error -i "$src" -ac 1 -ar 22050 -codec:a pcm_s16le "1-4/audio/noor/${name}.wav"
          done
          for src in 1-4/audio/colors/*.mp3; do
            [ -f "$src" ] || continue
            name="$(basename "$src" .mp3)"
            ffmpeg -y -loglevel error -i "$src" -ac 1 -ar 22050 -codec:a libmp3lame -b:a 64k "1-4/audio/colors/${name}.legacy.mp3"
            mv "1-4/audio/colors/${name}.legacy.mp3" "1-4/audio/colors/${name}.mp3"
            ffmpeg -y -loglevel error -i "1-4/audio/colors/${name}.mp3" -ac 1 -ar 22050 -codec:a libvorbis -q:a 4 "1-4/audio/colors/${name}.ogg"
            ffmpeg -y -loglevel error -i "1-4/audio/colors/${name}.mp3" -ac 1 -ar 22050 -codec:a pcm_s16le "1-4/audio/colors/${name}.wav"
          done

      - name: Patch registry and app to V15
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          regp=Path('1-4/audio/registry.json')
          reg=json.loads(regp.read_text(encoding='utf-8'))
          reg['version']=15
          reg.setdefault('compatibility',{})
          reg['compatibility'].update({
            'legacy_android': True,
            'formats':['mp3','ogg','wav'],
            'ascii_paths': True,
            'strategy':'recorded-first on Android 4.x/old browsers; manual override always available'
          })
          u=reg.setdefault('users',{}).get('نور')
          if u:
            aliases=set(u.get('aliases') or [])
            aliases.update(['Noor','noor','Nour','nour','Nur','nur','Noour','noour'])
            u['aliases']=sorted(aliases)
            u['folder']='audio/نور'
            u['legacy_folder']='audio/noor'
            for c in u.get('clips',[]):
              cid=c['id']
              c['file']=f'audio/noor/{cid}.mp3'
              c['files']={
                'mp3':f'audio/noor/{cid}.mp3',
                'ogg':f'audio/noor/{cid}.ogg',
                'wav':f'audio/noor/{cid}.wav'
              }
          for c in reg.get('colors',[]):
            cid=c['id']
            c['file']=f'audio/colors/{cid}.mp3'
            c['files']={
              'mp3':f'audio/colors/{cid}.mp3',
              'ogg':f'audio/colors/{cid}.ogg',
              'wav':f'audio/colors/{cid}.wav'
            }
          regp.write_text(json.dumps(reg,ensure_ascii=False,indent=2),encoding='utf-8')

          p=Path('1-4/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('لوحة الطفل - امسك القلم وارسم v14','لوحة الطفل - امسك القلم وارسم v15')
          s=s.replace('var LOCAL=14','var LOCAL=15')
          s=s.replace('<script src="audio-v14.js?v=14"></script>','<script src="audio-v15.js?v=15"></script>')
          s=s.replace("speakSmart(colors[i].name,false)","speakSmart('اللون '+colors[i].name,true)")
          s=s.replace("speakSmart(colors[i].name,true)","speakSmart('اللون '+colors[i].name,true)")
          p.write_text(s,encoding='utf-8')

          Path('1-4/version.json').write_text(json.dumps({
            'build':15,
            'updated':'2026-09-11',
            'audioPack':'noor+colors-v15-legacy-multiformat',
            'legacyAudio':['mp3','ogg','wav']
          },ensure_ascii=False,indent=2),encoding='utf-8')

          sw=Path('1-4/sw.js')
          s=sw.read_text(encoding='utf-8')
          s=s.replace("var CACHE='app360-1-4-v14'","var CACHE='app360-1-4-v15'")
          s=s.replace("'./audio-v14.js?v=14'","'./audio-v15.js?v=15'")
          s=s.replace("u.indexOf('/1-4/audio-v14.js')>=0","u.indexOf('/1-4/audio-v15.js')>=0")
          sw.write_text(s,encoding='utf-8')
          PY

      - name: Validate V15
        shell: bash
        run: |
          set -euo pipefail
          node --check 1-4/audio-v15.js
          python - <<'PY'
          import json, pathlib
          reg=json.load(open('1-4/audio/registry.json',encoding='utf-8'))
          assert reg['version']==15
          assert len(reg.get('colors',[]))==10
          u=reg['users']['نور']
          assert 'Noour' in u['aliases'] and 'Nour' in u['aliases']
          for c in u['clips']:
            for f in c['files'].values(): assert pathlib.Path('1-4',f).exists(), f
          for c in reg['colors']:
            for f in c['files'].values(): assert pathlib.Path('1-4',f).exists(), f
          idx=pathlib.Path('1-4/index.html').read_text(encoding='utf-8')
          assert 'audio-v15.js?v=15' in idx and 'var LOCAL=15' in idx
          assert "speakSmart('اللون '+colors[i].name,true)" in idx
          print('V15 legacy audio validation OK')
          PY
          test "$(find 1-4/audio/noor -name '*.mp3' | wc -l)" -ge 9
          test "$(find 1-4/audio/noor -name '*.ogg' | wc -l)" -ge 9
          test "$(find 1-4/audio/noor -name '*.wav' | wc -l)" -ge 9
          test "$(find 1-4/audio/colors -name '*.mp3' | wc -l)" -eq 10
          test "$(find 1-4/audio/colors -name '*.ogg' | wc -l)" -eq 10
          test "$(find 1-4/audio/colors -name '*.wav' | wc -l)" -eq 10

      - name: Commit V15 compatibility assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 1-4/index.html 1-4/sw.js 1-4/version.json 1-4/audio/registry.json 1-4/audio/noor 1-4/audio/colors
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add V15 legacy tablet multi-format recorded audio"
          git push
