name: Final Calm Child-First Release Cache Verification
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-calm-child-release-once.yml
permissions:
  contents: write
jobs:
  verify-and-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rebuild original app cache metadata
        run: node tooling/build-offline-catalog.js
      - name: Run focused UI, existing contract and audio cache checks
        run: |
          node tooling/verify-calm-child-first.cjs
          npm --prefix apps/1-4/calm-with-me run validate
          npm --prefix apps/1-4/calm-with-me run validate:contract
          node - <<'JS'
          const fs=require('fs'),crypto=require('crypto'),assert=require('assert');
          const root='apps/1-4/calm-with-me/';
          const catalog=JSON.parse(fs.readFileSync('data/offline/a1-calm.json','utf8'));
          const audio=catalog.files.filter(x=>x.path.startsWith(root+'audio/')&&x.path.endsWith('.mp3'));
          assert.equal(audio.length,370,'expected 370 real prerecorded voice files');
          for(const lang of ['ar','en'])assert(audio.some(x=>x.path===root+'audio/intro/coach-'+lang+'.mp3'));
          for(const p of [root+'app.js',root+'simple-mode-v12-original.js',root+'child-illustrations-v1.js']){
            const row=catalog.files.find(x=>x.path===p);
            assert(row,'offline file missing '+p);
            const bytes=fs.readFileSync(p);
            assert.equal(row.bytes,bytes.length,'stale size '+p);
            assert.equal(row.sha256,crypto.createHash('sha256').update(bytes).digest('hex'),'stale digest '+p);
          }
          const src=fs.readFileSync(root+'app.js','utf8');
          assert(src.includes('if(saved&&builtin&&!saved.image&&builtin.image)saved.image=builtin.image'),'legacy saved pictures migration');
          console.log('PASS 370 recorded MP3, 74 illustrated cards, offline SHA256 and old-user image migration');
          JS
      - name: Commit current official offline catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/offline/a1-calm.json data/offline-catalog.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh offline audio and child illustrations cache after main compatibility fix"
          git pull --rebase origin main
          git push origin HEAD:main
